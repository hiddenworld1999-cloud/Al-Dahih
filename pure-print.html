<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصفح الطباعة البيور - الدحيح</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: #0F172A;
            color: #F8FAFC;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1E293B;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            height: fit-content;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .header h2 { font-size: 1.3rem; font-weight: 900; color: #38BDF8; display: flex; align-items: center; gap: 8px; }
        .path-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0F172A;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .back-btn {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
        }
        .back-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .current-path {
            font-size: 0.85rem;
            color: #94A3B8;
            direction: ltr;
            text-align: left;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-list { display: flex; flex-direction: column; gap: 10px; }
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0F172A;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: 0.2s;
        }
        .item:hover { border-color: #38BDF8; background: #162238; }
        .item:active { transform: scale(0.98); }
        .item-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .item-name {
            font-weight: 700;
            font-size: 0.95rem;
            direction: ltr;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .folder-icon { color: #FBBF24; }
        .file-icon { color: #10B981; }
        .badge {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 800;
            flex-shrink: 0;
        }
        .badge-folder { background: rgba(251, 191, 36, 0.15); color: #FBBF24; }
        .badge-print { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        #status { text-align: center; padding: 30px 10px; color: #94A3B8; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2><span class="material-icons">print</span> الطباعة البيور</h2>
            <span style="font-size: 0.8rem; color: #64748B;">Al-Dahih</span>
        </div>

        <div class="path-bar">
            <button class="back-btn" id="backBtn" onclick="goBack()" disabled>
                <span class="material-icons" style="font-size:18px;">arrow_forward</span> رجوع
            </button>
            <div class="current-path" id="currentPath">/</div>
        </div>

        <div id="status">⏳ جاري تحميل الفولدرات والملفات...</div>
        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        const REPO_OWNER = 'hiddenworld1999-cloud';
        const REPO_NAME = 'Al-Dahih';
        let currentPath = '';

        async function loadFolder(path = '') {
            currentPath = path;
            const listEl = document.getElementById('fileList');
            const statusEl = document.getElementById('status');
            const pathEl = document.getElementById('currentPath');
            const backBtn = document.getElementById('backBtn');

            pathEl.innerText = '/' + path;
            backBtn.disabled = !path;
            listEl.innerHTML = '';
            statusEl.style.display = 'block';
            statusEl.innerText = '⏳ جاري التحميل...';

            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error('تعذر قراءة الفولدر من جيت هب');
                const items = await res.json();

                const folders = items.filter(i => i.type === 'dir');
                const htmlFiles = items.filter(i => i.type === 'file' && /\.(html|htm)$/i.test(i.name) && i.name !== 'pure-print.html');

                statusEl.style.display = 'none';

                if (folders.length === 0 && htmlFiles.length === 0) {
                    statusEl.style.display = 'block';
                    statusEl.innerText = '📂 مفيش ملفات HTML في الفولدر ده.';
                    return;
                }

                folders.forEach(folder => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.onclick = () => loadFolder(folder.path);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="material-icons folder-icon">folder</span>
                            <span class="item-name">${folder.name}</span>
                        </div>
                        <span class="badge badge-folder">فتح</span>
                    `;
                    listEl.appendChild(div);
                });

                htmlFiles.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.onclick = () => loadAndPrint(file.path);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="material-icons file-icon">description</span>
                            <span class="item-name">${file.name}</span>
                        </div>
                        <span class="badge badge-print">🖨️ طباعة</span>
                    `;
                    listEl.appendChild(div);
                });

            } catch (err) {
                statusEl.style.display = 'block';
                statusEl.innerText = '❌ ' + err.message;
            }
        }

        function goBack() {
            if (!currentPath) return;
            const parts = currentPath.split('/');
            parts.pop();
            loadFolder(parts.join('/'));
        }

        async function loadAndPrint(filePath) {
            const statusEl = document.getElementById('status');
            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '';
            statusEl.style.display = 'block';
            statusEl.innerText = '⏳ جاري تجهيز الملف للطباعة البيور...';

            let cleanUrl = window.location.origin + window.location.pathname.replace(/[^\/]+$/, '') + filePath.replace(/^\.?\//, '');

            try {
                const res = await fetch(cleanUrl + '?t=' + Date.now());
                if (!res.ok) throw new Error('الملف غير موجود');
                let html = await res.text();

                const basePath = cleanUrl.substring(0, cleanUrl.lastIndexOf('/') + 1);
                if (basePath && !html.includes('<base ')) {
                    html = html.replace(/<head[^>]*>/i, `$&<base href="${basePath}">`);
                }

                const urlObj = new URL(window.location.href);
                urlObj.searchParams.set('admin', 'daheeh');
                history.replaceState(null, '', urlObj.toString());

                const purePrintCSS = `
                    <style id="purePrintOverride">
                        #watermarkGrid, #antiScreenshotShield, .watermark, .watermark-overlay {
                            display: none !important;
                            visibility: hidden !important;
                            opacity: 0 !important;
                        }
                        /* التحكم الإجباري في إظهار أو إخفاء التعليلات */
                        body.show-explanations-print .q-explanation,
                        body.show-explanations-print .explanation,
                        body.show-explanations-print [id^="exp-"] {
                            display: block !important;
                        }
                        body.hide-explanations-print .q-explanation,
                        body.hide-explanations-print .explanation,
                        body.hide-explanations-print [id^="exp-"] {
                            display: none !important;
                        }
                        @page { size: A4 portrait; margin: 0; }
                        @media print {
                            html, body {
                                display: block !important;
                                visibility: visible !important;
                            }
                            * {
                                -webkit-print-color-adjust: exact !important;
                                print-color-adjust: exact !important;
                            }
                            .pure-print-bar, .info-btn, .submit-btn, #submitBtn, button[onclick*="submit"] {
                                display: none !important;
                            }
                            /* إلغاء تصغير الموبايل إجبارياً وقت الطباعة لكل الملفات */
                            .page-wrapper {
                                height: auto !important;
                                width: 100% !important;
                                margin: 0 !important;
                                padding: 0 !important;
                                overflow: visible !important;
                                display: block !important;
                            }
                            .a4-page {
                                transform: none !important;
                                zoom: normal !important;
                                width: 794px !important;
                                margin: 0 auto !important;
                            }
                            /* وضع التدفق المستمر لبنوك الأسئلة المحلولة لمنع الصفحات الفاضية */
                            body.continuous-print {
                                padding: 10mm 0 !important;
                            }
                            body.continuous-print .page-wrapper {
                                break-after: auto !important;
                                page-break-after: auto !important;
                                break-inside: auto !important;
                                page-break-inside: auto !important;
                                margin: 0 !important;
                                padding: 0 !important;
                                height: auto !important;
                                overflow: visible !important;
                            }
                            body.continuous-print .a4-page {
                                height: auto !important;
                                min-height: 0 !important;
                                overflow: visible !important;
                                padding: 0 15px !important;
                                margin: 0 auto !important;
                                border: none !important;
                                box-shadow: none !important;
                            }
                            body.continuous-print .footer-bar {
                                display: none !important;
                            }
                            body.continuous-print .q-card,
                            body.continuous-print .section-divider {
                                break-inside: avoid !important;
                                page-break-inside: avoid !important;
                            }
                        }
                        .pure-print-bar {
                            position: fixed; bottom: 20px; left: 20px; z-index: 9999999;
                            display: flex; gap: 10px; align-items: center;
                        }
                        .pure-print-fab {
                            background: #10B981; color: #fff; border: none; padding: 12px 20px;
                            border-radius: 50px; font-family: 'Cairo', sans-serif; font-size: 15px;
                            font-weight: 900; cursor: pointer; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
                        }
                        .pure-toggle-fab {
                            background: #1E293B; color: #F8FAFC; border: 2px solid #38BDF8; padding: 10px 16px;
                            border-radius: 50px; font-family: 'Cairo', sans-serif; font-size: 13px;
                            font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
                        }
                    </style>
                `;

                const purePrintControls = `
                    <div class="pure-print-bar">
                        <button class="pure-print-fab" onclick="window.print()">🖨️ حفظ PDF / طباعة</button>
                        <button class="pure-toggle-fab" id="toggleExpBtn" onclick="togglePrintExplanations()">التعليلات: مخفية 🚫</button>
                    </div>
                    <script>
                        function updateExpBtnText() {
                            const btn = document.getElementById('toggleExpBtn');
                            if (!btn) return;
                            const isShown = document.body.classList.contains('show-explanations-print');
                            btn.innerText = isShown ? 'التعليلات: ظاهرة 👁️' : 'التعليلات: مخفية 🚫';
                        }

                        function togglePrintExplanations() {
                            if (document.body.classList.contains('show-explanations-print')) {
                                document.body.classList.remove('show-explanations-print', 'continuous-print');
                                document.body.classList.add('hide-explanations-print');
                            } else {
                                document.body.classList.remove('hide-explanations-print');
                                document.body.classList.add('show-explanations-print', 'continuous-print');
                            }
                            updateExpBtnText();
                        }

                        window.addEventListener('load', () => {
                            const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
                            ready.then(() => {
                                setTimeout(() => {
                                    const hasSubmitBtn = document.body.innerText.includes('تسليم الامتحان');
                                    const isSolvedExam = !hasSubmitBtn && (document.querySelector('.option.correct') !== null);

                                    if (isSolvedExam && document.querySelector('.q-explanation, .explanation, [id^="exp-"]')) {
                                        document.body.classList.add('show-explanations-print', 'continuous-print');
                                    } else {
                                        document.body.classList.add('hide-explanations-print');
                                    }
                                    updateExpBtnText();
                                    window.print();
                                }, 600);
                            });
                        });
                    <\/script>
                `;

                html = html.replace(/<\/head>/i, purePrintCSS + '</head>');
                html = html.replace(/<\/body>/i, purePrintControls + '</body>');

                document.open();
                document.write(html);
                document.close();

            } catch (err) {
                statusEl.innerText = '❌ حصل خطأ: ' + err.message;
            }
        }

        window.onload = () => {
            const fileParam = new URLSearchParams(window.location.search).get('file');
            if (fileParam) {
                loadAndPrint(fileParam);
            } else {
                loadFolder('');
            }
        };
    </script>
</body>
</html>
