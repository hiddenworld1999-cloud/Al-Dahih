<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>امتحان تفاعلي ميد ترم - مادة بحوث العمليات (الأساليب الكمية)</title>
    
    <!-- ================= بداية كود الحماية الموحد ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>
    <style>
        * { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
        #antiScreenshotShield { position: fixed; inset: 0; background: #020202; color: #ffffff; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 999999; font-family: 'Cairo', sans-serif; text-align: center; }
        #watermarkGrid { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around; opacity: 0.12; }
        .watermark-item { transform: rotate(-25deg); color: #ffffff; font-size: 15px; font-weight: 800; white-space: nowrap; padding: 35px; font-family: monospace; user-select: none; mix-blend-mode: difference; text-shadow: 0 0 2px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.6); }
    </style>
    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || (e.ctrlKey && ['s', 'c', 'u'].includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) || e.key === 'F12') { e.preventDefault(); }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);
            let sName = "طالب الدحيح", sCode = "";
            try { sName = localStorage.getItem('studentName') || "طالب الدحيح"; sCode = localStorage.getItem('studentCode') || "0000"; } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);
            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* تصميم مخصص لمادة بحوث العمليات / الأساليب الكمية */
        :root {
            --bg-body: #E2E8F0;
            --bg-page: #F8FAFC;
            --text-main: #0F172A;
            --text-muted: #475569;
            --emerald-dark: #065F46;
            --emerald-light: #10B981;
            --accent-primary: #0284C7;
            --accent-soft: #E0F2FE;
            --navy-blue: #0F172A;
            --red-alert: #B91C1C;
            --heading-main: #1E3A8A;
            --border-color: #CBD5E1;
            --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            overflow-x: hidden !important; 
            width: 100%; 
            background-color: var(--bg-body);
            direction: rtl;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            line-height: 1.5; 
            padding: 60px 0 90px 0; /* مساحة للشريط العلوي والسفلي */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--heading-main); border-radius: 8px; }

        /* ============ الشريط العلوي (التقدم) ============ */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(248, 250, 252, 0.96); backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(15, 23, 42, 0.08); z-index: 1000;
            display: flex; justify-content: center; padding: 9px 12px;
            border-bottom: 2px solid var(--accent-primary);
        }
        .top-bar-content {
            width: 100%; max-width: 794px;
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
        }
        .top-bar-title { font-weight: 800; font-size: 15px; color: var(--heading-main); white-space: nowrap; }
        .progress-container { flex: 1; background: rgba(15, 23, 42, 0.08); height: 8px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--heading-main), var(--accent-primary), var(--emerald-light)); width: 0%; transition: width 0.4s ease; }
        .progress-text { font-weight: 700; font-size: 13px; color: var(--text-muted); min-width: 68px; text-align: left; }

        /* ============ الحاوية الأساسية للورقة ============ */
        .page-wrapper {
            width: 100%; display: flex; justify-content: center;
            margin-bottom: 20px; overflow: hidden; padding: 0 10px; 
        }
        
        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            background-image: radial-gradient(#CBD5E1 0.65px, transparent 0.65px);
            background-size: 18px 18px;
            width: 794px; min-height: 1123px; height: auto;
            padding: 12px 12px 42px 12px; 
            border: 2px solid var(--accent-primary); border-radius: 4px;
            box-shadow: var(--card-shadow); position: relative;
            display: flex; flex-direction: column;
            transform-origin: top center; flex-shrink: 0;
        }

        .a4-page::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--navy-blue), var(--accent-primary), var(--emerald-light));
            z-index: 10;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background-image: url('https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg');
            background-repeat: no-repeat; background-position: center; background-size: contain;
            opacity: 0.04; pointer-events: none; z-index: 0; filter: grayscale(100%);
        }

        .content-wrapper {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            width: 100%; align-items: stretch; flex-grow: 1;
        }

        .hero-header {
            text-align: center;
            padding: 8px 0 12px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.06), rgba(2, 132, 199, 0.08));
            border-radius: 8px;
            border-bottom: 2px solid var(--accent-primary);
        }
        .hero-header h1 { font-family: 'Amiri', serif; font-size: 32px; font-weight: 700; color: var(--heading-main); margin-bottom: 4px; }
        .hero-header p { font-size: 18px; color: var(--accent-primary); font-weight: 800; }

        .main-title-banner {
            background: linear-gradient(90deg, rgba(30, 58, 138, 0.08), rgba(2, 132, 199, 0.1));
            border-right: 4px solid var(--accent-primary); border-radius: 6px;
            padding: 8px 15px; font-size: 15px; font-weight: 800; color: var(--heading-main);
            margin: 4px 0 12px 0; display: flex; align-items: center; gap: 8px;
        }

        .section-divider {
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.08), rgba(2, 132, 199, 0.12));
            border: 1.5px dashed var(--accent-primary); color: var(--heading-main);
            text-align: center; padding: 7px; border-radius: 8px;
            font-weight: 800; margin: 6px 0 12px 0; font-size: 20px;
        }

        /* صندوق المعطيات / مقدمة الرسومات */
        .context-banner {
            background: #EFF6FF;
            border: 1px solid #93C5FD;
            border-right: 4px solid var(--heading-main);
            color: var(--heading-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16.5px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.45;
        }

        /* حاوية الصور البيانية */
        .q-figure-box {
            background: #FFFFFF;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .q-figure-box img {
            max-width: 100%;
            max-height: 225px;
            width: auto;
            height: auto;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 11px 14px; margin-bottom: 10px; 
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03); position: relative;
            border-right: 4px solid var(--accent-primary); transition: all 0.3s;
        }

        .q-card.missed {
            border-color: var(--red-alert) !important;
            box-shadow: 0 0 15px rgba(185, 28, 28, 0.2) !important;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
        .q-head-right { display: flex; align-items: center; gap: 10px; }
        
        .q-num {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; background: rgba(2, 132, 199, 0.12); color: var(--heading-main);
            font-weight: 800; font-size: 17px;
        }

        .info-btn {
            display: none; width: 30px; height: 30px; border-radius: 50%;
            background: transparent; border: 2px solid var(--accent-primary); color: var(--accent-primary);
            font-size: 15px; font-weight: 800; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
        }
        .info-btn:hover { background: rgba(2, 132, 199, 0.12); }
        .info-btn.active { background: var(--accent-primary); color: #FFF; }

        .q-text { margin: 0 0 9px 0; font-size: 18.5px; font-weight: 700; line-height: 1.5; color: var(--navy-blue); }

        /* ============ الخيارات (2x2) ============ */
        .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .option {
            position: relative; display: flex; flex-direction: row; align-items: center;
            justify-content: flex-start; gap: 8px; min-height: 38px; padding: 6px 10px;
            border: 1px solid var(--border-color); border-radius: 6px; background: #F8FAFC;
            font-size: 16.5px; font-weight: 600; color: var(--text-main); line-height: 1.4;
            cursor: pointer; transition: all 0.2s; overflow-wrap: break-word; word-break: break-word;
        }
        
        .option:hover { border-color: var(--accent-primary); background: #FFFFFF; }
        .option input { position: absolute; opacity: 0; pointer-events: none; }
        
        .option .letter {
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; background: #E2E8F0; color: var(--text-muted);
            font-size: 14px; font-weight: 800; flex-shrink: 0; transition: all 0.2s;
        }
        
        .option .opt-text { flex: 1; }

        /* الحالات التفاعلية */
        .option.selected { border-color: var(--accent-primary); background: rgba(2, 132, 199, 0.08); box-shadow: 0 0 8px rgba(2, 132, 199, 0.15); }
        .option.selected .letter { background: var(--accent-primary); color: #FFF; }
        .option.selected .opt-text { color: var(--heading-main); font-weight: 700; }
        .option.locked { pointer-events: none; }
        
        .option.correct { border-color: var(--emerald-light); background: rgba(16, 185, 129, 0.12); }
        .option.correct .letter { background: var(--emerald-light); color: #FFF; }
        .option.correct .opt-text { color: var(--emerald-dark); font-weight: 800; }
        
        .option.wrong { border-color: var(--red-alert); background: rgba(185, 28, 28, 0.06); }
        .option.wrong .letter { background: var(--red-alert); color: #FFF; }
        .option.wrong .opt-text { color: var(--red-alert); }

        .option .mark { margin-inline-start: auto; font-size: 20px; font-weight: bold; }

        .q-explanation {
            display: none; margin-top: 9px; padding: 9px 14px;
            background: #EFF6FF; border: 1px dashed var(--accent-primary);
            border-radius: 6px; font-size: 16.5px; font-weight: 600; color: #1E3A8A; line-height: 1.5;
        }
        .q-explanation strong { color: var(--emerald-dark); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .footer-bar {
            position: absolute; bottom: 14px; left: 25px; right: 25px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid rgba(2, 132, 199, 0.3); padding-top: 8px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 8px; }
        .footer-logo { width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--accent-primary); object-fit: cover; filter: grayscale(100%); }
        .footer-brand-name { font-size: 14px; font-weight: 900; color: var(--heading-main); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 700; }

        /* ============ الشريط السفلي (تسليم) ============ */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(248, 250, 252, 0.96); backdrop-filter: blur(10px);
            box-shadow: 0 -2px 15px rgba(15, 23, 42, 0.08); z-index: 1000;
            display: flex; justify-content: center; padding: 12px 15px;
            border-top: 2px solid var(--accent-primary);
        }

        .btn-submit {
            width: 100%; max-width: 794px; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, var(--heading-main), var(--accent-primary));
            color: #FFF; font-size: 18px; font-weight: 800; font-family: 'Cairo', sans-serif;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(30, 58, 138, 0.25);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30, 58, 138, 0.35); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #94A3B8; color: #FFF; cursor: not-allowed; box-shadow: none; }

        .btn-submit.ready {
            background: linear-gradient(90deg, var(--emerald-dark), var(--emerald-light));
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4); animation: pulseReady 2s infinite;
        }
        @keyframes pulseReady {
            0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.8); }
            100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        }

        .result-card {
            display: none; background: var(--bg-page);
            border: 2px solid var(--accent-primary); border-radius: 15px; padding: 25px;
            text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            width: 100%; max-width: 794px; margin-top: 20px;
        }
        .result-card h2 { color: var(--heading-main); margin-bottom: 10px; font-size: 30px; font-weight: 800; }
        .result-score { font-size: 64px; font-weight: 900; color: var(--emerald-dark); margin-bottom: 10px; text-shadow: 0 0 10px rgba(6, 95, 70, 0.15); }
        .result-score small { font-size: 30px; color: var(--text-muted); }
        .result-msg { color: var(--text-main); font-size: 20px; font-weight: 600; }

        /* ============ شاشة التنبيه (Modal) ============ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-page); border: 2px solid var(--red-alert); border-radius: 12px;
            padding: 25px 28px; width: 92%; max-width: 480px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: translateY(20px); transition: all 0.3s;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-icon { font-size: 60px; margin-bottom: 10px; animation: float 2s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .modal-content h2 { color: var(--red-alert); margin-bottom: 12px; font-size: 26px; font-weight: 900; }
        .modal-content p { color: var(--text-main); font-size: 18px; margin-bottom: 18px; line-height: 1.6; font-weight: 600; }
        .missed-badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; max-height: 140px; overflow-y: auto; padding: 5px; }
        .badge-missed {
            width: 44px; height: 44px; border-radius: 50%; background: rgba(185, 28, 28, 0.1);
            border: 2px solid var(--red-alert); color: var(--red-alert);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s;
        }
        .badge-missed:hover { background: var(--red-alert); color: #FFF; transform: scale(1.15); }
        .btn-close-modal {
            background: var(--heading-main); border: 2px solid var(--heading-main); color: #FFF;
            padding: 12px 25px; border-radius: 8px; font-size: 18px; font-weight: 800;
            font-family: inherit; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .btn-close-modal:hover { background: transparent; color: var(--heading-main); }

        /* ============ الطباعة ============ */
        @page { size: A4; margin: 0; }
        @media print {
            html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; display: block !important; overflow: visible !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .top-bar, .bottom-bar, .modal-overlay { display: none !important; }
            #antiScreenshotShield { display: none !important; }
            .page-wrapper { height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; display: block !important; break-after: page; page-break-after: always; break-inside: avoid; }
            .page-wrapper:last-child { break-after: auto; page-break-after: auto; }
            .a4-page { transform: none !important; box-shadow: none !important; height: 1123px !important; min-height: 1123px !important; overflow: hidden !important; margin: 0 auto; border-radius: 0 !important; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-title">Operations Research Exam</div>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0</div>
        </div>
    </div>

    <!-- شاشة التنبيه -->
    <div class="modal-overlay" id="missedModal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2>لسه مجاوبتش على كل الأسئلة!</h2>
            <p>باقي عليك <strong id="missedCount" style="color: var(--red-alert); font-size: 22px;">0</strong> أسئلة. اضغط على رقم السؤال عشان تروحله:</p>
            <div class="missed-badges" id="missedBadges"></div>
            <button class="btn-close-modal" onclick="closeMissedModal()">راجع الأسئلة</button>
        </div>
    </div>

    <!-- شريط النتيجة -->
    <div class="result-card" id="resultCard">
        <h2>تم تسليم الامتحان!</h2>
        <div class="result-score" id="resultScore">0 <small>/ 0</small></div>
        <p class="result-msg" id="resultMsg">جارٍ إرسال الدرجة للمنصة...</p>
    </div>

    <!-- الحاوية -->
    <div id="pagesContainer" style="display: contents;"></div>

    <!-- الشريط السفلي -->
    <div class="bottom-bar">
        <button class="btn-submit" id="submitBtn" onclick="submitExam()">تسليم الامتحان</button>
    </div>

<script>
const QUIZ = [
    {
        "section": "mcq",
        "text": "1- المكوّن (السكر): يجب استخدام ما لا يقل عن 500 كجم شهريًا، حيث يحتاج المنتج الأول إلى 12 جم من السكر، ويحتاج المنتج الثاني إلى 9 جم من السكر. يكون القيد:",
        "options": [
            "12X1 + 9X2 ≤ 500",
            "9X1 + 12X2 ≥ 500.000",
            "12X1 + 9X2 = 500",
            "12X1 + 9X2 ≥ 500.000"
        ],

const TF_START_INDEX = 69;
const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');

/* تثبيت اتجاه الرموز والمعادلات الرياضية (LTR) داخل النصوص العربية */
function formatMath(text) {
    if (!text) return '';
    const normalized = String(text).replace(/و(X[123])/g, 'و $1');
    const mathRegex = /(?:(?:Max|Min)\s+Z\s*=\s*)?(?:[0-9.]*X[123]|[0-9]+(?:\.[0-9]+)?|Z)(?:\s*(?:[≤≥<>+\-=]|,)\s*(?:[0-9.]*X[123]|[0-9]+(?:\.[0-9]+)?|Z))*(?:\s*[≤≥<>])?|(?:[≤≥<>]\s*[0-9]+(?:\.[0-9]+)?)|[≤≥<>]/g;
    return normalized.replace(mathRegex, (match) => {
        if (!/(?:X[123]|Z|[≤≥<>=])/.test(match)) return match;
        return `<span dir="ltr" style="unicode-bidi: isolate;">${match}</span>`;
    });
}

/* =========================================================
   التقسيم الذكي (Smart Pagination)
   ========================================================= */
function renderPaginatedPages() {
    container.innerHTML = '';
    
    // حاوية القياس المخفية
    const measureBox = document.createElement('div');
    measureBox.style.position = 'absolute';
    measureBox.style.visibility = 'hidden';
    measureBox.style.width = '770px'; 
    document.body.appendChild(measureBox);
    
    const measureWrapper = document.createElement('div');
    measureWrapper.className = 'content-wrapper';
    measureWrapper.style.padding = '0';
    measureBox.appendChild(measureWrapper);

    // قياس الهيدر
    measureWrapper.innerHTML = `
        <header class="hero-header">
            <h1>بنك أسئلة تفاعلي ميد ترم</h1>
            <p>مادة بحوث العمليات (الأساليب الكمية)</p>
        </header>
        <div class="main-title-banner">
            <span>📝</span> اختر الإجابة الصحيحة لكل سؤال، ثم اضغط "تسليم الامتحان" بالأسفل
        </div>
    `;
    const headerH = measureWrapper.offsetHeight;

    // قياس الفاصل
    measureWrapper.innerHTML = `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (صح / خطأ)</div>`;
    const dividerH = measureWrapper.offsetHeight; 

    // قياس كل سؤال (شاملاً المعطيات والصور المرفقة)
    const qHeights = QUIZ.map((q) => {
        let extraHTML = '';
        if (q.context) {
            extraHTML += `<div class="context-banner">${formatMath(q.context)}</div>`;
        }
        if (q.groupIntro) {
            extraHTML += `<div class="context-banner">${formatMath(q.groupIntro)}</div>`;
        }
        if (q.image) {
            extraHTML += `<div class="q-figure-box" style="height: 243px;"></div>`;
        }

        measureWrapper.innerHTML = `
            ${extraHTML}
            <div class="q-card">
                <div class="q-head">
                    <div class="q-head-right">
                        <span class="q-num">1</span>
                    </div>
                </div>
                <p class="q-text">${formatMath(q.text)}</p>
                <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                    ${q.options.map((opt, j) => `
                        <label class="option">
                            <span class="letter">${LETTERS[j]}</span>
                            <span class="opt-text">${formatMath(opt)}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
        return measureWrapper.offsetHeight;
    });

    document.body.removeChild(measureBox);

    // التوزيع الذكي
    const availableHeight = 1123 - 12 - 42 - 32;
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;

    for (let i = 0; i < QUIZ.length; i++) {
        let required = qHeights[i];
        
        if (pages.length === 0 && currentPage.length === 0) {
            required += headerH;
        }

        let forceBreak = false;
        if (i === TF_START_INDEX && currentPage.length > 0) {
            forceBreak = true;
            required += dividerH;
        }

        if (forceBreak || (currentPage.length > 0 && (currentHeight + required > availableHeight))) {
            pages.push(currentPage);
            currentPage = [];
            currentHeight = 0;
            
            if (forceBreak) {
                required = qHeights[i] + dividerH;
            } else {
                required = qHeights[i];
            }
        }

        currentPage.push(i);
        currentHeight += qHeights[i];

        if (pages.length === 0 && currentPage.length === 1) {
            currentHeight += headerH;
        }
        if (i === TF_START_INDEX) { 
            currentHeight += dividerH;
        }
    }
    if (currentPage.length > 0) {
        pages.push(currentPage);
    }

    // بناء HTML
    const totalPages = pages.length;

    const pagesHTML = pages.map((pageIndices, pageIdx) => {
        let pageHTML = `
        <div class="page-wrapper">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
        `;

        if (pageIdx === 0) {
            pageHTML += `
                <header class="hero-header">
                    <h1>بنك أسئلة تفاعلي ميد ترم</h1>
                    <p>مادة بحوث العمليات (الأساليب الكمية)</p>
                </header>
                <div class="main-title-banner">
                    <span>📝</span> اختر الإجابة الصحيحة لكل سؤال، ثم اضغط "تسليم الامتحان" بالأسفل
                </div>
            `;
        }

        pageIndices.forEach(globalIndex => {
            const q = QUIZ[globalIndex];
            
            if (globalIndex === TF_START_INDEX) {
                pageHTML += `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (صح / خطأ)</div>`;
            }

            if (q.context) {
                pageHTML += `<div class="context-banner">${formatMath(q.context)}</div>`;
            }
            if (q.groupIntro) {
                pageHTML += `<div class="context-banner">${formatMath(q.groupIntro)}</div>`;
            }
            if (q.image) {
                pageHTML += `
                    <div class="q-figure-box">
                        <img src="${q.image}" alt="شكل بياني" onload="scalePages()">
                    </div>
                `;
            }

            const hasExplanation = Boolean(q.explanation && q.explanation.trim().length > 0);

            pageHTML += `
                <div class="q-card" data-card="${globalIndex}">
                    <div class="q-head">
                        <div class="q-head-right">
                            <span class="q-num">${globalIndex + 1}</span>
                            ${hasExplanation ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                        </div>
                    </div>
                    <p class="q-text">${formatMath(q.text)}</p>
                    <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                        ${q.options.map((opt, j) => `
                            <label class="option" data-q="${globalIndex}" data-o="${j}" id="opt-${globalIndex}-${j}">
                                <input type="radio" name="q${globalIndex}" value="${j}" onchange="selectOption(${globalIndex}, ${j})">
                                <span class="letter">${LETTERS[j]}</span>
                                <span class="opt-text">${formatMath(opt)}</span>
                            </label>
                        `).join('')}
                    </div>
                    ${hasExplanation ? `
                    <div class="q-explanation" id="exp-${globalIndex}">
                        <strong>التعليل: </strong>${formatMath(q.explanation)}
                    </div>
                    ` : ''}
                </div>
            `;
        });

        pageHTML += `
                </div>
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIdx + 1} من ${totalPages} | مادة بحوث العمليات (الأساليب الكمية)</div>
                </div>
            </div>
        </div>
        `;
        return pageHTML;
    });

    container.innerHTML = pagesHTML.join('');

    updateProgress();
    updateSubmitBtn();
    setTimeout(scalePages, 100);
}

/* =========================================================
   تصغير الورقة للموبايل
   ========================================================= */
function scalePages() {
    const pageWidth = 794;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 20;
    const scale = Math.min(1, availableWidth / pageWidth);

    document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const page = wrapper.querySelector('.a4-page');
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            
            const actualHeight = page.offsetHeight; 
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('resize', scalePages);
window.addEventListener('orientationchange', scalePages);

/* =========================================================
   التفاعل والتسليم
   ========================================================= */
function updateProgress() {
    const answered = state.answers.filter(a => a !== null).length;
    const percent = (answered / QUIZ.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').innerText = `${answered} / ${QUIZ.length}`;
}

function updateSubmitBtn() {
    if (state.submitted) return;
    const missing = state.answers.filter(a => a === null).length;
    const btn = document.getElementById('submitBtn');
    
    if (missing === 0) {
        btn.innerHTML = 'تسليم الامتحان 🚀';
        btn.classList.add('ready');
    } else {
        btn.innerHTML = `تسليم الامتحان <span style="background: rgba(185,28,28,0.1); color: var(--red-alert); padding: 2px 10px; border-radius: 20px; font-size: 14px; border: 1px solid var(--red-alert);">باقي ${missing}</span>`;
        btn.classList.remove('ready');
    }
}

window.selectOption = function(qIndex, oIndex) {
    if (state.submitted) return;
    state.answers[qIndex] = oIndex;
    
    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
    
    const card = document.querySelector(`.q-card[data-card="${qIndex}"]`);
    if (card) card.classList.remove('missed');

    updateProgress();
    updateSubmitBtn();
};

window.goToQuestion = function(index) {
    closeMissedModal();
    const card = document.querySelector(`.q-card[data-card="${index}"]`);
    if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.transition = "box-shadow 0.3s";
        card.style.boxShadow = "0 0 20px var(--accent-primary)";
        setTimeout(() => { card.style.boxShadow = ""; }, 1500);
    }
};

window.closeMissedModal = function() {
    document.getElementById('missedModal').classList.remove('show');
};

function sendScoreToPlatform(score, total) {
    try {
        if (window.parent && window.parent !== window && typeof window.parent.saveInteractiveExamScore === 'function') {
            window.parent.saveInteractiveExamScore(score, total);
            return true;
        } else {
            console.log(`الدرجة: ${score} من ${total}`);
            return false;
        }
    } catch (e) {
        console.log("Error sending score: ", e);
        return false;
    }
}

window.submitExam = function() {
    if (state.submitted) return;

    const missingIndices = [];
    state.answers.forEach((ans, i) => {
        if (ans === null) missingIndices.push(i);
    });

    if (missingIndices.length > 0) {
        missingIndices.forEach(i => {
            const card = document.querySelector(`.q-card[data-card="${i}"]`);
            if (card) card.classList.add('missed');
        });

        const modal = document.getElementById('missedModal');
        const badgesContainer = document.getElementById('missedBadges');
        document.getElementById('missedCount').innerText = missingIndices.length;
        
        badgesContainer.innerHTML = missingIndices.map(i => 
            `<div class="badge-missed" onclick="goToQuestion(${i})">${i + 1}</div>`
        ).join('');

        modal.classList.add('show');
        return;
    }

    state.submitted = true;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.classList.remove('ready');
    submitBtn.innerText = 'تم التسليم ✅';

    let score = 0;

    QUIZ.forEach((q, i) => {
        const chosen = state.answers[i];
        const isCorrect = (chosen === q.correct);
        if (isCorrect) score++;

        const options = document.querySelectorAll(`.option[data-q="${i}"]`);
        options.forEach(opt => {
            opt.classList.add('locked');
            opt.classList.remove('selected');
            const oIndex = parseInt(opt.dataset.o);
            
            if (oIndex === q.correct) {
                opt.classList.add('correct');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
            }
            if (oIndex === chosen && !isCorrect) {
                opt.classList.add('wrong');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
            }
        });

        const infoBtn = document.getElementById(`btn-${i}`);
        if (infoBtn) infoBtn.style.display = 'flex';
    });

    const sent = sendScoreToPlatform(score, QUIZ.length);

    const resultCard = document.getElementById('resultCard');
    const resultScore = document.getElementById('resultScore');
    const resultMsg = document.getElementById('resultMsg');
    
    const percent = Math.round((score / QUIZ.length) * 100);
    let msg = percent >= 80 ? "ممتاز! أداء رائع 🎉" : (percent >= 50 ? "جيد جداً، واصل التقدم 👍" : "لا بأس، حاول مرة أخرى 💪");
    
    resultScore.innerHTML = `${score} <small>/ ${QUIZ.length}</small>`;
    resultMsg.innerText = msg + (sent ? " (تم إرسال الدرجة للمنصة)" : "");
    resultCard.style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    if (!expBox || !btn) return;
    
    const isCurrentlyOpen = expBox.classList.contains('show');

    document.querySelectorAll('.q-explanation').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.info-btn').forEach(el => el.classList.remove('active'));

    if (!isCurrentlyOpen) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }

    setTimeout(scalePages, 50); 
};

/* =========================================================
   انتظار تحميل الخطوط قبل الرسم
   ========================================================= */
function startRendering() {
    renderPaginatedPages();
}

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(startRendering).catch(startRendering);
} else if (document.readyState === 'complete') {
    startRendering();
} else {
    window.addEventListener('load', startRendering);
}
</script>
