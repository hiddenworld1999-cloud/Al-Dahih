    <!-- ================= بداية كود الحماية الموحد لمنصة الدحيح ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield {
            position: fixed; inset: 0; background: #020202; color: #fff;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 999999;
            font-family: 'Cairo', sans-serif; text-align: center;
        }
        #watermarkGrid {
            position: fixed; inset: 0; pointer-events: none; z-index: 99998;
            overflow: hidden; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; opacity: 0.12;
        }
        .watermark-item {
            transform: rotate(-25deg); color: #fff; font-size: 15px;
            font-weight: 800; white-space: nowrap; padding: 35px;
            font-family: monospace; user-select: none;
            mix-blend-mode: difference;
            text-shadow: 0 0 2px rgba(0,0,0,.8), 1px 1px 2px rgba(0,0,0,.6);
        }
    </style>

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || 
                      localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || 
                    (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                    e.key === 'F12') {
                    e.preventDefault();
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);

            let sName = "طالب الدحيح", sCode = "";
            try {
                sName = localStorage.getItem('studentName') || "طالب الدحيح";
                sCode = localStorage.getItem('studentCode') || "0000";
            } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);

            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية الموحد ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0B1120;
            --bg-page: #111827;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            
            --electric-blue: #3B82F6;
            --cyan: #06B6D4;
            --neon-green: #10B981;
            --neon-green-bg: rgba(16, 185, 129, 0.1);
            --neon-red: #EF4444;
            --neon-red-bg: rgba(239, 68, 68, 0.1);
            
            --border-glass: rgba(59, 130, 246, 0.2);
            --shadow-paper: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            overflow-x: hidden !important; 
            width: 100%; 
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08), transparent 40%);
            direction: rtl;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            line-height: 1.4;
            padding: 20px 0 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--electric-blue); border-radius: 8px; }

        /* ============ الحاوية الأساسية للورقة ============ */
        .page-wrapper {
            width: 100%;
            display: flex; justify-content: center;
            margin-bottom: 20px; 
            overflow: hidden;
            padding: 0 10px; 
        }
        
        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            width: 794px; 
            min-height: 1123px; 
            height: auto;
            padding: 10px 10px 40px 10px; 
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            box-shadow: var(--shadow-paper);
            position: relative;
            display: flex;
            flex-direction: column;
            transform-origin: top center; 
            flex-shrink: 0;
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--electric-blue), var(--cyan), transparent);
            opacity: 0.8; z-index: 10;
        }

        .watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background-image: url('https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        /* ============ الحاوية الداخلية ============ */
        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: stretch;
            flex-grow: 1;
        }

        .hero-header { text-align: center; padding: 2px 0 6px; margin-bottom: 6px; }
        .hero-header h1 {
            font-size: 24px; 
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--electric-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        .hero-header p { font-size: 14px; color: var(--text-muted); font-weight: 600; }

        .section-divider {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), rgba(6, 182, 212, 0.1));
            border: 1px dashed var(--cyan);
            color: var(--cyan);
            text-align: center;
            padding: 6px;
            border-radius: 6px;
            font-weight: 800;
            margin: 6px 0 10px 0;
            font-size: 16px;
            box-shadow: inset 0 0 10px rgba(6, 182, 212, 0.1);
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 8px 12px; 
            margin-bottom: 8px; 
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            transition: all 0.3s;
        }

        .q-head {
            display: flex; align-items: center; justify-content: flex-start;
            gap: 6px; margin-bottom: 6px;
        }
        
        .q-num {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; 
            background: rgba(59, 130, 246, 0.15);
            color: var(--cyan); 
            font-weight: 800; font-size: 14px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            font-family: 'Fira Code', monospace;
        }

        .info-btn {
            display: flex;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-size: 12px; font-weight: 800;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Fira Code', monospace;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.2);
        }
        .info-btn:hover { background: rgba(6, 182, 212, 0.1); box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        .info-btn.active { background: var(--cyan); color: var(--bg-body); box-shadow: 0 0 15px rgba(6, 182, 212, 0.8); }

        .q-text {
            margin: 0 0 8px 0; 
            font-size: 17px; 
            font-weight: 700; line-height: 1.4;
            color: #FFFFFF;
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; 
        }
        
        .option {
            position: relative;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 38px; 
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 15.5px; 
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .option .letter {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 800;
            flex-shrink: 0;
            font-family: 'Fira Code', monospace;
        }
        
        .option .opt-text { flex: 1; }

        /* حالة الإجابة الصحيحة */
        .option.correct { 
            border-color: var(--neon-green); 
            background: var(--neon-green-bg); 
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
        }
        .option.correct .letter { 
            background: var(--neon-green); 
            color: #000;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }
        .option.correct .opt-text { color: var(--neon-green); font-weight: 800; }
        .option.correct .mark { color: var(--neon-green); font-weight: bold; font-size: 18px; margin-inline-start: auto; text-shadow: 0 0 8px var(--neon-green); }

        /* ============ صندوق التعليل ============ */
        .q-explanation {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(6, 182, 212, 0.05);
            border: 1px dashed var(--cyan);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(6, 182, 212, 0.05);
        }
        .q-explanation strong { color: var(--cyan); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ فوتر الورقة ============ */
        .footer-bar {
            position: absolute; bottom: 10px; left: 15px; right: 15px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 6px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 6px; }
        .footer-logo { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--electric-blue); object-fit: cover; filter: grayscale(100%); }
        .footer-brand-name { font-size: 13px; font-weight: 900; color: var(--cyan); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 800; }

        /* ============ الطباعة ============ */
        @page { size: A4; margin: 0; }
        @media print {
            html, body {
                background: var(--bg-page) !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .page-wrapper {
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                display: block !important;
                break-after: page;
                page-break-after: always;
                break-inside: avoid;
            }
            .page-wrapper:last-child { break-after: auto; page-break-after: auto; }
            .a4-page {
                transform: none !important;
                box-shadow: none !important;
                height: 1123px !important;
                min-height: 1123px !important;
                overflow: hidden !important;
                margin: 0 auto;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');

/* =========================================================
   التقسيم الذكي (Smart Pagination)
   ========================================================= */
function renderPaginatedPages() {
    container.innerHTML = '';
    
    // 1. حاوية القياس المخفية
    const measureBox = document.createElement('div');
    measureBox.style.position = 'absolute';
    measureBox.style.visibility = 'hidden';
    measureBox.style.width = '774px'; // العرض الداخلي الفعلي للورقة
    document.body.appendChild(measureBox);
    
    const measureWrapper = document.createElement('div');
    measureWrapper.className = 'content-wrapper';
    measureBox.appendChild(measureWrapper);

    // 2. قياس الهيدر
    measureWrapper.innerHTML = `
        <header class="hero-header">
            <h1>أنظمة معلومات المؤسسات</h1>
            <p>النسخة المحلولة - اسئلة الميد ترم</p>
        </header>
    `;
    const headerH = measureWrapper.offsetHeight;

    // 3. قياس الفاصل
    measureWrapper.innerHTML = `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (True / False)</div>`;
    const dividerH = measureWrapper.offsetHeight + 16;

    // 4. قياس كل سؤال
    const qHeights = QUIZ.map((q) => {
        const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                          q.explanation === q.options[q.correct] || 
                          q.explanation.length <= q.options[q.correct].length + 3;
        
        measureWrapper.innerHTML = `
            <div class="q-card">
                <div class="q-head">
                    <span class="q-num">1</span>
                    ${!isGeneric ? `<button class="info-btn" style="display:flex;">!</button>` : ''}
                </div>
                <p class="q-text">${q.text}</p>
                <div class="q-options">
                    ${q.options.map((opt, j) => {
                        const isCorrect = (j === q.correct);
                        return `
                        <div class="option ${isCorrect ? 'correct' : ''}">
                            <span class="letter">${LETTERS[j]}</span>
                            <span class="opt-text">${opt}</span>
                            ${isCorrect ? '<span class="mark">✓</span>' : ''}
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
        return measureWrapper.offsetHeight + 8; // + margin
    });

    document.body.removeChild(measureBox);

    // 5. التوزيع الذكي على الصفحات
    const availableHeight = 1123 - 10 - 40 - 35; // مساحة الورقة
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;

    for (let i = 0; i < QUIZ.length; i++) {
        let required = qHeights[i];
        
        if (pages.length === 0 && currentPage.length === 0) {
            required += headerH;
        }

        // إجبار صفحة جديدة لأسئلة الصح والخطأ (السؤال 31)
        let forceBreak = false;
        if (i === 31 && currentPage.length > 0) {
            forceBreak = true;
            required += dividerH;
        }

        if (forceBreak || (currentPage.length > 0 && (currentHeight + required > availableHeight))) {
            pages.push(currentPage);
            currentPage = [];
            currentHeight = 0;
            
            if (forceBreak) {
                required = qHeights[i] + dividerH;
            } else {
                required = qHeights[i];
            }
        }

        currentPage.push(i);
        currentHeight += qHeights[i];

        if (pages.length === 0 && currentPage.length === 1) {
            currentHeight += headerH;
        }
        if (i === 31) {
            currentHeight += dividerH;
        }
    }
    if (currentPage.length > 0) {
        pages.push(currentPage);
    }

    // 6. بناء HTML للصفحات
    const totalPages = pages.length;

    pages.forEach((pageIndices, pageIdx) => {
        let pageHTML = `
        <div class="page-wrapper">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
        `;

        if (pageIdx === 0) {
            pageHTML += `
                <header class="hero-header">
                    <h1>أنظمة معلومات المؤسسات</h1>
                    <p>النسخة المحلولة - اسئلة الميد ترم</p>
                </header>
            `;
        }

        pageIndices.forEach(globalIndex => {
            const q = QUIZ[globalIndex];
            
            if (globalIndex === 31) {
                pageHTML += `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (True / False)</div>`;
            }

            const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                              q.explanation === q.options[q.correct] || 
                              q.explanation.length <= q.options[q.correct].length + 3;

            pageHTML += `
                <div class="q-card" data-card="${globalIndex}">
                    <div class="q-head">
                        <span class="q-num">${globalIndex + 1}</span>
                        ${!isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                    </div>
                    <p class="q-text">${q.text}</p>
                    <div class="q-options">
                        ${q.options.map((opt, j) => {
                            const isCorrect = (j === q.correct);
                            return `
                            <div class="option ${isCorrect ? 'correct' : ''}">
                                <span class="letter">${LETTERS[j]}</span>
                                <span class="opt-text">${opt}</span>
                                ${isCorrect ? '<span class="mark">✓</span>' : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>
                    ${!isGeneric ? `
                    <div class="q-explanation" id="exp-${globalIndex}">
                        <strong>التعليل: </strong>${q.explanation}
                    </div>
                    ` : ''}
                </div>
            `;
        });

        pageHTML += `
                </div>
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIdx + 1} من ${totalPages} | أنظمة معلومات المؤسسات</div>
                </div>
            </div>
        </div>
        `;

        container.innerHTML += pageHTML;
    });

    // 7. تصغير الورقة للموبايل
    setTimeout(scalePages, 100);
}

/* =========================================================
   تصغير الورقة للموبايل وإزالة المساحات السوداء
   ========================================================= */
function scalePages() {
    const pageWidth = 794;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 20;
    const scale = Math.min(1, availableWidth / pageWidth);

    document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const page = wrapper.querySelector('.a4-page');
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            
            const actualHeight = page.offsetHeight; 
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('load', scalePages);
window.addEventListener('resize', scalePages);
window.addEventListener('orientationchange', scalePages);

/* =========================================================
   فتح تعليل واحد بس وقفل الباقي (Accordion)
   ========================================================= */
window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    const isCurrentlyOpen = expBox.classList.contains('show');

    document.querySelectorAll('.q-explanation').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.info-btn').forEach(el => el.classList.remove('active'));

    if (!isCurrentlyOpen) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }

    setTimeout(scalePages, 50); 
};

/* ===== تشغيل ===== */
renderPaginatedPages();
</script>
