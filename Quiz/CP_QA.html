<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>امتحان برمجة الحاسب | منصة الدحيح</title>
    
    <!-- ================= بداية كود الحماية الموحد لمنصة الدحيح ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield {
            position: fixed; inset: 0; background: #020202; color: #fff;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 999999;
            font-family: 'Cairo', sans-serif; text-align: center;
        }
        #watermarkGrid {
            position: fixed; inset: 0; pointer-events: none; z-index: 99998;
            overflow: hidden; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; opacity: 0.12;
        }
        .watermark-item {
            transform: rotate(-25deg); color: #fff; font-size: 15px;
            font-weight: 800; white-space: nowrap; padding: 35px;
            font-family: monospace; user-select: none;
            mix-blend-mode: difference;
            text-shadow: 0 0 2px rgba(0,0,0,.8), 1px 1px 2px rgba(0,0,0,.6);
        }
    </style>

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || 
                      localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || 
                    (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                    e.key === 'F12') {
                    e.preventDefault();
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة الامتحان.</p>`;
            document.body.appendChild(shield);

            let sName = "طالب الدحيح", sCode = "";
            try {
                sName = localStorage.getItem('studentName') || "طالب الدحيح";
                sCode = localStorage.getItem('studentCode') || "0000";
            } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);

            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية الموحد ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #020202;
            --bg-page: #0A0A0F;
            --bg-card: rgba(20, 20, 25, 0.6);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            
            --neon-cyan: #00F0FF;
            --neon-purple: #B026FF;
            --neon-green: #00FF41;
            --neon-red: #FF003C;
            --neon-yellow: #FFD700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(176, 38, 255, 0.05), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 30%);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 10px 100px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 8px; }

        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            width: 100%;
            max-width: 820px;
            min-height: 1150px;
            padding: 30px 35px 70px 35px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            opacity: 0.8;
            z-index: 10;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .hero-header { text-align: center; padding: 10px 0 15px; margin-bottom: 10px; }
        .hero-header h1 {
            font-size: 1.8rem; font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .hero-header p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

        .main-title-banner {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.15), rgba(0, 240, 255, 0.15));
            border-right: 4px solid var(--neon-cyan);
            border-radius: 6px;
            padding: 8px 15px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--neon-cyan);
            margin: 5px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* فاصل الأقسام */
        .section-divider {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan);
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            margin: 15px 0;
            font-size: 15px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            transition: all 0.3s;
        }

        .q-card.missed {
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.3) !important;
            animation: shake 0.5s ease-in-out;
        }
        .q-card.missed::after {
            content: '⚠️ لم يتم الإجابة';
            position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%);
            background: var(--neon-red);
            color: #fff;
            padding: 2px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 0 10px var(--neon-red);
            z-index: 5;
            white-space: nowrap;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .q-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 8px;
        }
        .q-head-right { display: flex; align-items: center; gap: 10px; }
        
        .q-num {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; 
            background: rgba(176, 38, 255, 0.15);
            color: var(--neon-purple); 
            font-weight: 800; font-size: 13px;
            border: 1px solid rgba(176, 38, 255, 0.3);
            font-family: 'Fira Code', monospace;
        }

        .info-btn {
            display: none;
            width: 26px; height: 26px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 14px; font-weight: 800;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Fira Code', monospace;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }
        .info-btn:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        .info-btn.active { background: var(--neon-cyan); color: var(--bg-body); box-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }

        .q-text {
            margin: 0 0 12px 0; font-size: 14.5px; font-weight: 700; line-height: 1.5;
            color: #FFFFFF;
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .option {
            position: relative;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 45px;
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            cursor: pointer;
            transition: all 0.2s;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .option:hover { border-color: rgba(0, 240, 255, 0.4); }
        .option input { position: absolute; opacity: 0; pointer-events: none; }
        
        .option .letter {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
            font-family: 'Fira Code', monospace;
            transition: all 0.2s;
        }
        
        .option .opt-text { flex: 1; }

        .option.selected {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }
        .option.selected .letter {
            background: var(--neon-cyan);
            color: #000;
        }

        .option.locked { pointer-events: none; }
        
        .option.correct { 
            border-color: var(--neon-green); 
            background: rgba(0, 255, 65, 0.08); 
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.15);
        }
        .option.correct .letter { background: var(--neon-green); color: #000; }
        .option.correct .opt-text { color: var(--neon-green); font-weight: 800; }
        
        .option.wrong { 
            border-color: var(--neon-red); 
            background: rgba(255, 0, 60, 0.08); 
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.15);
        }
        .option.wrong .letter { background: var(--neon-red); color: #fff; }
        .option.wrong .opt-text { color: var(--neon-red); }

        .option .mark { margin-inline-start: auto; font-size: 14px; font-weight: bold; }

        .q-explanation {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.6;
        }
        .q-explanation strong { color: var(--neon-cyan); }
        .q-explanation.show { display: block; }

        .footer-bar {
            position: absolute;
            bottom: 15px; left: 35px; right: 35px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 10px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 6px; }
        .footer-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--neon-cyan); object-fit: cover; }
        .footer-brand-name { font-size: 13px; font-weight: 900; color: var(--neon-cyan); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 800; }

        /* ============ زرار التسليم ============ */
        .submit-container {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            z-index: 1000;
        }

        .btn-submit {
            width: 100%;
            max-width: 820px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; }

        .btn-submit.ready {
            background: linear-gradient(90deg, var(--neon-green), #00cc33);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.6);
            animation: pulseReady 2s infinite;
        }
        @keyframes pulseReady {
            0% { box-shadow: 0 0 15px rgba(0, 255, 65, 0.4); }
            50% { box-shadow: 0 0 35px rgba(0, 255, 65, 0.8); }
            100% { box-shadow: 0 0 15px rgba(0, 255, 65, 0.4); }
        }

        .result-card {
            display: none;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(176, 38, 255, 0.1));
            border: 2px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            width: 100%;
            max-width: 820px;
            margin-top: 20px;
        }
        .result-card h2 { color: var(--neon-cyan); margin-bottom: 10px; font-size: 24px; }
        .result-score { font-size: 40px; font-weight: 900; color: #fff; margin-bottom: 5px; text-shadow: 0 0 10px var(--neon-cyan); }
        .result-msg { color: var(--text-muted); font-size: 14px; }

        /* ============ شاشة التنبيه (Modal) ============ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-page);
            border: 2px solid var(--neon-red);
            border-radius: 15px;
            padding: 25px 30px;
            width: 90%; max-width: 450px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.4);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .modal-overlay.show .modal-content { transform: translateY(0) scale(1); }
        .modal-icon { font-size: 50px; margin-bottom: 10px; animation: float 2s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .modal-content h2 { color: var(--neon-red); margin-bottom: 10px; font-size: 22px; }
        .modal-content p { color: var(--text-main); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
        .missed-badges {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px;
        }
        .badge-missed {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255, 0, 60, 0.1);
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; font-family: 'Fira Code', monospace;
            cursor: pointer; transition: all 0.2s;
        }
        .badge-missed:hover {
            background: var(--neon-red); color: #fff;
            transform: scale(1.1); box-shadow: 0 0 15px var(--neon-red);
        }
        .btn-close-modal {
            background: transparent; border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 10px 25px; border-radius: 8px;
            font-size: 16px; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .btn-close-modal:hover { background: var(--neon-cyan); color: #000; }

        @media (max-width: 850px) {
            body { padding: 0 0 90px 0; }
            .a4-page { padding: 15px 15px 60px 15px; border-radius: 0; border: none; border-bottom: 2px solid var(--neon-purple); min-height: auto; margin-bottom: 10px; }
            .footer-bar { left: 15px; right: 15px; bottom: 10px; }
            .hero-header h1 { font-size: 1.5rem; }
            .q-options { grid-template-columns: 1fr 1fr; gap: 6px; }
            .option { min-height: 40px; padding: 6px 8px; font-size: 11.5px; }
            .option .letter { width: 22px; height: 22px; font-size: 11px; }
            .q-text { font-size: 13.5px; }
            .btn-submit { font-size: 16px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- شاشة التنبيه للأسئلة الناقصة -->
    <div class="modal-overlay" id="missedModal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2>لسه مجاوبتش على كل الأسئلة!</h2>
            <p>باقي عليك <strong id="missedCount" style="color: var(--neon-red); font-size: 20px;">0</strong> أسئلة. اضغط على رقم السؤال عشان تروحله:</p>
            <div class="missed-badges" id="missedBadges"></div>
            <button class="btn-close-modal" onclick="closeMissedModal()">راجع الأسئلة</button>
        </div>
    </div>

    <!-- شريط النتيجة -->
    <div class="result-card" id="resultCard">
        <h2>تم تسليم الامتحان!</h2>
        <div class="result-score" id="resultScore">0 / 0</div>
        <p class="result-msg" id="resultMsg">جارٍ إرسال الدرجة للمنصة...</p>
    </div>

    <!-- الحاوية اللي هتترسم فيها ورق الـ A4 -->
    <div id="pagesContainer" style="display: contents;"></div>

    <!-- زرار التسليم ثابت تحت -->
    <div class="submit-container" id="submitContainer">
        <button class="btn-submit" id="submitBtn" onclick="submitExam()">تسليم الامتحان</button>
    </div>

<script>
const QUIZ = [
    { text: "أول مرحلة من مراحل حل المشكلات (Problem Solving) هي:", options: ["تنفيذ الخطة", "تفهم المشكلة", "فحص النتيجة", "تخطيط الحل"], correct: 1, explanation: "تبدأ العملية بفهم متطلبات المشكلة وجمع المعلومات اللازمة قبل التخطيط والتنفيذ والاختبار." },
    { text: "أي مما يلي يعد شرطاً أساسياً في الخوارزمية (Algorithm)؟", options: ["أن تتكرر بلا نهاية", "أن تُكتب بلغة الآلة فقط", "أن تنتهي بعد عدد محدود من الخطوات", "أن تحتوي على تعليمات غامضة"], correct: 2, explanation: "يجب ان تكون كل تعليمه دقيقه وغير غامضة / وأن تنتهي الخوارزمية بعد عدد محدود من الخطوات (Finite steps)." },

    { text: "يُعد نموذج V-Model نسخة محسنة من نموذج الشلال تركز على التحقق والتأكد في كل مرحلة.", options: ["صح (True)", "خطأ (False)"], correct: 0, explanation: "وهو غير مرن ويتطلب توثيقاً كبيراً." },
    { text: "تسجيل الخروج (Logout) في المثال يتم بحذف جدول users من قاعدة البيانات.", options: ["صح (True)", "خطأ (False)"], correct: 1, explanation: "يتم تسجيل الخروج بمسح بيانات الجلسة بالأمر session.clear()." },
    { text: "عند فشل تسجيل الدخول يُفضل عرض رسالة عامة واحدة مثل Invalid username or password.", options: ["صح (True)", "خطأ (False)"], correct: 0, explanation: "حتى لا يعرف المهاجم أسماء المستخدمين الموجودة في النظام." }
];

const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');
const QUESTIONS_PER_PAGE = 5;

let state = {
    answers: new Array(QUIZ.length).fill(null),
    submitted: false,
    scoreSent: false
};

function renderPages() {
    let html = '';
    const totalPages = Math.ceil(QUIZ.length / QUESTIONS_PER_PAGE);

    for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
        const start = pageIndex * QUESTIONS_PER_PAGE;
        const pageQuestions = QUIZ.slice(start, start + QUESTIONS_PER_PAGE);

        html += `
        <div class="a4-page">
            <div class="content-wrapper">
                ${pageIndex === 0 ? `
                    <header class="hero-header">
                        <h1>MIDTERM EXAM</h1>
                        <p>امتحان برمجة الحاسب - أجب عن جميع الأسئلة</p>
                    </header>
                    <div class="main-title-banner">
                        <span>📝</span> اختر الإجابة الصحيحة لكل سؤال، ثم اضغط "تسليم الامتحان" بالأسفل
                    </div>
                ` : ''}

                ${pageQuestions.map((q, qIndex) => {
                    const globalIndex = start + qIndex;
                    
                    let sectionDivider = '';
                    if (globalIndex === 32) { // تحديث رقم الفاصل بعد إضافة السؤال
                        sectionDivider = `
                        <div class="section-divider">
                            القسم الثاني: أسئلة الصواب والخطأ (True / False)
                        </div>
                        `;
                    }

                    const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                                      q.explanation === q.options[q.correct] || 
                                      q.explanation.length <= q.options[q.correct].length + 3;

                    return `
                    ${sectionDivider}
                    <div class="q-card" data-card="${globalIndex}">
                        <div class="q-head">
                            <div class="q-head-right">
                                <span class="q-num">${globalIndex + 1}</span>
                                ${!isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                            </div>
                        </div>
                        <p class="q-text">${q.text}</p>
                        <div class="q-options">
                            ${q.options.map((opt, j) => `
                                <label class="option" data-q="${globalIndex}" data-o="${j}" id="opt-${globalIndex}-${j}">
                                    <input type="radio" name="q${globalIndex}" value="${j}" onchange="selectOption(${globalIndex}, ${j})">
                                    <span class="letter">${LETTERS[j]}</span>
                                    <span class="opt-text">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        ${!isGeneric ? `
                        <div class="q-explanation" id="exp-${globalIndex}">
                            <strong>التعليل: </strong>${q.explanation}
                        </div>
                        ` : ''}
                    </div>
                    `;
                }).join('')}
            </div>
            
            <div class="footer-bar">
                <div class="footer-brand">
                    <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                    <div class="footer-brand-name">الدحيح</div>
                </div>
                <div class="footer-center-text">صفحة ${pageIndex + 1} من ${totalPages} | اسئلة برمجة الحاسب</div>
            </div>
        </div>
        `;
    }
    container.innerHTML = html;
    updateSubmitBtn();
}

function updateSubmitBtn() {
    if (state.submitted) return;
    const missing = state.answers.filter(a => a === null).length;
    const btn = document.getElementById('submitBtn');
    
    if (missing === 0) {
        btn.innerHTML = 'تسليم الامتحان 🚀';
        btn.classList.add('ready');
    } else {
        btn.innerHTML = `تسليم الامتحان <span style="background: rgba(255,0,60,0.2); color: var(--neon-red); padding: 2px 10px; border-radius: 20px; font-size: 14px; border: 1px solid var(--neon-red);">باقي ${missing}</span>`;
        btn.classList.remove('ready');
    }
}

window.selectOption = function(qIndex, oIndex) {
    if (state.submitted) return;
    state.answers[qIndex] = oIndex;
    
    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
    
    const card = document.querySelector(`.q-card[data-card="${qIndex}"]`);
    if (card) card.classList.remove('missed');

    updateSubmitBtn();
};

window.goToQuestion = function(index) {
    closeMissedModal();
    const card = document.querySelector(`.q-card[data-card="${index}"]`);
    if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.transition = "box-shadow 0.3s";
        card.style.boxShadow = "0 0 30px var(--neon-yellow)";
        setTimeout(() => { card.style.boxShadow = ""; }, 1500);
    }
};

window.closeMissedModal = function() {
    document.getElementById('missedModal').classList.remove('show');
};

function sendScoreToPlatform(score, total) {
    try {
        if (window.parent && window.parent !== window && typeof window.parent.saveInteractiveExamScore === 'function') {
            window.parent.saveInteractiveExamScore(score, total);
            return true;
        } else {
            console.log(`الدرجة: ${score} من ${total}`);
            return false;
        }
    } catch (e) {
        console.log("Error sending score: ", e);
        return false;
    }
}

window.submitExam = function() {
    if (state.submitted) return;

    const missingIndices = [];
    state.answers.forEach((ans, i) => {
        if (ans === null) missingIndices.push(i);
    });

    if (missingIndices.length > 0) {
        missingIndices.forEach(i => {
            const card = document.querySelector(`.q-card[data-card="${i}"]`);
            if (card) card.classList.add('missed');
        });

        const modal = document.getElementById('missedModal');
        const badgesContainer = document.getElementById('missedBadges');
        document.getElementById('missedCount').innerText = missingIndices.length;
        
        badgesContainer.innerHTML = missingIndices.map(i => 
            `<div class="badge-missed" onclick="goToQuestion(${i})">${i + 1}</div>`
        ).join('');

        modal.classList.add('show');
        return;
    }

    state.submitted = true;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.classList.remove('ready');
    submitBtn.innerText = 'تم التسليم ✅';

    let score = 0;

    QUIZ.forEach((q, i) => {
        const chosen = state.answers[i];
        const isCorrect = (chosen === q.correct);
        if (isCorrect) score++;

        const options = document.querySelectorAll(`.option[data-q="${i}"]`);
        options.forEach(opt => {
            opt.classList.add('locked');
            opt.classList.remove('selected');
            const oIndex = parseInt(opt.dataset.o);
            
            if (oIndex === q.correct) {
                opt.classList.add('correct');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
            }
            if (oIndex === chosen && !isCorrect) {
                opt.classList.add('wrong');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
            }
        });

        const infoBtn = document.getElementById(`btn-${i}`);
        if (infoBtn) infoBtn.style.display = 'flex';
    });

    const sent = sendScoreToPlatform(score, QUIZ.length);

    const resultCard = document.getElementById('resultCard');
    const resultScore = document.getElementById('resultScore');
    const resultMsg = document.getElementById('resultMsg');
    
    const percent = Math.round((score / QUIZ.length) * 100);
    let msg = percent >= 80 ? "ممتاز! أداء رائع 🎉" : (percent >= 50 ? "جيد جداً، واصل التقدم 👍" : "لا بأس، حاول مرة أخرى 💪");
    
    resultScore.innerText = `${score} / ${QUIZ.length}`;
    resultMsg.innerText = msg + (sent ? " (تم إرسال الدرجة للمنصة)" : "");
    resultCard.style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    if (expBox && expBox.classList.contains('show')) {
        expBox.classList.remove('show');
        btn.classList.remove('active');
    } else if (expBox) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }
};

renderPages();
</script>
</body>
</html>
