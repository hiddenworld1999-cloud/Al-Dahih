<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>امتحان برمجة الحاسب | منصة الدحيح</title>
    
    <!-- ================= بداية كود الحماية الموحد لمنصة الدحيح ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield {
            position: fixed; inset: 0; background: #020202; color: #fff;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 999999;
            font-family: 'Cairo', sans-serif; text-align: center;
        }
        #watermarkGrid {
            position: fixed; inset: 0; pointer-events: none; z-index: 99998;
            overflow: hidden; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; opacity: 0.12;
        }
        .watermark-item {
            transform: rotate(-25deg); color: #fff; font-size: 15px;
            font-weight: 800; white-space: nowrap; padding: 35px;
            font-family: monospace; user-select: none;
            mix-blend-mode: difference;
            text-shadow: 0 0 2px rgba(0,0,0,.8), 1px 1px 2px rgba(0,0,0,.6);
        }
    </style>

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || 
                      localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || 
                    (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                    e.key === 'F12') {
                    e.preventDefault();
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة الامتحان.</p>`;
            document.body.appendChild(shield);

            let sName = "طالب الدحيح", sCode = "";
            try {
                sName = localStorage.getItem('studentName') || "طالب الدحيح";
                sCode = localStorage.getItem('studentCode') || "0000";
            } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);

            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية الموحد ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #020202;
            --bg-page: #0A0A0F;
            --bg-card: rgba(20, 20, 25, 0.6);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            
            --neon-cyan: #00F0FF;
            --neon-purple: #B026FF;
            --neon-green: #00FF41;
            --neon-red: #FF003C;
            --neon-yellow: #FFD700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { 
            overflow-x: hidden !important; 
            width: 100%; 
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(176, 38, 255, 0.05), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 30%);
            direction: rtl;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            line-height: 1.4;
            padding: 70px 0 100px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 8px; }

        /* ============ شاشة التحميل ============ */
        .loading-state {
            width: 100%; display: flex; justify-content: center;
            align-items: center; padding: 80px 20px;
            flex-direction: column; gap: 20px;
        }
        .loading-spinner {
            width: 50px; height: 50px; border-radius: 50%;
            border: 4px solid rgba(0, 240, 255, 0.15);
            border-top-color: var(--neon-cyan);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--neon-cyan); font-weight: 700; font-size: 16px; }

        /* ============ الشريط العلوي (التقدم) ============ */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }
        .top-bar-content {
            width: 100%; max-width: 794px;
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
        }
        .top-bar-title { font-weight: 800; font-size: 15px; color: var(--neon-cyan); white-space: nowrap; }
        .progress-container { flex: 1; background: rgba(255,255,255,0.1); height: 8px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); width: 0%; transition: width 0.4s ease; }
        .progress-text { font-weight: 700; font-size: 13px; color: var(--text-muted); min-width: 60px; text-align: left; }

        /* ============ الحاوية الأساسية للورقة ============ */
        .page-wrapper {
            width: 100%;
            display: flex; justify-content: center;
            margin-bottom: 20px; 
            overflow: hidden;
            padding: 0 10px; 
        }
        
        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            width: 794px; 
            min-height: 1123px; 
            height: auto;
            padding: 10px 10px 40px 10px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            transform-origin: top center; 
            flex-shrink: 0;
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            opacity: 0.8; z-index: 10;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: stretch;
            flex-grow: 1;
        }

        .hero-header { text-align: center; padding: 2px 0 6px; margin-bottom: 6px; }
        .hero-header h1 {
            font-size: 24px; font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        .hero-header p { font-size: 14px; color: var(--text-muted); font-weight: 600; }

        .main-title-banner {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.15), rgba(0, 240, 255, 0.15));
            border-right: 4px solid var(--neon-cyan); border-radius: 6px;
            padding: 6px 12px; font-size: 15px; font-weight: 800; color: var(--neon-cyan);
            margin: 4px 0 10px 0; display: flex; align-items: center; gap: 8px;
        }

        .section-divider {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px dashed var(--neon-cyan); color: var(--neon-cyan);
            text-align: center; padding: 6px; border-radius: 6px;
            font-weight: 800; margin: 6px 0 10px 0; font-size: 16px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            transition: all 0.3s;
        }

        .q-card.missed {
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.3) !important;
            animation: shake 0.5s ease-in-out;
        }
        .q-card.missed::after {
            content: '⚠️ لم يتم الإجابة';
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            background: var(--neon-red); color: #fff; padding: 2px 10px;
            border-radius: 10px; font-size: 10px; font-weight: 800;
            box-shadow: 0 0 10px var(--neon-red); z-index: 5; white-space: nowrap;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .q-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-bottom: 6px;
        }
        .q-head-right { display: flex; align-items: center; gap: 8px; }
        
        .q-num {
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; background: rgba(176, 38, 255, 0.15); color: var(--neon-purple);
            font-weight: 800; font-size: 14px; border: 1px solid rgba(176, 38, 255, 0.3);
            font-family: 'Fira Code', monospace;
        }

        .info-btn {
            display: none; width: 24px; height: 24px; border-radius: 50%;
            background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            font-size: 12px; font-weight: 800; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; font-family: 'Fira Code', monospace;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }
        .info-btn:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        .info-btn.active { background: var(--neon-cyan); color: var(--bg-body); box-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }

        .q-text {
            margin: 0 0 8px 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #FFFFFF;
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        }
        
        .option {
            position: relative; display: flex; flex-direction: row; align-items: center;
            justify-content: flex-start; gap: 8px; min-height: 38px; padding: 6px 10px;
            border: 1px solid #333; border-radius: 6px; background: #111;
            font-size: 15.5px; font-weight: 600; color: var(--text-main);
            line-height: 1.3; cursor: pointer; transition: all 0.2s;
            overflow-wrap: break-word; word-break: break-word;
        }
        
        .option:hover { border-color: rgba(0, 240, 255, 0.4); }
        .option input { position: absolute; opacity: 0; pointer-events: none; }
        
        .option .letter {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            border-radius: 5px; background: rgba(255,255,255,0.05); color: var(--text-muted);
            font-size: 13px; font-weight: 800; flex-shrink: 0;
            font-family: 'Fira Code', monospace; transition: all 0.2s;
        }
        
        .option .opt-text { flex: 1; }

        .option.selected {
            border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }
        .option.selected .letter { background: var(--neon-cyan); color: #000; }

        .option.locked { pointer-events: none; }
        
        .option.correct { 
            border-color: var(--neon-green); background: rgba(0, 255, 65, 0.08); 
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.15);
        }
        .option.correct .letter { background: var(--neon-green); color: #000; }
        .option.correct .opt-text { color: var(--neon-green); font-weight: 800; }
        
        .option.wrong { 
            border-color: var(--neon-red); background: rgba(255, 0, 60, 0.08); 
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.15);
        }
        .option.wrong .letter { background: var(--neon-red); color: #fff; }
        .option.wrong .opt-text { color: var(--neon-red); }

        .option .mark { margin-inline-start: auto; font-size: 18px; font-weight: bold; }

        .q-explanation {
            display: none; margin-top: 8px; padding: 8px 12px;
            background: rgba(0, 240, 255, 0.05); border: 1px dashed var(--neon-cyan);
            border-radius: 6px; font-size: 15px; font-weight: 600;
            color: var(--text-main); line-height: 1.5;
        }
        .q-explanation strong { color: var(--neon-cyan); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .footer-bar {
            position: absolute; bottom: 10px; left: 15px; right: 15px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 6px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 6px; }
        .footer-logo { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--neon-cyan); object-fit: cover; }
        .footer-brand-name { font-size: 13px; font-weight: 900; color: var(--neon-cyan); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 800; }

        /* ============ الشريط السفلي (تسليم) ============ */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(10px);
            box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.8); z-index: 1000;
            display: flex; justify-content: center; padding: 12px 20px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }

        .btn-submit {
            width: 100%; max-width: 794px; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            color: #fff; font-size: 17px; font-weight: 800; font-family: 'Cairo', sans-serif;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; }

        .btn-submit.ready {
            background: linear-gradient(90deg, var(--neon-green), #00cc33);
            box-shadow: 0 4px 15px rgba(0, 255, 65, 0.4); animation: pulseReady 2s infinite;
        }
        @keyframes pulseReady {
            0% { box-shadow: 0 0 15px rgba(0, 255, 65, 0.4); }
            50% { box-shadow: 0 0 35px rgba(0, 255, 65, 0.8); }
            100% { box-shadow: 0 0 15px rgba(0, 255, 65, 0.4); }
        }

        .result-card {
            display: none; background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(176, 38, 255, 0.1));
            border: 2px solid var(--neon-cyan); border-radius: 15px; padding: 20px;
            text-align: center; margin-bottom: 20px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            width: 100%; max-width: 794px; margin-top: 20px;
        }
        .result-card h2 { color: var(--neon-cyan); margin-bottom: 10px; font-size: 24px; }
        .result-score { font-size: 40px; font-weight: 900; color: #fff; margin-bottom: 5px; text-shadow: 0 0 10px var(--neon-cyan); }
        .result-msg { color: var(--text-muted); font-size: 14px; }

        /* ============ شاشة التنبيه (Modal) ============ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-page); border: 2px solid var(--neon-red); border-radius: 15px;
            padding: 25px 30px; width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.4); transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .modal-overlay.show .modal-content { transform: translateY(0) scale(1); }
        .modal-icon { font-size: 50px; margin-bottom: 10px; animation: float 2s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .modal-content h2 { color: var(--neon-red); margin-bottom: 10px; font-size: 22px; }
        .modal-content p { color: var(--text-main); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
        .missed-badges {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px;
            max-height: 150px; overflow-y: auto; padding: 5px;
        }
        .badge-missed {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 0, 60, 0.1);
            border: 2px solid var(--neon-red); color: var(--neon-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800; font-family: 'Fira Code', monospace;
            cursor: pointer; transition: all 0.2s;
        }
        .badge-missed:hover {
            background: var(--neon-red); color: #fff; transform: scale(1.1); box-shadow: 0 0 15px var(--neon-red);
        }
        .btn-close-modal {
            background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 10px 25px; border-radius: 8px; font-size: 16px; font-weight: 700;
            font-family: inherit; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .btn-close-modal:hover { background: var(--neon-cyan); color: #000; }
    </style>
</head>
<body>

    <!-- الشريط العلوي (التقدم) -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-title">Prog Exam</div>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0</div>
        </div>
    </div>

    <!-- شاشة التنبيه للأسئلة الناقصة -->
    <div class="modal-overlay" id="missedModal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2>لسه مجاوبتش على كل الأسئلة!</h2>
            <p>باقي عليك <strong id="missedCount" style="color: var(--neon-red); font-size: 20px;">0</strong> أسئلة. اضغط على رقم السؤال عشان تروحله:</p>
            <div class="missed-badges" id="missedBadges"></div>
            <button class="btn-close-modal" onclick="closeMissedModal()">راجع الأسئلة</button>
        </div>
    </div>

    <!-- شريط النتيجة -->
    <div class="result-card" id="resultCard">
        <h2>تم تسليم الامتحان!</h2>
        <div class="result-score" id="resultScore">0 / 0</div>
        <p class="result-msg" id="resultMsg">جارٍ إرسال الدرجة للمنصة...</p>
    </div>

    <!-- الحاوية اللي هتترسم فيها ورق الـ A4 -->
    <div id="pagesContainer" style="display: contents;">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <div class="loading-text">جارٍ تحميل الامتحان...</div>
        </div>
    </div>

    <!-- الشريط السفلي (زرار التسليم) -->
    <div class="bottom-bar">
        <button class="btn-submit" id="submitBtn" onclick="submitExam()">تسليم الامتحان</button>
    </div>

<script>
