    <!-- ================= بداية كود الحماية الموحد لمنصة الدحيح ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield {
            position: fixed; inset: 0; background: #020202; color: #fff;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 999999;
            font-family: 'Cairo', sans-serif; text-align: center;
        }
        #watermarkGrid {
            position: fixed; inset: 0; pointer-events: none; z-index: 99998;
            overflow: hidden; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; opacity: 0.12;
        }
        .watermark-item {
            transform: rotate(-25deg); color: #fff; font-size: 15px;
            font-weight: 800; white-space: nowrap; padding: 35px;
            font-family: monospace; user-select: none;
            mix-blend-mode: difference;
            text-shadow: 0 0 2px rgba(0,0,0,.8), 1px 1px 2px rgba(0,0,0,.6);
        }
    </style>

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || 
                      localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || 
                    (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                    e.key === 'F12') {
                    e.preventDefault();
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);

            let sName = "طالب الدحيح", sCode = "";
            try {
                sName = localStorage.getItem('studentName') || "طالب الدحيح";
                sCode = localStorage.getItem('studentCode') || "0000";
            } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);

            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية الموحد ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #020202;
            --bg-page: #0A0A0F;
            --bg-card: rgba(20, 20, 25, 0.6);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            
            --neon-cyan: #00F0FF;
            --neon-purple: #B026FF;
            --neon-green: #00FF41;
            --neon-red: #FF003C;
            --neon-yellow: #FFD700;

            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(176, 38, 255, 0.05), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 30%);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 8px; }

        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            width: 100%;
            max-width: 820px; 
            min-height: 1150px; 
            padding: 30px 35px 70px 35px; 
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 30px; 
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            opacity: 0.8;
            z-index: 10;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            flex-grow: 1; 
        }

        .hero-header { text-align: center; padding: 10px 0 15px; margin-bottom: 10px; }
        .hero-header h1 {
            font-size: 1.8rem; font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .hero-header p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

        .main-title-banner {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.15), rgba(0, 240, 255, 0.15));
            border-right: 4px solid var(--neon-cyan);
            border-radius: 6px;
            padding: 8px 15px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--neon-cyan);
            margin: 5px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* فاصل الأقسام */
        .section-divider {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan);
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            margin: 15px 0;
            font-size: 15px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 14px 16px; 
            margin-bottom: 12px; 
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        .q-card:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 4px 25px 0 rgba(0, 240, 255, 0.1);
        }

        .q-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 8px;
        }
        .q-head-right {
            display: flex; align-items: center; gap: 10px;
        }
        
        .q-num {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; 
            background: rgba(176, 38, 255, 0.15);
            color: var(--neon-purple); 
            font-weight: 800; font-size: 13px;
            border: 1px solid rgba(176, 38, 255, 0.3);
            font-family: 'Fira Code', monospace;
        }

        /* زر التعليل (!) */
        .info-btn {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 14px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Fira Code', monospace;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }
        .info-btn:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        .info-btn.active { background: var(--neon-cyan); color: var(--bg-body); box-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }

        .q-text {
            margin: 0 0 12px 0; font-size: 14.5px; font-weight: 700; line-height: 1.5;
            color: #FFFFFF;
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .option {
            position: relative;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 45px; 
            padding: 8px 10px; 
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
            font-size: 12.5px; 
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .option .letter {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
            font-family: 'Fira Code', monospace;
        }
        
        .option .opt-text { flex: 1; }

        /* --- حالة الإجابة الصحيحة (نيون أخضر) --- */
        .option.correct { 
            border-color: var(--neon-green); 
            background: rgba(0, 255, 65, 0.08); 
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.15);
        }
        .option.correct .letter { 
            background: var(--neon-green); 
            color: #000;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
        }
        .option.correct .opt-text {
            color: var(--neon-green);
            font-weight: 800;
        }
        .option.correct .mark { 
            color: var(--neon-green); 
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 0 8px var(--neon-green);
        }
        
        .option .mark {
            margin-inline-start: auto;
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* ============ صندوق التعليل ============ */
        .q-explanation {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.6;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        .q-explanation strong { color: var(--neon-cyan); }
        .q-explanation.show { display: block; opacity: 1; transform: translateY(0); }

        /* ============ الفوتر (ثابت في أسفل الورقة) ============ */
        .footer-bar {
            position: absolute;
            bottom: 15px; left: 35px; right: 35px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 10px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 6px; }
        .footer-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--neon-cyan); object-fit: cover; }
        .footer-brand-name { font-size: 13px; font-weight: 900; color: var(--neon-cyan); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 800; }

        /* ============ استجابة الموبايل ============ */
        @media (max-width: 850px) {
            body { padding: 0; }
            .a4-page { 
                padding: 15px 15px 60px 15px; 
                border-radius: 0; 
                border: none; 
                border-bottom: 2px solid var(--neon-purple); 
                min-height: auto; 
                margin-bottom: 10px;
            }
            .footer-bar { left: 15px; right: 15px; bottom: 10px; }
            .hero-header h1 { font-size: 1.5rem; }
            .q-options { grid-template-columns: 1fr 1fr; gap: 6px; }
            .option { min-height: 40px; padding: 6px 8px; font-size: 11.5px; }
            .option .letter { width: 22px; height: 22px; font-size: 11px; }
            .q-text { font-size: 13.5px; }
        }
    </style>
</head>

<script>

const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');
const QUESTIONS_PER_PAGE = 5;

function renderPages() {
    let html = '';
    const totalPages = Math.ceil(QUIZ.length / QUESTIONS_PER_PAGE);

    for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
        const start = pageIndex * QUESTIONS_PER_PAGE;
        const pageQuestions = QUIZ.slice(start, start + QUESTIONS_PER_PAGE);

        html += `
        <div class="a4-page">
            <div class="content-wrapper">
                ${pageIndex === 0 ? `
                    <header class="hero-header">
                        <h1>MIDTERM SOLVED QUIZ</h1>
                        <p>(محلول)بنك أسئلة برمجة الحاسب - مراجعة الميد ترم</p>
                    </header>
                    <div class="main-title-banner">
                        <span>🧠</span> اضغط على ( ! ) لقراءة التعليل الخاص بكل سؤال
                    </div>
                ` : ''}

                ${pageQuestions.map((q, qIndex) => {
                    const globalIndex = start + qIndex;
                    
                    let sectionDivider = '';
                    if (globalIndex === 32) { // تحديث رقم الفاصل بعد إضافة السؤال
                        sectionDivider = `
                        <div class="section-divider">
                            القسم الثاني: أسئلة الصواب والخطأ (True / False)
                        </div>
                        `;
                    }

                    const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                                      q.explanation === q.options[q.correct] || 
                                      q.explanation.length <= q.options[q.correct].length + 3;

                    return `
                    ${sectionDivider}
                    <div class="q-card" data-card="${globalIndex}">
                        <div class="q-head">
                            <div class="q-head-right">
                                <span class="q-num">${globalIndex + 1}</span>
                                ${!isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                            </div>
                        </div>
                        <p class="q-text">${q.text}</p>
                        <div class="q-options">
                            ${q.options.map((opt, j) => {
                                const isCorrect = (j === q.correct);
                                return `
                                <div class="option ${isCorrect ? 'correct' : ''}">
                                    <span class="letter">${LETTERS[j]}</span>
                                    <span class="opt-text">${opt}</span>
                                    ${isCorrect ? '<span class="mark">✓</span>' : ''}
                                </div>
                                `;
                            }).join('')}
                        </div>
                        ${!isGeneric ? `
                        <div class="q-explanation" id="exp-${globalIndex}">
                            <strong>التعليل: </strong>${q.explanation}
                        </div>
                        ` : ''}
                    </div>
                    `;
                }).join('')}
            </div>
            
            <div class="footer-bar">
                <div class="footer-brand">
                    <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                    <div class="footer-brand-name">الدحيح</div>
                </div>
                <div class="footer-center-text">صفحة ${pageIndex + 1} من ${totalPages} | بنك الأسئلة المحلول</div>
            </div>
        </div>
        `;
    }

    container.innerHTML = html;
}

window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    
    if (expBox && expBox.classList.contains('show')) {
        expBox.classList.remove('show');
        btn.classList.remove('active');
    } else if (expBox) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }
};

renderPages();
</script>
