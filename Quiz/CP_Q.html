<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>بنك الأسئلة المحلول | برمجة الحاسب</title>
    
    <!-- ================= بداية كود الحماية الموحد لمنصة الدحيح ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield {
            position: fixed; inset: 0; background: #020202; color: #fff;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 999999;
            font-family: 'Cairo', sans-serif; text-align: center;
        }
        #watermarkGrid {
            position: fixed; inset: 0; pointer-events: none; z-index: 99998;
            overflow: hidden; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; opacity: 0.12;
        }
        .watermark-item {
            transform: rotate(-25deg); color: #fff; font-size: 15px;
            font-weight: 800; white-space: nowrap; padding: 35px;
            font-family: monospace; user-select: none;
            mix-blend-mode: difference;
            text-shadow: 0 0 2px rgba(0,0,0,.8), 1px 1px 2px rgba(0,0,0,.6);
        }
    </style>

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || 
                      localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || 
                    (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                    e.key === 'F12') {
                    e.preventDefault();
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);

            let sName = "طالب الدحيح", sCode = "";
            try {
                sName = localStorage.getItem('studentName') || "طالب الدحيح";
                sCode = localStorage.getItem('studentCode') || "0000";
            } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);

            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية الموحد ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #020202;
            --bg-page: #0A0A0F;
            --bg-card: rgba(20, 20, 25, 0.6);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            
            --neon-cyan: #00F0FF;
            --neon-purple: #B026FF;
            --neon-green: #00FF41;
            --neon-red: #FF003C;
            --neon-yellow: #FFD700;

            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            overflow-x: hidden !important; 
            width: 100%; 
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(176, 38, 255, 0.05), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 30%);
            direction: rtl;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            line-height: 1.5; 
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 8px; }

        /* ============ الحاوية الأساسية للورقة ============ */
        .page-wrapper {
            width: 100%;
            display: flex; justify-content: center;
            margin-bottom: 20px; 
            overflow: hidden;
            padding: 0 10px; 
        }
        
        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            width: 794px; 
            min-height: 1123px; 
            height: auto;
            padding: 10px 10px 40px 10px; 
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            transform-origin: top center; 
            flex-shrink: 0;
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            opacity: 0.8; z-index: 10;
        }

        .watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background-image: url('https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: stretch;
            flex-grow: 1;
        }

        .hero-header { text-align: center; padding: 5px 0 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border-glass); }
        .hero-header h1 {
            font-size: 28px; font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .hero-header p { font-size: 16px; color: var(--text-muted); font-weight: 600; }

        .section-divider {
            background: linear-gradient(90deg, rgba(176, 38, 255, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan);
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-weight: 800;
            margin: 8px 0 12px 0;
            font-size: 18px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 12px 15px; 
            margin-bottom: 10px; 
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            border-right: 4px solid var(--neon-purple);
            transition: all 0.3s;
        }

        .q-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 8px;
        }
        .q-head-right { display: flex; align-items: center; gap: 12px; }
        
        .q-num {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; 
            background: rgba(176, 38, 255, 0.15);
            color: var(--neon-purple); 
            font-weight: 800; font-size: 17px;
            font-family: 'Fira Code', monospace;
        }

        .info-btn {
            display: flex;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 15px; font-weight: 800;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }
        .info-btn:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        .info-btn.active { background: var(--neon-cyan); color: var(--bg-body); box-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }

        .q-text {
            margin: 0 0 10px 0; 
            font-size: 19px; /* خط كبير */
            font-weight: 700; line-height: 1.5;
            color: #FFFFFF;
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; 
        }
        
        .option {
            position: relative;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 40px;
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #111;
            font-size: 17px; /* خط كبير */
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .option .letter {
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 800;
            flex-shrink: 0;
            font-family: 'Fira Code', monospace;
        }
        
        .option .opt-text { flex: 1; }

        /* حالة الإجابة الصحيحة */
        .option.correct { 
            border-color: var(--neon-green); 
            background: rgba(0, 255, 65, 0.08); 
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.15);
        }
        .option.correct .letter { background: var(--neon-green); color: #000; }
        .option.correct .opt-text { color: var(--neon-green); font-weight: 800; }
        .option.correct .mark { color: var(--neon-green); font-weight: bold; font-size: 20px; margin-inline-start: auto; }

        /* ============ صندوق التعليل ============ */
        .q-explanation {
            display: none;
            margin-top: 10px;
            padding: 10px 15px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 6px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
        }
        .q-explanation strong { color: var(--neon-cyan); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ فوتر الورقة ============ */
        .footer-bar {
            position: absolute; bottom: 12px; left: 25px; right: 25px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 8px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 8px; }
        .footer-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--neon-cyan); object-fit: cover; }
        .footer-brand-name { font-size: 14px; font-weight: 900; color: var(--neon-cyan); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 800; }

        /* ============ الطباعة ============ */
        @page { size: A4; margin: 0; }
        @media print {
            html, body {
                background: var(--bg-page) !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .page-wrapper {
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                display: block !important;
                break-after: page;
                page-break-after: always;
                break-inside: avoid;
            }
            .page-wrapper:last-child { break-after: auto; page-break-after: auto; }
            .a4-page {
                transform: none !important;
                box-shadow: none !important;
                height: 1123px !important;
                min-height: 1123px !important;
                overflow: hidden !important;
                margin: 0 auto;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

<script>
const QUIZ = [
    { text: "أول مرحلة من مراحل حل المشكلات (Problem Solving) هي:", options: ["تنفيذ الخطة", "تفهم المشكلة", "فحص النتيجة", "تخطيط الحل"], correct: 1, explanation: "تبدأ العملية بفهم متطلبات المشكلة وجمع المعلومات اللازمة قبل التخطيط والتنفيذ والاختبار." },
    { text: "أي مما يلي يعد شرطاً أساسياً في الخوارزمية (Algorithm)؟", options: ["أن تتكرر بلا نهاية", "أن تُكتب بلغة الآلة فقط", "أن تنتهي بعد عدد محدود من الخطوات", "أن تحتوي على تعليمات غامضة"], correct: 2, explanation: "يجب ان تكون كل تعليمه دقيقه وغير غامضة / وأن تنتهي الخوارزمية بعد عدد محدود من الخطوات (Finite steps)." },
    { text: "الخوارزمية الزائفة (Pseudocode) هي:", options: ["نسخة قابلة للقراءة والفهم من قبل الإنسان للكود", "كود مكتوب بلغة الآلة", "رسم بياني بالأشكال والأسهم", "برنامج لترجمة الكود"], correct: 0, explanation: "الخوارزمية الزائفة هي تعبير مبسط عن منطق الكود دون التقيد بقواعد لغة برمجة معينة." },
    { text: "أي مما يلي يُعد من عيوب الخوارزمية الزائفة (Pseudocode)؟", options: ["صعوبة تعديلها", "صعوبة تحويلها للغة برمجة", "تحتاج لمترجم لتنفيذها", "ليست رسمية ولا يوجد أسلوب موحد لكتابتها"], correct: 3, explanation: "ليست رسمية ولا يوجد أسلوب موحد لكتابتها." },
    { text: "تسمى العلامة = في البرمجة:", options: ["عامل المقارنة (Logical operator)", "قيمة منطقية (Boolean value)", "عامل التعيين (Assignment operator)", "حلقة تكرارية (Loop)"], correct: 2, explanation: "العلامة = هي عامل التعيين (Assignment)، بينما == هي عامل المقارنة." },
    { text: "ما ناتج التعبير 17 % 5 في Python؟", options: ["2", "3", "3.4", "12"], correct: 0, explanation: "العامل % هو الباقي (Modulus): باقي قسمة 17 على 5 هو 2." },
    { text: "ما ناتج التعبير 2 ** 3 في Python؟", options: ["5", "6", "9", "8"], correct: 3, explanation: "العامل ** هو الأس (Power): 2 أس 3 = 8." },
    { text: "أي مما يلي اسم متغير (Variable) صحيح في Python؟", options: ["user_name", "1st_name", "my-name", "for"], correct: 0, explanation: "لا يبدأ اسم المتغير برقم، ولا يحتوي على شرطة (-)، ولا يكون كلمة محجوزة (Keyword) مثل for." },
    { text: "هيكل البيانات الذي يعمل بمبدأ «أول داخل أول خارج» FIFO هو:", options: ["المكدس (Stack)", "الشجرة (Tree)", "القائمة المرتبطة", "الطابور (Queue)"], correct: 3, explanation: "الطابور يضيف العناصر من الخلف ويزيلها من الأمام، مثل الواقفين في الطابور." },
    { text: "أي هيكل بيانات يعمل بمبدأ LIFO ويُستخدم في وظيفة التراجع (Undo) في محرر النصوص؟", options: ["الطابور (Queue)", "المكدس (Stack)", "المصفوفة (Array)", "القاموس (Dictionary)"], correct: 1, explanation: "المكدس تُضاف عناصره وتُزال من الأعلى فقط بمبدأ LIFO." },
    { text: "في مصفوفة (Array) عدد عناصرها n، يكون فهرس (Index) العنصر الأخير هو:", options: ["n", "1", "n - 1", "0"], correct: 2, explanation: "يبدأ الفهرس من 0 لذا فهرس آخر عنصر هو n-1." },
    { text: "كل عقدة (Node) في القائمة المرتبطة (Linked List) تحتوي على:", options: ["بيانات وإشارة للعقدة التالية", "بيانات فقط", "إشارة فقط", "اسم الفئة والدالة"], correct: 0, explanation: "تحتوي على بيانات وإشارة (Pointer) إلى العقدة التالية." },
    { text: "تُصنف الشجرة (Tree) ضمن هياكل البيانات:", options: ["الخطية (Linear)", "التسلسلية فقط", "المصفوفات الثابتة", "غير الخطية (Non-linear) الهرمية"], correct: 3, explanation: "الشجرة هيكل هرمي له جذر (Root) وفروع، مثل شجرة الملفات." },
    { text: "ما الذي تطبعه الحلقة التالية؟ for x in range(2, 6): print(x)", options: ["2, 3, 4, 5, 6", "2, 3, 4, 5", "3, 4, 5", "2, 3, 4"], correct: 1, explanation: "دالة range(2, 6) تبدأ من 2 وتقف قبل 6، فتطبع 2, 3, 4, 5." },
    { text: "وظيفة الأمر break داخل الحلقة هي:", options: ["تخطي التكرار الحالي", "إعادة الحلقة من البداية", "إنهاء الحلقة فوراً", "طباعة قيمة المتغير"], correct: 2, explanation: "break تنهي الحلقة بالكامل، بينما continue تتخطى التكرار الحالي فقط." },
    { text: "أي هيكل بيانات في Python مرتب وغير قابل للتعديل (Immutable) بعد إنشائه ويدعم الفهرسة؟", options: ["الصف (Tuple)", "القائمة (List)", "المجموعة (Set)", "القاموس (Dictionary)"], correct: 0, explanation: "الصف يشبه القائمة لكن لا يمكن تغيير عناصره بعد إنشائه." },
    { text: "يتكون القاموس (Dictionary) في Python من:", options: ["قيم فقط داخل [ ]", "عناصر مفهرسة بأرقام", "عناصر غير مكررة دون قيم", "أزواج مفتاح (Key) وقيمة (Value) داخل { }"], correct: 3, explanation: "مثال: {\"name\": \"Alice\"} حيث name هو المفتاح وAlice هي القيمة." },
    { text: "المرحلة التي تنتج وثيقة SRS هي:", options: ["التخطيط (Planning)", "التحليل (Analysis)", "التصميم (Design)", "الاختبار (Testing)"], correct: 1, explanation: "في مرحلة التحليل تُوثق المتطلبات في وثيقة SRS لتكون أساساً للمرحلة التالية." },
    { text: "تركز وثائق التصميم (Design Documents) على:", options: ["كيفية تنفيذ النظام (How) بدلاً من (What)", "جمع المتطلبات من العملاء فقط", "تنفيذ اختبارات الوحدة", "نشر البرنامج على الخوادم"], correct: 0, explanation: "تحول وثائق التصميم المتطلبات في SRS إلى خطة تقنية واضحة قابلة للتنفيذ." },
    { text: "أي نموذج يعتمد على نهج خطي متسلسل تتدفق فيه المراحل من الأعلى إلى الأسفل دون العودة للخلف؟", options: ["نموذج Agile", "نموذج الشلال (Waterfall)", "النموذج الحلزوني", "نموذج RAD"], correct: 1, explanation: "يناسب نموذج الشلال المشاريع ذات المتطلبات الثابتة والواضحة." },

const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');

/* =========================================================
   التقسيم الذكي (Smart Pagination) - المطابق للمالية
   ========================================================= */
function renderPaginatedPages() {
    container.innerHTML = '';
    
    // 1. حاوية القياس المخفية
    const measureBox = document.createElement('div');
    measureBox.style.position = 'absolute';
    measureBox.style.visibility = 'hidden';
    measureBox.style.width = '774px'; // العرض الداخلي الفعلي للورقة
    document.body.appendChild(measureBox);
    
    const measureWrapper = document.createElement('div');
    measureWrapper.className = 'content-wrapper';
    measureWrapper.style.padding = '0'; 
    measureBox.appendChild(measureWrapper);

    // 2. قياس الهيدر
    measureWrapper.innerHTML = `
        <header class="hero-header">
            <h1>MIDTERM SOLVED QUIZ</h1>
            <p>بنك أسئلة برمجة الحاسب - مراجعة نهائية</p>
        </header>
    `;
    const headerH = measureWrapper.offsetHeight;

    // 3. قياس الفاصل
    measureWrapper.innerHTML = `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (True / False)</div>`;
    const dividerH = measureWrapper.offsetHeight;

    // 4. قياس كل سؤال
    const qHeights = QUIZ.map((q) => {
        const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                          q.explanation === q.options[q.correct] || 
                          q.explanation.length <= q.options[q.correct].length + 3;
        
        measureWrapper.innerHTML = `
            <div class="q-card">
                <div class="q-head">
                    <div class="q-head-right">
                        <span class="q-num">1</span>
                        ${!isGeneric ? `<button class="info-btn" style="display:flex;">!</button>` : ''}
                    </div>
                </div>
                <p class="q-text">${q.text}</p>
                <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                    ${q.options.map((opt, j) => {
                        const isCorrect = (j === q.correct);
                        return `
                        <div class="option ${isCorrect ? 'correct' : ''}">
                            <span class="letter">${LETTERS[j]}</span>
                            <span class="opt-text">${opt}</span>
                            ${isCorrect ? '<span class="mark">✓</span>' : ''}
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
        return measureWrapper.offsetHeight;
    });

    document.body.removeChild(measureBox);

    // 5. التوزيع الذكي على الصفحات
    const availableHeight = 1123 - 10 - 40 - 30; 
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;

    for (let i = 0; i < QUIZ.length; i++) {
        let required = qHeights[i];
        
        if (pages.length === 0 && currentPage.length === 0) {
            required += headerH;
        }

        // إجبار صفحة جديدة لأسئلة الصح والخطأ (السؤال 33 - Index 32)
        let forceBreak = false;
        if (i === 32 && currentPage.length > 0) {
            forceBreak = true;
            required += dividerH;
        }

        if (forceBreak || (currentPage.length > 0 && (currentHeight + required > availableHeight))) {
            pages.push(currentPage);
            currentPage = [];
            currentHeight = 0;
            
            if (forceBreak) {
                required = qHeights[i] + dividerH;
            } else {
                required = qHeights[i];
            }
        }

        currentPage.push(i);
        currentHeight += qHeights[i];

        if (pages.length === 0 && currentPage.length === 1) {
            currentHeight += headerH;
        }
        if (i === 32) { 
            currentHeight += dividerH;
        }
    }
    if (currentPage.length > 0) {
        pages.push(currentPage);
    }

    // 6. بناء HTML للصفحات
    const totalPages = pages.length;

    pages.forEach((pageIndices, pageIdx) => {
        let pageHTML = `
        <div class="page-wrapper">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
        `;

        if (pageIdx === 0) {
            pageHTML += `
                <header class="hero-header">
                    <h1>MIDTERM SOLVED QUIZ</h1>
                    <p>بنك أسئلة برمجة الحاسب - مراجعة نهائية</p>
                </header>
            `;
        }

        pageIndices.forEach(globalIndex => {
            const q = QUIZ[globalIndex];
            
            if (globalIndex === 32) {
                pageHTML += `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (True / False)</div>`;
            }

            const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                              q.explanation === q.options[q.correct] || 
                              q.explanation.length <= q.options[q.correct].length + 3;

            pageHTML += `
                <div class="q-card" data-card="${globalIndex}">
                    <div class="q-head">
                        <div class="q-head-right">
                            <span class="q-num">${globalIndex + 1}</span>
                            ${!isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                        </div>
                    </div>
                    <p class="q-text">${q.text}</p>
                    <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                        ${q.options.map((opt, j) => {
                            const isCorrect = (j === q.correct);
                            return `
                            <div class="option ${isCorrect ? 'correct' : ''}">
                                <span class="letter">${LETTERS[j]}</span>
                                <span class="opt-text">${opt}</span>
                                ${isCorrect ? '<span class="mark">✓</span>' : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>
                    ${!isGeneric ? `
                    <div class="q-explanation" id="exp-${globalIndex}">
                        <strong>التعليل: </strong>${q.explanation}
                    </div>
                    ` : ''}
                </div>
            `;
        });

        pageHTML += `
                </div>
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIdx + 1} من ${totalPages} | بنك الأسئلة المحلول</div>
                </div>
            </div>
        </div>
        `;

        container.innerHTML += pageHTML;
    });

    setTimeout(scalePages, 100);
}

/* =========================================================
   تصغير الورقة للموبايل
   ========================================================= */
function scalePages() {
    const pageWidth = 794;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 20;
    const scale = Math.min(1, availableWidth / pageWidth);

    document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const page = wrapper.querySelector('.a4-page');
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            
            const actualHeight = page.offsetHeight; 
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('load', scalePages);
window.addEventListener('resize', scalePages);
window.addEventListener('orientationchange', scalePages);

/* =========================================================
   فتح تعليل واحد بس وقفل الباقي (Accordion)
   ========================================================= */
window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    const isCurrentlyOpen = expBox.classList.contains('show');

    document.querySelectorAll('.q-explanation').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.info-btn').forEach(el => el.classList.remove('active'));

    if (!isCurrentlyOpen) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }

    setTimeout(scalePages, 50); 
};

/* ===== تشغيل ===== */
renderPaginatedPages();
</script>
