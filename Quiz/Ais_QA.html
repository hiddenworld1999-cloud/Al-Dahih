<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>امتحان نظم المعلومات المحاسبية - الميد ترم</title>
    
    <!-- ================= بداية كود الحماية الموحد ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>
    <style>
        * { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield { position: fixed; inset: 0; background: #020202; color: #ffffff; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 999999; font-family: 'Cairo', sans-serif; text-align: center; }
        #watermarkGrid { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around; opacity: 0.12; }
        .watermark-item { transform: rotate(-25deg); color: #ffffff; font-size: 15px; font-weight: 800; white-space: nowrap; padding: 35px; font-family: monospace; user-select: none; mix-blend-mode: difference; text-shadow: 0 0 2px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.6); }
    </style>
    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) || e.key === 'F12') { e.preventDefault(); }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);
            let sName = "طالب الدحيح", sCode = "";
            try { sName = localStorage.getItem('studentName') || "طالب الدحيح"; sCode = localStorage.getItem('studentCode') || "0000"; } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);
            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #F8FAFC;
            --bg-page: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --primary-blue: #0F4C81; 
            --primary-light: #E0F2FE;
            --accent-green: #059669; 
            --accent-green-light: #D1FAE5;
            --accent-gold: #F59E0B; 
            --accent-gold-light: #FEF3C7;
            --accent-red: #DC2626;
            --border-color: #E2E8F0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            overflow-x: hidden !important; 
            width: 100%; 
            background-color: var(--bg-body);
            direction: rtl;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            line-height: 1.5; 
            padding: 60px 0 90px 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 8px; }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05); z-index: 1000;
            display: flex; justify-content: center; padding: 9px 12px;
            border-bottom: 2px solid var(--border-color);
        }
        .top-bar-content {
            width: 100%; max-width: 794px;
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
        }
        .top-bar-title { font-weight: 800; font-size: 15px; color: var(--primary-blue); white-space: nowrap; }
        .progress-container { flex: 1; background: #E2E8F0; height: 8px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-blue), var(--accent-green)); width: 0%; transition: width 0.4s ease; }
        .progress-text { font-weight: 700; font-size: 13px; color: var(--text-muted); min-width: 60px; text-align: left; }

        .page-wrapper {
            width: 100%; display: flex; justify-content: center;
            margin-bottom: 20px; overflow: hidden; padding: 0 10px; 
        }
        
        .a4-page {
            background-color: var(--bg-page);
            width: 794px; min-height: 1123px; height: auto;
            padding: 15px 15px 45px 15px; 
            border: 1px solid var(--border-color); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative;
            display: flex; flex-direction: column;
            transform-origin: top center; flex-shrink: 0;
        }

        .a4-page::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-green));
            border-radius: 8px 8px 0 0; z-index: 10;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            background-image: url('https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg');
            background-repeat: no-repeat; background-position: center; background-size: contain;
            opacity: 0.03; pointer-events: none; z-index: 0; filter: grayscale(100%);
        }

        .content-wrapper {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            width: 100%; align-items: stretch; flex-grow: 1;
        }

        .hero-header { text-align: center; padding: 10px 0 15px; margin-bottom: 15px; border-bottom: 2px dashed var(--border-color); }
        .hero-header h1 { font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; color: var(--primary-blue); margin-bottom: 5px; }
        .hero-header p { font-size: 16px; color: var(--text-muted); font-weight: 600; }

        .main-title-banner {
            background: var(--primary-light); border-right: 4px solid var(--primary-blue);
            border-radius: 6px; padding: 8px 15px; font-size: 15px; font-weight: 800;
            color: var(--primary-blue); margin: 5px 0 15px 0; display: flex; align-items: center; gap: 8px;
        }

        .section-divider {
            background: var(--primary-light); color: var(--primary-blue);
            text-align: center; padding: 8px; border-radius: 6px; font-weight: 800;
            margin: 15px 0; font-size: 18px; page-break-inside: avoid;
            border: 1px solid rgba(15, 76, 129, 0.1);
        }

        .q-card {
            background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 15px; margin-bottom: 12px; 
            box-shadow: var(--card-shadow); position: relative;
            border-right: 4px solid var(--primary-blue); transition: all 0.3s;
        }

        .q-card.missed {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.2) !important;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .q-head-right { display: flex; align-items: center; gap: 10px; }
        
        .q-num {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; background: var(--primary-light); color: var(--primary-blue);
            font-weight: 800; font-size: 16px;
        }

        .info-btn {
            display: none; width: 28px; height: 28px; border-radius: 50%;
            background: #FFF; border: 2px solid var(--accent-gold); color: var(--accent-gold);
            font-size: 16px; font-weight: 900; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
        }
        .info-btn:hover { background: var(--accent-gold-light); }
        .info-btn.active { background: var(--accent-gold); color: #FFF; }

        .q-text { margin: 0 0 12px 0; font-size: 17px; font-weight: 700; line-height: 1.5; color: var(--text-main); }

        .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .option {
            position: relative; display: flex; flex-direction: row; align-items: center;
            justify-content: flex-start; gap: 10px; min-height: 40px; padding: 8px 12px;
            border: 1px solid var(--border-color); border-radius: 6px; background: #F8FAFC;
            font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.4;
            cursor: pointer; transition: all 0.2s; overflow-wrap: break-word; word-break: break-word;
        }
        
        .option:hover { border-color: var(--primary-blue); background: #FFF; }
        .option input { position: absolute; opacity: 0; pointer-events: none; }
        
        .option .letter {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; background: #E2E8F0; color: var(--text-muted);
            font-size: 13px; font-weight: 800; flex-shrink: 0; transition: all 0.2s;
        }
        
        .option .opt-text { flex: 1; }

        .option.selected { border-color: var(--primary-blue); background: rgba(15, 76, 129, 0.05); box-shadow: 0 0 8px rgba(15, 76, 129, 0.1); }
        .option.selected .letter { background: var(--primary-blue); color: #FFF; }
        .option.locked { pointer-events: none; }
        
        .option.correct { border-color: var(--accent-green); background: var(--accent-green-light); }
        .option.correct .letter { background: var(--accent-green); color: #FFF; }
        .option.correct .opt-text { color: var(--accent-green); font-weight: 800; }
        
        .option.wrong { border-color: var(--accent-red); background: rgba(220, 38, 38, 0.05); }
        .option.wrong .letter { background: var(--accent-red); color: #FFF; }
        .option.wrong .opt-text { color: var(--accent-red); }

        .option .mark { margin-inline-start: auto; font-size: 20px; font-weight: bold; }

        .q-explanation {
            display: none; margin-top: 12px; padding: 12px 15px;
            background: var(--accent-gold-light); border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 6px; font-size: 15px; font-weight: 600; color: #92400E; line-height: 1.5;
        }
        .q-explanation strong { color: var(--primary-blue); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .footer-bar {
            position: absolute; bottom: 15px; left: 20px; right: 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--border-color); padding-top: 10px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 8px; }
        .footer-logo { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--primary-blue); object-fit: cover; filter: grayscale(20%); }
        .footer-brand-name { font-size: 15px; font-weight: 900; color: var(--primary-blue); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 700; }

        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(10px);
            box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.05); z-index: 1000;
            display: flex; justify-content: center; padding: 12px 15px;
            border-top: 2px solid var(--border-color);
        }

        .btn-submit {
            width: 100%; max-width: 794px; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, var(--primary-blue), #2563EB);
            color: #FFF; font-size: 18px; font-weight: 800; font-family: 'Cairo', sans-serif;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(15, 76, 129, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(15, 76, 129, 0.4); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #9CA3AF; color: #FFF; cursor: not-allowed; box-shadow: none; }

        .btn-submit.ready {
            background: linear-gradient(90deg, var(--accent-green), #10B981);
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.4); animation: pulseReady 2s infinite;
        }
        @keyframes pulseReady {
            0% { box-shadow: 0 0 15px rgba(5, 150, 105, 0.4); }
            50% { box-shadow: 0 0 35px rgba(5, 150, 105, 0.8); }
            100% { box-shadow: 0 0 15px rgba(5, 150, 105, 0.4); }
        }

        .result-card {
            display: none; background: var(--bg-page);
            border: 2px solid var(--primary-blue); border-radius: 15px; padding: 25px;
            text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%; max-width: 794px; margin-top: 20px;
        }
        .result-card h2 { color: var(--primary-blue); margin-bottom: 10px; font-size: 30px; font-weight: 800; }
        .result-score { font-size: 64px; font-weight: 900; color: var(--accent-green); margin-bottom: 10px; text-shadow: 0 0 10px rgba(5, 150, 105, 0.2); }
        .result-score small { font-size: 30px; color: var(--text-muted); }
        .result-msg { color: var(--text-main); font-size: 20px; font-weight: 600; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-page); border: 2px solid var(--accent-red); border-radius: 12px;
            padding: 25px 28px; width: 92%; max-width: 480px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: translateY(20px); transition: all 0.3s;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-icon { font-size: 60px; margin-bottom: 10px; animation: float 2s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .modal-content h2 { color: var(--accent-red); margin-bottom: 12px; font-size: 26px; font-weight: 900; }
        .modal-content p { color: var(--text-main); font-size: 18px; margin-bottom: 18px; line-height: 1.6; font-weight: 600; }
        .missed-badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; max-height: 140px; overflow-y: auto; padding: 5px; }
        .badge-missed {
            width: 44px; height: 44px; border-radius: 50%; background: rgba(220, 38, 38, 0.1);
            border: 2px solid var(--accent-red); color: var(--accent-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; cursor: pointer; transition: all 0.2s;
        }
        .badge-missed:hover { background: var(--accent-red); color: #FFF; transform: scale(1.15); }
        .btn-close-modal {
            background: var(--primary-blue); border: 2px solid var(--primary-blue); color: #FFF;
            padding: 12px 25px; border-radius: 8px; font-size: 18px; font-weight: 800;
            font-family: inherit; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .btn-close-modal:hover { background: transparent; color: var(--primary-blue); }

        @page { size: A4; margin: 0; }
        @media print {
            html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; display: block !important; overflow: visible !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .top-bar, .bottom-bar, .modal-overlay { display: none !important; }
            .page-wrapper { height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; display: block !important; break-after: page; page-break-after: always; break-inside: avoid; }
            .page-wrapper:last-child { break-after: auto; page-break-after: auto; }
            .a4-page { transform: none !important; box-shadow: none !important; height: 1123px !important; min-height: 1123px !important; overflow: hidden !important; margin: 0 auto; border-radius: 0 !important; border: none !important; }
            .a4-page::before { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-title">AIS Exam</div>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0</div>
        </div>
    </div>

    <div class="modal-overlay" id="missedModal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2>لسه مجاوبتش على كل الأسئلة!</h2>
            <p>باقي عليك <strong id="missedCount" style="color: var(--accent-red); font-size: 22px;">0</strong> أسئلة. اضغط على رقم السؤال عشان تروحله:</p>
            <div class="missed-badges" id="missedBadges"></div>
            <button class="btn-close-modal" onclick="closeMissedModal()">راجع الأسئلة</button>
        </div>
    </div>

    <div class="result-card" id="resultCard">
        <h2>تم تسليم الامتحان!</h2>
        <div class="result-score" id="resultScore">0 <small>/ 0</small></div>
        <p class="result-msg" id="resultMsg">جارٍ إرسال الدرجة للمنصة...</p>
    </div>

    <div id="pagesContainer" style="display: contents;"></div>

    <div class="bottom-bar">
        <button class="btn-submit" id="submitBtn" onclick="submitExam()">تسليم الامتحان</button>
    </div>

<script>
/* =========================================================

يشترط وجود المعلومات في التوقيت المناسب أو في وقت محدد.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "التوقيت المناسب شرط أساسي للمعلومة؛ فالمعلومة المتأخرة بعد اتخاذ القرار تفقد فائدتها وقيمتها بالكامل وتصبح عديمة النفع."}, {"text": "تعتبر إمكانية التحقق من الخصائص الأساسية للمعلومات وفقاً للإطار المفاهيمي للمعايير المحاسبية الدولية.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "في المعايير المحاسبية الدولية، إمكانية التحقق تندرج ضمن الخصائص النوعية المعززة أو المكملة، وليست من الخصائص الأساسية (الخصائص الأساسية هما: الملاءمة والتمثيل الصادق)."}, {"text": "لا يوجد فرق بين الخصائص الأساسية للمعلومات طبقاً لمفهوم نظم المعلومات وبين الخصائص الأساسية للمعلومات طبقاً للإطار المفاهيمي للمعايير المحاسبية الدولية.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "المعايير الدولية قسمت الخصائص النوعية إلى نوعين: خصائص نوعية أساسية (الملاءمة والتمثيل الصادق)، وخصائص نوعية معززة ومكملة (القابلية للمقارنة، إمكانية التحقق، التوقيت المناسب، والقابلية للفهم)، بينما مفهوم نظم المعلومات يذكرها جميعاً كحزمة خصائص أساسية دون هذا التقسيم الثنائي المعياري."}, {"text": "لا تعتبر زيادة قنوات الاتصال في المنشأة من أهمية نظم المعلومات المحاسبية.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "فتح وزيادة قنوات الاتصال وتيسير تدفق المعلومات بين مختلف المستويات الإدارية والمستفيدين هي من أهم مظاهر أهمية ومزايا نظم المعلومات المحاسبية."}, {"text": "يعتبر مجلس الإدارة من المستخدمين الخارجيين للنظام المحاسبي أو للمعلومات المحاسبية.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "مجلس الإدارة من المستخدمين الداخليين للمعلومات لإدارة شؤون المنشأة، أما المستخدمون الخارجيون فهم: المستثمرون، الموردون، العملاء، المساهمون، البنوك والمقرضون، والجهات الحكومية والضريبية."}, {"text": "يتكون نظام المعلومات المحاسبي الإلكتروني من ثلاثة عناصر فقط.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "كلمة \"فقط\" خطأ؛ فالنظام الإلكتروني يتكون من 5عناصر أو أكثر: المكونات المادية، البرمجيات، البيانات، العنصر البشري، والإجراءات وشبكات الاتصال."}, {"text": "يمكن حساب قيمة المعلومات في حالة عدم التأكد بالقانون التالي: عائد المعلومات ناقص تكلفة الحصول على تلك المعلومات.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "قانون (عائد المعلومات -تكلفتها) يُستخدم في حالة التأكد التام، أما في حالة عدم التأكد فتُحسب القيمة بالاحتمالات الرياضية ومقارنة العائد المتوقع قبل وبعد الحصول على المعلومة."}, {"text": "تعتبر قيمة المعلومات يمكن حسابها من خلال: العائد بعد الحصول على المعلومات ناقص العائد قبل الحصول على المعلومات في حالة التأكد التام.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "لا بد من خصم تكلفة الحصول على المعلومات من هذا الفرق للوصول إلى صافي قيمة المعلومة."}, {"text": "تنقسم المجموعة المستندية في نظام المعلومات المحاسبي إلى: المستندات الخارجية والمستندات الداخلية.", "options": ["صح (√)", "خطأ (×)"], "correct": 0, "explanation": "المستندات الداخلية تُنشأ داخل المنشأة (مثل أذون الصرف والإضافة)، والمستندات الخارجية تتبادل مع أطراف خارج المنشأة (كالفواتير وأوامر الشراء وإشعارات البنوك)."}, {"text": "وفقاً لخريطة تدفق المستندات، يمكن لإدارة المشتريات أن تجمع الطلبات وتتأكد من عدم توافرها بالمخازن.", "options": ["صح (√)", "خطأ (×)"], "correct": 0, "explanation": "هذه خطوة رقابية وإجرائية رئيسية موثقة في خريطة تدفق دورة المشتريات والمخازن."}, {"text": "يعتبر حساب الأرباح والخسائر من القوائم المالية والتقارير المالية المنتهية في العام المالي (الرئيسية).", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "القوائم المالية المنشورة والمعيارية هي: قائمة الدخل، قائمة المركز المالي، قائمة التدفقات النقدية، وقائمة التغير في حقوق الملكية، أما حساب الأرباح والخسائر فهو حساب تسوية وإقفال دفتري داخلي."}, {"text": "يعتبر الفصل بين الواجبات من المقومات المحاسبية لنظام المعلومات المحاسبي.", "options": ["صح (√)", "خطأ (×)"], "correct": 1, "explanation": "الفصل بين الواجبات هو من المقومات الإدارية والرقابية وليس مقوماً محاسبياً، أما المقومات المحاسبية فهي: دليل الحسابات، المجموعة المستندية، المجموعة الدفترية، ودورة التقارير."}, {"text": "تعتبر خ RAW_QUIZ.forEach(q => {
    q.isGeneric = (
        !q.explanation ||
        q.explanation === 'صح.' ||
        q.explanation === 'خطأ.' ||
        q.explanation === q.options[q.correct] ||
        q.explanation.length <= q.options[q.correct].length + 3
    );
});

RAW_QUIZ.forEach(q => {

    if (!groups[currentGroup]) groups[currentGroup] = [];
    groups[currentGroup].push(q);
});

let showAdditional = false;

let state = {
    answers: [],
    submitted: false
};

function resizeAnswers(newSize) {
    const old = state.answers;
    const newArr = new Array(newSize).fill(null);
    for (let i = 0; i < Math.min(old.length, newSize); i++) {
        newArr[i] = old[i];
    }
    state.answers = newArr;
}

resizeAnswers(MAIN_QUIZ.length);

function getActiveQuiz() {
    return showAdditional ? [...MAIN_QUIZ, ...ADDITIONAL_QUIZ] : [...MAIN_QUIZ];
}

        <header class="hero-header">
            <h1>امتحان نظم المعلومات المحاسبية</h1>
            <p>الميد ترم - شامل جميع الأجزاء</p>
        </header>
        <div class="main-title-banner">
            <span>📝</span> اختر الإجابة الصحيحة لكل سؤال، ثم اضغط "تسليم الامتحان" بالأسفل
        </div>
    `;
    const headerH = measureWrapper.offsetHeight;

    measureWrapper.innerHTML = `<div class="section-divider">القسم</div>`;
    const dividerH = measureWrapper.offsetHeight;

    const qHeights = ACTIVE.map((q) => {
        measureWrapper.innerHTML = `
            <div class="q-card">
                <div class="q-head">
                    <div class="q-head-right">
                        <span class="q-num">1</span>
                    </div>
                </div>
                <p class="q-text">${q.text}</p>
                <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                    ${q.options.map((opt, j) => `
                        <label class="option">
                            <span class="letter">${LETTERS[j]}</span>
                            <span class="opt-text">${opt}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
        return measureWrapper.offsetHeight + 12;
    });

    document.body.removeChild(measureBox);

    const availableHeight = 1123 - 15 - 45 - 35;
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;

    for (let i = 0; i < ACTIVE.length; i++) {
        let required = qHeights[i];
        const hasSection = !!ACTIVE[i].section;
        
        if (hasSection) required += dividerH;
        
        if (pages.length === 0 && currentPage.length === 0) {
            required += headerH;
        }

        if (currentPage.length > 0 && (currentHeight + required > availableHeight)) {
            pages.push(currentPage);
            currentPage = [];
            currentHeight = 0;
            required = qHeights[i] + (hasSection ? dividerH : 0);
        }

        currentPage.push(i);
        currentHeight += qHeights[i] + (hasSection ? dividerH : 0);

        if (pages.length === 0 && currentPage.length === 1) {
            currentHeight += headerH;
        }
    }
    if (currentPage.length > 0) {
        pages.push(currentPage);
    }

    const totalPages = pages.length;

    const pagesHTML = pages.map((pageIndices, pageIdx) => {
        let pageHTML = `
        <div class="page-wrapper">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
        `;

        if (pageIdx === 0) {
            pageHTML += `
                <header class="hero-header">
                    <h1>امتحان نظم المعلومات المحاسبية</h1>
                    <p>الميد ترم - شامل جميع الأجزاء</p>
                </header>
                <div class="main-title-banner">
                    <span>📝</span> اختر الإجابة الصحيحة لكل سؤال، ثم اضغط "تسليم الامتحان" بالأسفل
                </div>
            `;
        }

        pageIndices.forEach(globalIndex => {
            const q = ACTIVE[globalIndex];
            
            if (q.section) {
                pageHTML += `<div class="section-divider">${q.section}</div>`;
            }

            pageHTML += `
                <div class="q-card" data-card="${globalIndex}">
                    <div class="q-head">
                        <div class="q-head-right">
                            <span class="q-num">${globalIndex + 1}</span>
                            ${!q.isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                        </div>
                    </div>
                    <p class="q-text">${q.text}</p>
                    <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                        ${q.options.map((opt, j) => `
                            <label class="option" data-q="${globalIndex}" data-o="${j}" id="opt-${globalIndex}-${j}">
                                <input type="radio" name="q${globalIndex}" value="${j}" onchange="selectOption(${globalIndex}, ${j})">
                                <span class="letter">${LETTERS[j]}</span>
                                <span class="opt-text">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                    ${!q.isGeneric ? `
                    <div class="q-explanation" id="exp-${globalIndex}">
                        <strong>التعليل: </strong>${q.explanation}
                    </div>
                    ` : ''}
                </div>
            `;
        });

        pageHTML += `
                </div>
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIdx + 1} من ${totalPages} | نظم المعلومات المحاسبية</div>
                </div>
            </div>
        </div>
        `;
        return pageHTML;
    });

    container.innerHTML = pagesHTML.join('');

    if (!showAdditional && !state.submitted) {
        container.innerHTML += `
            <div style="text-align: center; margin: 30px auto 80px auto; width: 100%; max-width: 794px; padding: 0 15px;">
                <div style="background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: right;">
                    <p style="color: #1E293B; font-weight: 700; font-size: 15px; margin-bottom: 5px;">📌 ملاحظة هامة:</p>
                    <p style="color: #475569; font-size: 14px; line-height: 1.6;">الأسئلة بالأعلى هي <strong>الأسئلة المهمة الأساسية</strong>. يمكنك تسليم الامتحان الآن على هذه الأسئلة فقط، أو إظهار <strong>الأسئلة الإضافية</strong> (ملف الميد + بنك التدريب) بالضغط على الزر أدناه — وفي هذه الحالة <strong style="color: #DC2626;">لازم تحل الكل عشان تقدر تسلم</strong>.</p>
                </div>
                <button onclick="revealAdditionalQuestions()" style="padding: 12px 30px; font-size: 16px; font-weight: 800; color: white; background: linear-gradient(135deg, #0F4C81, #2563EB); border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; box-shadow: 0 4px 15px rgba(15, 76, 129, 0.3); transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
                    <span>📚</span> عرض الأسئلة الإضافية
                </button>
            </div>
        `;
    }

    // ✅ تحديث شريط التقدم وزرار التسليم بعد الرسم
    updateProgress();
    updateSubmitBtn();

    setTimeout(scalePages, 100);
}

/* =========================================================
7. تصغير الورقة للموبايل
   ========================================================= */
function scalePages() {
    const pageWidth = 794;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 20;
    const scale = Math.min(1, availableWidth / pageWidth);

    document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const page = wrapper.querySelector('.a4-page');
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            const actualHeight = page.offsetHeight; 
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('resize', scalePages);
window.addEventListener('orientationchange', scalePages);

/* =========================================================
8. شريط التقدم والتسليم
   ========================================================= */
function updateProgress() {
    const ACTIVE = getActiveQuiz();
    const answered = state.answers.slice(0, ACTIVE.length).filter(a => a !== null).length;
    const percent = (answered / ACTIVE.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').innerText = `${answered} / ${ACTIVE.length}`;
}

function updateSubmitBtn() {
    if (state.submitted) return;
    const ACTIVE = getActiveQuiz();
    const missing = state.answers.slice(0, ACTIVE.length).filter(a => a === null).length;
    const btn = document.getElementById('submitBtn');
    
    if (missing === 0) {
        btn.innerHTML = 'تسليم الامتحان 🚀';
        btn.classList.add('ready');
    } else {
        btn.innerHTML = `تسليم الامتحان <span style="background: rgba(220,38,38,0.1); color: var(--accent-red); padding: 2px 10px; border-radius: 20px; font-size: 14px; border: 1px solid var(--accent-red);">باقي ${missing}</span>`;
        btn.classList.remove('ready');
    }
}

/* =========================================================
9. اختيار إجابة
   ========================================================= */
window.selectOption = function(qIndex, oIndex) {
    if (state.submitted) return;
    state.answers[qIndex] = oIndex;
    
    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
    
    const card = document.querySelector(`.q-card[data-card="${qIndex}"]`);
    if (card) card.classList.remove('missed');

    updateProgress();
    updateSubmitBtn();
};

window.goToQuestion = function(index) {
    closeMissedModal();
    const card = document.querySelector(`.q-card[data-card="${index}"]`);
    if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.transition = "box-shadow 0.3s";
        card.style.boxShadow = "0 0 20px var(--primary-blue)";
        setTimeout(() => { card.style.boxShadow = ""; }, 1500);
    }
};

window.closeMissedModal = function() {
    document.getElementById('missedModal').classList.remove('show');
};

/* =========================================================
10. عرض الأسئلة الإضافية
   ========================================================= */
window.revealAdditionalQuestions = function() {
    showAdditional = true;
    renderPaginatedPages();
    setTimeout(() => {
        const target = document.querySelector(`.q-card[data-card="${MAIN_QUIZ.length}"]`);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }, 300);
};

/* =========================================================
11. إرسال الدرجة
   ========================================================= */
function sendScoreToPlatform(score, total) {
    try {
        if (window.parent && window.parent !== window && typeof window.parent.saveInteractiveExamScore === 'function') {
            window.parent.saveInteractiveExamScore(score, total);
            return true;
        } else {
            console.log(`الدرجة: ${score} من ${total}`);
            return false;
        }
    } catch (e) {
        console.log("Error sending score: ", e);
        return false;
    }
}

/* =========================================================
12. تسليم الامتحان
   ========================================================= */
window.submitExam = function() {
    if (state.submitted) return;

    const ACTIVE = getActiveQuiz();
    const missingIndices = [];
    state.answers.slice(0, ACTIVE.length).forEach((ans, i) => {
        if (ans === null) missingIndices.push(i);
    });

    if (missingIndices.length > 0) {
        missingIndices.forEach(i => {
            const card = document.querySelector(`.q-card[data-card="${i}"]`);
            if (card) card.classList.add('missed');
        });

        const modal = document.getElementById('missedModal');
        const badgesContainer = document.getElementById('missedBadges');
        document.getElementById('missedCount').innerText = missingIndices.length;
        
        badgesContainer.innerHTML = missingIndices.map(i => 
            `<div class="badge-missed" onclick="goToQuestion(${i})">${i + 1}</div>`
        ).join('');

        modal.classList.add('show');
        return;
    }

    state.submitted = true;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.classList.remove('ready');
    submitBtn.innerText = 'تم التسليم ✅';

    let score = 0;

    ACTIVE.forEach((q, i) => {
        const chosen = state.answers[i];
        const isCorrect = (chosen === q.correct);
        if (isCorrect) score++;

        const options = document.querySelectorAll(`.option[data-q="${i}"]`);
        options.forEach(opt => {
            opt.classList.add('locked');
            opt.classList.remove('selected');
            const oIndex = parseInt(opt.dataset.o);
            
            if (oIndex === q.correct) {
                opt.classList.add('correct');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
            }
            if (oIndex === chosen && !isCorrect) {
                opt.classList.add('wrong');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
            }
        });

        const infoBtn = document.getElementById(`btn-${i}`);
        if (infoBtn) infoBtn.style.display = 'flex';
    });

    const sent = sendScoreToPlatform(score, ACTIVE.length);

    const resultCard = document.getElementById('resultCard');
    const resultScore = document.getElementById('resultScore');
    const resultMsg = document.getElementById('resultMsg');
    
    const percent = Math.round((score / ACTIVE.length) * 100);
    let msg = percent >= 80 ? "ممتاز! أداء رائع 🎉" : (percent >= 50 ? "جيد جداً، واصل التقدم 👍" : "لا بأس، حاول مرة أخرى 💪");
    
    resultScore.innerHTML = `${score} <small>/ ${ACTIVE.length}</small>`;
    resultMsg.innerText = msg + (sent ? " (تم إرسال الدرجة للمنصة)" : "");
    resultCard.style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
};

/* =========================================================
13. إظهار/إخفاء التعليل
   ========================================================= */
window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    if (!expBox || !btn) return;
    
    const isCurrentlyOpen = expBox.classList.contains('show');

    document.querySelectorAll('.q-explanation').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.info-btn').forEach(el => el.classList.remove('active'));

    if (!isCurrentlyOpen) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }

    setTimeout(scalePages, 50); 
};

/* =========================================================
14. بدء الرسم
   ========================================================= */
function startRendering() {
    renderPaginatedPages();
}

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(startRendering).catch(startRendering);
} else if (document.readyState === 'complete') {
    startRendering();
} else {
    window.addEventListener('load', startRendering);
}
</script>
