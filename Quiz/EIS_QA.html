<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إعدادات دقيقة للشاشة تمنع المتصفح من تكبير الصفحة وهمياً وتسمح بالزووم -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>امتحان أنظمة معلومات المؤسسات | منصة الدحيح</title>
    
    <!-- ================= بداية كود الحماية الموحد لمنصة الدحيح ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield {
            position: fixed; inset: 0; background: #020202; color: #fff;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 999999;
            font-family: 'Cairo', sans-serif; text-align: center;
        }
        #watermarkGrid {
            position: fixed; inset: 0; pointer-events: none; z-index: 99998;
            overflow: hidden; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; opacity: 0.12;
        }
        .watermark-item {
            transform: rotate(-25deg); color: #fff; font-size: 15px;
            font-weight: 800; white-space: nowrap; padding: 35px;
            font-family: monospace; user-select: none;
            mix-blend-mode: difference;
            text-shadow: 0 0 2px rgba(0,0,0,.8), 1px 1px 2px rgba(0,0,0,.6);
        }
    </style>

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || 
                      localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || 
                    (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                    e.key === 'F12') {
                    e.preventDefault();
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة الامتحان.</p>`;
            document.body.appendChild(shield);

            let sName = "طالب الدحيح", sCode = "";
            try {
                sName = localStorage.getItem('studentName') || "طالب الدحيح";
                sCode = localStorage.getItem('studentCode') || "0000";
            } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);

            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية الموحد ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0B1120;
            --bg-page: #111827;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            
            --electric-blue: #3B82F6;
            --cyan: #06B6D4;
            --neon-green: #10B981;
            --neon-green-bg: rgba(16, 185, 129, 0.1);
            --neon-red: #EF4444;
            --neon-red-bg: rgba(239, 68, 68, 0.1);
            --yellow: #F59E0B;
            
            --border-glass: rgba(59, 130, 246, 0.2);
            --shadow-paper: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 👇 منع أي Scroll أفقي */
        html, body {
            overflow-x: hidden !important;
            width: 100%;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08), transparent 40%);
            color: var(--text-main);
            line-height: 1.6;
            /* مساحة علوية للشريط ومساحة سفلية للزرار */
            padding: 70px 5px 100px 5px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--electric-blue); border-radius: 8px; }

        /* ============ الشريط العلوي ============ */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-glass);
        }
        .top-bar-content {
            width: 100%;
            max-width: 820px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .top-bar-title {
            font-weight: 800;
            font-size: 16px;
            color: var(--cyan);
            white-space: nowrap;
        }
        .progress-container {
            flex: 1;
            background: rgba(255,255,255,0.1);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--electric-blue), var(--cyan));
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
            min-width: 60px;
            text-align: left;
        }

        /* ============ تصميم ورقة A4 ============ */
        .page-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            max-width: 100vw;
            overflow: hidden; 
        }

        .a4-page {
            background-color: var(--bg-page);
            width: 820px; 
            flex-shrink: 0; 
            min-height: 1050px; 
            height: max-content; 
            padding: 25px 20px 60px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-paper);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-glass);
            transform-origin: top center; 
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, transparent, var(--electric-blue), var(--cyan), transparent);
            z-index: 10;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .hero-header { text-align: center; padding: 10px 0 20px; margin-bottom: 15px; border-bottom: 1px solid var(--border-glass); }
        .hero-header h1 {
            font-size: 2rem; font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--electric-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .hero-header p { font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }

        /* ============ فاصل الأقسام ============ */
        .section-divider {
            background: rgba(59, 130, 246, 0.1);
            border: 1px dashed var(--cyan);
            color: var(--cyan);
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            margin: 12px 0;
            font-size: 18px;
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            transition: all 0.3s;
        }

        .q-card.missed {
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3) !important;
            animation: shake 0.5s ease-in-out;
        }
        .q-card.missed::after {
            content: '⚠️ لم يتم الإجابة';
            position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%);
            background: var(--neon-red);
            color: #fff;
            padding: 2px 12px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
            z-index: 5;
            white-space: nowrap;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .q-head {
            display: flex; align-items: center; justify-content: flex-start;
            gap: 10px; margin-bottom: 10px;
        }
        
        .q-num {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; 
            background: rgba(59, 130, 246, 0.15);
            color: var(--cyan); 
            font-weight: 800; font-size: 15px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            font-family: 'Fira Code', monospace;
        }

        /* زر التعليل (!) - مخفي في البداية */
        .info-btn {
            display: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-size: 14px; font-weight: 800;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Fira Code', monospace;
        }
        .info-btn:hover { background: rgba(6, 182, 212, 0.2); }
        .info-btn.active { background: var(--cyan); color: #000; }

        .q-text {
            margin: 0 0 15px 0; 
            font-size: 18px;
            font-weight: 700; line-height: 1.6;
            color: #FFFFFF;
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; 
        }
        
        .option {
            position: relative;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            min-height: 50px;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .option:hover { border-color: rgba(6, 182, 212, 0.5); background: rgba(6, 182, 212, 0.05); }
        .option input { position: absolute; opacity: 0; pointer-events: none; }
        
        .option .letter {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 800;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        .option .opt-text { flex: 1; }

        /* حالة الاختيار */
        .option.selected {
            border-color: var(--cyan);
            background: rgba(6, 182, 212, 0.1);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }
        .option.selected .letter {
            background: var(--cyan);
            color: #000;
        }

        /* بعد التسليم */
        .option.locked { pointer-events: none; }
        
        .option.correct { 
            border-color: var(--neon-green); 
            background: var(--neon-green-bg); 
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .option.correct .letter { background: var(--neon-green); color: #000; }
        .option.correct .opt-text { color: var(--neon-green); font-weight: 800; }
        
        .option.wrong { 
            border-color: var(--neon-red); 
            background: var(--neon-red-bg); 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }
        .option.wrong .letter { background: var(--neon-red); color: #fff; }
        .option.wrong .opt-text { color: var(--neon-red); }

        .option .mark { margin-inline-start: auto; font-size: 18px; font-weight: bold; }

        /* ============ صندوق التعليل ============ */
        .q-explanation {
            display: none;
            margin-top: 12px;
            padding: 12px 15px;
            background: rgba(6, 182, 212, 0.05);
            border: 1px dashed var(--cyan);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.6;
        }
        .q-explanation strong { color: var(--cyan); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ فوتر الورقة ============ */
        .footer-bar {
            position: absolute;
            bottom: 15px; left: 20px; right: 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 10px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 6px; }
        .footer-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--electric-blue); object-fit: cover; filter: grayscale(100%); }
        .footer-brand-name { font-size: 14px; font-weight: 900; color: var(--cyan); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 600; }

        /* ============ الشريط السفلي (تسليم) ============ */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 12px 15px;
            border-top: 1px solid var(--border-glass);
        }

        .btn-submit {
            width: 100%;
            max-width: 820px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--electric-blue), var(--cyan));
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .btn-submit:hover { background: linear-gradient(90deg, var(--cyan), var(--electric-blue)); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #374151; color: #9CA3AF; cursor: not-allowed; box-shadow: none; }

        .btn-submit.ready {
            background: linear-gradient(90deg, var(--neon-green), #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            animation: pulse-green 2s infinite;
        }
        .btn-submit.ready:hover { background: linear-gradient(90deg, #059669, var(--neon-green)); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* ============ شاشة التنبيه (Modal) ============ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--bg-page);
            border: 2px solid var(--neon-red);
            border-radius: 15px;
            padding: 30px;
            width: 90%; max-width: 450px;
            text-align: center;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.3);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .modal-overlay.show .modal-content { transform: translateY(0) scale(1); }
        
        .modal-icon { font-size: 50px; margin-bottom: 10px; animation: float 2s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .modal-content h2 { color: var(--neon-red); margin-bottom: 10px; font-size: 22px; font-weight: 800; }
        .modal-content p { color: var(--text-main); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
        
        .missed-badges {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px;
            max-height: 150px; overflow-y: auto; padding: 5px;
        }
        .badge-missed {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--neon-red-bg);
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800; font-family: 'Fira Code', monospace;
            cursor: pointer; transition: all 0.2s;
        }
        .badge-missed:hover {
            background: var(--neon-red); color: #fff;
            transform: scale(1.1); box-shadow: 0 0 15px var(--neon-red);
        }
        
        .btn-close-modal {
            background: transparent; border: 2px solid var(--cyan);
            color: var(--cyan); padding: 12px 25px; border-radius: 10px;
            font-size: 16px; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .btn-close-modal:hover { background: var(--cyan); color: #000; }

        /* ============ شاشة النتيجة ============ */
        .result-card {
            display: none;
            background: var(--bg-card);
            border: 2px solid var(--cyan);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2);
            width: 100%; max-width: 820px;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-card h2 { color: var(--cyan); margin-bottom: 10px; font-size: 24px; font-weight: 800; }
        .result-score { font-size: 48px; font-weight: 900; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px var(--cyan); }
        .result-score small { font-size: 24px; color: var(--text-muted); }
        .result-msg { color: var(--text-main); font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- الشريط العلوي (التقدم) -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-title">EIS Exam</div>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0</div>
        </div>
    </div>

    <!-- شاشة التنبيه للأسئلة الناقصة -->
    <div class="modal-overlay" id="missedModal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2>لسه مجاوبتش على كل الأسئلة!</h2>
            <p>باقي عليك <strong id="missedCount" style="color: var(--neon-red); font-size: 20px;">0</strong> أسئلة. اضغط على رقم السؤال عشان تروحله:</p>
            <div class="missed-badges" id="missedBadges"></div>
            <button class="btn-close-modal" onclick="closeMissedModal()">راجع الأسئلة</button>
        </div>
    </div>

    <!-- شريط النتيجة -->
    <div class="result-card" id="resultCard">
        <h2>تم تسليم الامتحان!</h2>
        <div class="result-score" id="resultScore">0 <small>/ 0</small></div>
        <p class="result-msg" id="resultMsg">جارٍ إرسال الدرجة للمنصة...</p>
    </div>

    <!-- الحاوية اللي هتترسم فيها ورق الـ A4 -->
    <div id="pagesContainer" style="display: contents;"></div>

    <!-- الشريط السفلي (زرار التسليم) -->
    <div class="bottom-bar">
        <button class="btn-submit" id="submitBtn" onclick="submitExam()">تسليم الامتحان</button>
    </div>

                        const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                                          q.explanation === q.options[q.correct] || 
                                          q.explanation.length <= q.options[q.correct].length + 3;

                        return `
                        ${sectionDivider}
                        <div class="q-card" data-card="${globalIndex}">
                            <div class="q-head">
                                <span class="q-num">${globalIndex + 1}</span>
                                ${!isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                            </div>
                            <p class="q-text">${q.text}</p>
                            <div class="q-options">
                                ${q.options.map((opt, j) => `
                                    <label class="option" data-q="${globalIndex}" data-o="${j}" id="opt-${globalIndex}-${j}">
                                        <input type="radio" name="q${globalIndex}" value="${j}" onchange="selectOption(${globalIndex}, ${j})">
                                        <span class="letter">${LETTERS[j]}</span>
                                        <span class="opt-text">${opt}</span>
                                    </label>
                                `).join('')}
                            </div>
                            ${!isGeneric ? `
                            <div class="q-explanation" id="exp-${globalIndex}">
                                <strong>التعليل: </strong>${q.explanation}
                            </div>
                            ` : ''}
                        </div>
                        `;
                    }).join('')}
                </div>
                
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIndex + 1} من ${totalPages} | أنظمة معلومات المؤسسات</div>
                </div>
            </div>
        </div>
        `;
    }
    container.innerHTML = html;
    updateProgress();
    updateSubmitBtn();
    
    // استدعاء دالة التصغير بعد رسم الصفحات
    setTimeout(resizePages, 100);
}

/* =========================================================
   دالة تصغير ورق الـ A4 عشان تناسب شاشة الموبايل
   ========================================================= */
function resizePages() {
    const pages = document.querySelectorAll('.a4-page');
    const maxWidth = 820;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 10; 
    
    let scale = 1;
    if (availableWidth < maxWidth) {
        scale = availableWidth / maxWidth;
    }

    pages.forEach(page => {
        const wrapper = page.parentElement;
        
        page.style.transform = 'none';
        const actualHeight = page.offsetHeight;

        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            
            wrapper.style.width = `${availableWidth}px`;
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.width = '100%';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('load', resizePages);
window.addEventListener('orientationchange', resizePages); 

/* =========================================================
   التحديثات والدوال
   ========================================================= */
function updateProgress() {
    const answered = state.answers.filter(a => a !== null).length;
    const percent = (answered / QUIZ.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').innerText = `${answered} / ${QUIZ.length}`;
}

function updateSubmitBtn() {
    if (state.submitted) return;
    const missing = state.answers.filter(a => a === null).length;
    const btn = document.getElementById('submitBtn');
    
    if (missing === 0) {
        btn.innerHTML = 'تسليم الامتحان 🚀';
        btn.classList.add('ready');
    } else {
        btn.innerHTML = `تسليم الامتحان <span style="background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 20px; font-size: 12px;">باقي ${missing}</span>`;
        btn.classList.remove('ready');
    }
}

window.selectOption = function(qIndex, oIndex) {
    if (state.submitted) return;
    state.answers[qIndex] = oIndex;
    
    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
    
    const card = document.querySelector(`.q-card[data-card="${qIndex}"]`);
    if (card) card.classList.remove('missed');

    updateProgress();
    updateSubmitBtn();
};

window.goToQuestion = function(index) {
    closeMissedModal();
    const card = document.querySelector(`.q-card[data-card="${index}"]`);
    if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.transition = "box-shadow 0.3s";
        card.style.boxShadow = "0 0 20px rgba(6, 182, 212, 0.6)";
        setTimeout(() => { card.style.boxShadow = ""; }, 1500);
    }
};

window.closeMissedModal = function() {
    document.getElementById('missedModal').classList.remove('show');
};

function sendScoreToPlatform(score, total) {
    try {
        if (window.parent && window.parent !== window && typeof window.parent.saveInteractiveExamScore === 'function') {
            window.parent.saveInteractiveExamScore(score, total);
            return true;
        } else {
            console.log(`الدرجة: ${score} من ${total}`);
            return false;
        }
    } catch (e) {
        console.log("Error sending score: ", e);
        return false;
    }
}

window.submitExam = function() {
    if (state.submitted) return;

    const missingIndices = [];
    state.answers.forEach((ans, i) => {
        if (ans === null) missingIndices.push(i);
    });

    if (missingIndices.length > 0) {
        missingIndices.forEach(i => {
            const card = document.querySelector(`.q-card[data-card="${i}"]`);
            if (card) card.classList.add('missed');
        });

        const modal = document.getElementById('missedModal');
        const badgesContainer = document.getElementById('missedBadges');
        document.getElementById('missedCount').innerText = missingIndices.length;
        
        badgesContainer.innerHTML = missingIndices.map(i => 
            `<div class="badge-missed" onclick="goToQuestion(${i})">${i + 1}</div>`
        ).join('');

        modal.classList.add('show');
        return;
    }

    state.submitted = true;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.classList.remove('ready');
    submitBtn.innerText = 'تم التسليم ✅';

    let score = 0;

    QUIZ.forEach((q, i) => {
        const chosen = state.answers[i];
        const isCorrect = (chosen === q.correct);
        if (isCorrect) score++;

        const options = document.querySelectorAll(`.option[data-q="${i}"]`);
        options.forEach(opt => {
            opt.classList.add('locked');
            opt.classList.remove('selected');
            const oIndex = parseInt(opt.dataset.o);
            
            if (oIndex === q.correct) {
                opt.classList.add('correct');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
            }
            if (oIndex === chosen && !isCorrect) {
                opt.classList.add('wrong');
                opt.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
            }
        });

        // إظهار زرار التعليل بعد التسليم
        const infoBtn = document.getElementById(`btn-${i}`);
        if (infoBtn) infoBtn.style.display = 'flex';
    });

    const sent = sendScoreToPlatform(score, QUIZ.length);

    const resultCard = document.getElementById('resultCard');
    const resultScore = document.getElementById('resultScore');
    const resultMsg = document.getElementById('resultMsg');
    
    const percent = Math.round((score / QUIZ.length) * 100);
    let msg = percent >= 80 ? "ممتاز! أداء رائع 🎉" : (percent >= 50 ? "جيد جداً، واصل التقدم 👍" : "لا بأس، حاول مرة أخرى 💪");
    
    resultScore.innerHTML = `${score} <small>/ ${QUIZ.length}</small>`;
    resultMsg.innerText = msg + (sent ? " (تم إرسال الدرجة للمنصة)" : "");
    resultCard.style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    if (expBox && expBox.classList.contains('show')) {
        expBox.classList.remove('show');
        btn.classList.remove('active');
    } else if (expBox) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }
};

/* ===== تشغيل ===== */
renderPages();
</script>
