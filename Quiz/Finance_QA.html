        #antiScreenshotShield { position: fixed; inset: 0; background: #020202; color: #ffffff; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 999999; font-family: 'Cairo', sans-serif; text-align: center; }
        #watermarkGrid { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around; opacity: 0.12; }
        .watermark-item { transform: rotate(-25deg); color: #ffffff; font-size: 15px; font-weight: 800; white-space: nowrap; padding: 35px; font-family: monospace; user-select: none; mix-blend-mode: difference; text-shadow: 0 0 2px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.6); }

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) || e.key === 'F12') { e.preventDefault(); }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);
            let sName = "طالب الدحيح", sCode = "";
            try { sName = localStorage.getItem('studentName') || "طالب الدحيح"; sCode = localStorage.getItem('studentCode') || "0000"; } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);
            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>

    <style>

        .page-wrapper {

            padding: 0 10px; 
        }
        
        /* ============ تصميم ورقة A4 ============ */
        .a4-page {

            flex-direction: column;

        .a4-page::before {
            content: '';
            position: absolute;

        .watermark {
            position: absolute;

        /* ============ كارت السؤال ============ */
        .q-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;

        }

            display: flex; align-items: center; justify-content: flex-start;
            gap: 10px; margin-bottom: 8px;
        }
        
        /* تكبير رقم السؤال */
        .q-num {

            font-weight: 700; line-height: 1.5;
            color: var(--heading-main);
        }

        /* ============ الخيارات (2x2) ============ */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; 
        }
        
        /* تكبير الخيارات */
        .option {

            display: flex;
            flex-direction: row;

            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
        }

            flex-shrink: 0;

        /* ============ فوتر الورقة ============ */
        .footer-bar {
            position: absolute; bottom: 15px; left: 25px; right: 25px;

        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 700; }

        /* ============ الطباعة ============ */
        @page { size: A4; margin: 0; }
        @media print {
            html, body {

                min-height: 1123px !important;
                overflow: hidden !important;
                margin: 0 auto;
                border-radius: 0 !important;
            }
        }
    </style>

const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');

/* =========================================================
   التقسيم الذكي (Smart Pagination)
   ========================================================= */
function renderPaginatedPages() {
    container.innerHTML = '';
    
    // 1. حاوية القياس المخفية
    const measureBox = document.createElement('div');
    measureBox.style.position = 'absolute';
    measureBox.style.visibility = 'hidden';
    measureBox.style.width = '774px'; // العرض الداخلي الفعلي للورقة
    document.body.appendChild(measureBox);
    
    const measureWrapper = document.createElement('div');
    measureWrapper.className = 'content-wrapper';
    measureWrapper.style.padding = '0'; // إزالة أي بادينج افتراضي أثناء القياس
    measureBox.appendChild(measureWrapper);

    // 2. قياس الهيدر
    measureWrapper.innerHTML = `<header class="hero-header"><h1>عنوان</h1><p>وصف</p></header>`;
    const headerH = measureWrapper.offsetHeight;

    // 3. قياس الفاصل
    measureWrapper.innerHTML = `<div class="section-divider">فاصل</div>`;
    const dividerH = measureWrapper.offsetHeight;

    // 4. قياس كل سؤال
    const qHeights = QUIZ.map((q) => {
        measureWrapper.innerHTML = `
            <div class="q-card">
                <div class="q-head">
                    <span class="q-num">1</span>
                </div>
                <p class="q-text">${q.text}</p>
                <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                    ${q.options.map((opt, j) => `
                        <div class="option">
                            <span class="letter">${LETTERS[j]}</span>
                            <span class="opt-text">${opt}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        return measureWrapper.offsetHeight;
    });

    document.body.removeChild(measureBox);

    // 5. التوزيع الذكي على الصفحات
    const availableHeight = 1123 - 10 - 40 - 30; 
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;

    for (let i = 0; i < QUIZ.length; i++) {
        let required = qHeights[i];
        
        if (pages.length === 0 && currentPage.length === 0) {
            required += headerH;
        }

        let forceBreak = false;
        if (i === 30 && currentPage.length > 0) {
            forceBreak = true;
            required += dividerH;
        }

        if (forceBreak || (currentPage.length > 0 && (currentHeight + required > availableHeight))) {
            pages.push(currentPage);
            currentPage = [];
            currentHeight = 0;
            
            if (forceBreak) {
                required = qHeights[i] + dividerH;
            } else {
                required = qHeights[i];
            }
        }

        currentPage.push(i);
        currentHeight += qHeights[i];

        if (pages.length === 0 && currentPage.length === 1) {
            currentHeight += headerH;
        }
        if (i === 30) { 
            currentHeight += dividerH;
        }
    }
    if (currentPage.length > 0) {
        pages.push(currentPage);
    }

    // 6. بناء HTML للصفحات
    const totalPages = pages.length;

    pages.forEach((pageIndices, pageIdx) => {
        let pageHTML = `
        <div class="page-wrapper">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
        `;

        if (pageIdx === 0) {
            pageHTML += `
                <header class="hero-header">
                    <h1>بنك أسئلة ميد ترم</h1>
                    <p>مادة مالية عامة</p>
                </header>
            `;
        }

        pageIndices.forEach(globalIndex => {
            const q = QUIZ[globalIndex];
            
            if (globalIndex === 30) {
                pageHTML += `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (صح / خطأ)</div>`;
            }

            pageHTML += `
                <div class="q-card" data-card="${globalIndex}">
                    <div class="q-head">
                        <span class="q-num">${globalIndex + 1}</span>
                    </div>
                    <p class="q-text">${q.text}</p>
                    <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                        ${q.options.map((opt, j) => `
                            <div class="option">
                                <span class="letter">${LETTERS[j]}</span>
                                <span class="opt-text">${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        pageHTML += `
                </div>
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIdx + 1} من ${totalPages} | مادة مالية عامة</div>
                </div>
            </div>
        </div>
        `;

        container.innerHTML += pageHTML;
    });

    // 7. تصغير الورقة للموبايل بعد الرسم
    setTimeout(scalePages, 100);
}

/* =========================================================
   تصغير الورقة للموبايل
   ========================================================= */
function scalePages() {
    const pageWidth = 794;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 20;
    const scale = Math.min(1, availableWidth / pageWidth);

    document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const page = wrapper.querySelector('.a4-page');
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            
            const actualHeight = page.offsetHeight; 
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('load', scalePages);
window.addEventListener('resize', scalePages);
window.addEventListener('orientationchange', scalePages);

/* ===== تشغيل ===== */
renderPaginatedPages();
</script>
