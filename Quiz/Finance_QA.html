        #antiScreenshotShield { position: fixed; inset: 0; background: #020202; color: #ffffff; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 999999; font-family: 'Cairo', sans-serif; text-align: center; }
        #watermarkGrid { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around; opacity: 0.12; }
        .watermark-item { transform: rotate(-25deg); color: #ffffff; font-size: 15px; font-weight: 800; white-space: nowrap; padding: 35px; font-family: monospace; user-select: none; mix-blend-mode: difference; text-shadow: 0 0 2px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.6); }

    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) || e.key === 'F12') { e.preventDefault(); }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة الامتحان.</p>`;
            document.body.appendChild(shield);
            let sName = "طالب الدحيح", sCode = "";
            try { sName = localStorage.getItem('studentName') || "طالب الدحيح"; sCode = localStorage.getItem('studentCode') || "0000"; } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);
            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>

const container = document.getElementById('pagesContainer');
const QUESTIONS_PER_PAGE = 5;
let state = { answers: new Array(QUIZ.length).fill(null), submitted: false };

function renderPages() {
    let html = '';
    const totalPages = Math.ceil(QUIZ.length / QUESTIONS_PER_PAGE);
    for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
        const start = pageIndex * QUESTIONS_PER_PAGE;
        const pageQuestions = QUIZ.slice(start, start + QUESTIONS_PER_PAGE);
        html += `
        <div class="page-container">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
                    ${pageIndex === 0 ? `<header class="hero-header"><h1>أسئلة الميد - المالية العامة</h1><p>اختبر نفسك</p></header>` : ''}
                    ${pageQuestions.map((q, qIndex) => {
                        const globalIndex = start + qIndex;
                        let sectionDivider = '';
                        if (globalIndex === 30) { sectionDivider = `<div class="section-divider">القسم الثاني: أسئلة الصواب والخطأ (صح / خطأ)</div>`; }
                        return `
                        ${sectionDivider}
                        <div class="q-card" data-card="${globalIndex}">
                            <div class="q-head"><div class="q-head-right"><span class="q-num">${globalIndex + 1}</span><button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button></div></div>
                            <p class="q-text">${q.text}</p>
                            <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                                ${q.options.map((opt, j) => `<label class="option" data-q="${globalIndex}" data-o="${j}" id="opt-${globalIndex}-${j}"><input type="radio" name="q${globalIndex}" value="${j}" onchange="selectOption(${globalIndex}, ${j})"><span class="opt-text">${opt}</span></label>`).join('')}
                            </div>
                            <div class="q-explanation" id="exp-${globalIndex}"><strong>التعليل: </strong>${q.explanation}</div>
                        </div>`;
                    }).join('')}
                </div>
                <div class="footer-bar"><div class="footer-brand"><img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo"><div class="footer-brand-name">الدحيح</div></div><div class="footer-center-text">صفحة ${pageIndex + 1} من ${totalPages} | اختبر نفسك</div></div>
            </div>
        </div>`;
    }
    container.innerHTML = html;
    updateProgress(); updateSubmitBtn(); setTimeout(resizePages, 100);
}

function resizePages() {
    const pages = document.querySelectorAll('.a4-page');
    const maxWidth = 850;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 10; 
    let scale = 1;
    if (availableWidth < maxWidth) { scale = availableWidth / maxWidth; }
    pages.forEach(page => {
        const wrapper = page.parentElement;
        page.style.transform = 'none';
        const actualHeight = page.offsetHeight;
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            wrapper.style.width = `${availableWidth}px`;
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.width = '100%';
            wrapper.style.height = 'auto';
        }
    });
}
window.addEventListener('load', resizePages);
window.addEventListener('orientationchange', resizePages); 

function updateProgress() {
    const answered = state.answers.filter(a => a !== null).length;
    const percent = (answered / QUIZ.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').innerText = `${answered} / ${QUIZ.length}`;
}

function updateSubmitBtn() {
    if (state.submitted) return;
    const missing = state.answers.filter(a => a === null).length;
    const btn = document.getElementById('submitBtn');
    if (missing === 0) { btn.innerHTML = 'تسليم الامتحان 🚀'; btn.classList.add('ready'); } 
    else { btn.innerHTML = `تسليم الامتحان <span style="background: rgba(185,28,28,0.1); color: var(--red-alert); padding: 2px 10px; border-radius: 20px; font-size: 16px; border: 1px solid var(--red-alert);">باقي ${missing}</span>`; btn.classList.remove('ready'); }
}

window.selectOption = function(qIndex, oIndex) {
    if (state.submitted) return;
    state.answers[qIndex] = oIndex;
    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
    const card = document.querySelector(`.q-card[data-card="${qIndex}"]`);
    if (card) card.classList.remove('missed');
    updateProgress(); updateSubmitBtn();
};

window.goToQuestion = function(index) {
    closeMissedModal();
    const card = document.querySelector(`.q-card[data-card="${index}"]`);
    if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.style.transition = "box-shadow 0.3s"; card.style.boxShadow = "0 0 20px var(--gold-primary)"; setTimeout(() => { card.style.boxShadow = ""; }, 1500); }
};

window.closeMissedModal = function() { document.getElementById('missedModal').classList.remove('show'); };

const FUNNY_TITLES = ["استنى يا بطل! 🛑", "هو انت بتستعجل على إيه؟ 😅", "لأ لأ لأ... فيها حاجة غلط!", "لحظة كده يا هندسة! ✋", "في حاجة سايبة وراك 😏"];
const FUNNY_MSGS = ["متكملش كده وتيجي خايب! راجع الأول", "مش هنسيبك تسلم ناقص، خد وقتك", "الحق نفسك قبل ما تفوتك، الأسئلة دي فاضية", "معلش، لسه في شغل ع الماشي 😂", "بص كده تاني، وأكيد هتلاقي حاجة نسيتها"];

function sendScoreToPlatform(score, total) {
    try {
        if (window.parent && window.parent !== window && typeof window.parent.saveInteractiveExamScore === 'function') { window.parent.saveInteractiveExamScore(score, total); return true; } 
        else { console.log(`الدرجة: ${score} من ${total}`); return false; }
    } catch (e) { console.log("Error: ", e); return false; }
}

window.submitExam = function() {
    if (state.submitted) return;
    const missingIndices = [];
    state.answers.forEach((ans, i) => { if (ans === null) missingIndices.push(i); });
    if (missingIndices.length > 0) {
        missingIndices.forEach(i => { const card = document.querySelector(`.q-card[data-card="${i}"]`); if (card) card.classList.add('missed'); });
        const modal = document.getElementById('missedModal');
        const badgesContainer = document.getElementById('missedBadges');
        document.getElementById('modalTitle').innerText = FUNNY_TITLES[Math.floor(Math.random() * FUNNY_TITLES.length)];
        document.getElementById('modalFunny').innerText = FUNNY_MSGS[Math.floor(Math.random() * FUNNY_MSGS.length)];
        document.getElementById('missedCount').innerText = missingIndices.length;
        badgesContainer.innerHTML = missingIndices.map(i => `<div class="badge-missed" onclick="goToQuestion(${i})">${i + 1}</div>`).join('');
        modal.classList.add('show'); return;
    }
    state.submitted = true;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true; submitBtn.classList.remove('ready'); submitBtn.innerText = 'تم التسليم ✅';
    let score = 0;
    QUIZ.forEach((q, i) => {
        const chosen = state.answers[i];
        if (chosen === q.correct) score++;
        const options = document.querySelectorAll(`.option[data-q="${i}"]`);
        options.forEach(opt => {
            opt.classList.add('locked'); opt.classList.remove('selected');
            const oIndex = parseInt(opt.dataset.o);
            if (oIndex === q.correct) { opt.classList.add('correct'); opt.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>'); }
            if (oIndex === chosen && chosen !== q.correct) { opt.classList.add('wrong'); opt.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>'); }
        });
        const infoBtn = document.getElementById(`btn-${i}`); if (infoBtn) infoBtn.style.display = 'flex';
    });
    const sent = sendScoreToPlatform(score, QUIZ.length);
    const resultCard = document.getElementById('resultCard');
    const resultScore = document.getElementById('resultScore');
    const resultMsg = document.getElementById('resultMsg');
    const percent = Math.round((score / QUIZ.length) * 100);
    let msg = percent >= 80 ? "ممتاز! أداء رائع 🎉" : (percent >= 50 ? "جيد جداً، واصل التقدم 👍" : "لا بأس، حاول مرة أخرى 💪");
    resultScore.innerHTML = `${score} <small>/ ${QUIZ.length}</small>`;
    resultMsg.innerText = msg + (sent ? " (تم إرسال الدرجة للمنصة)" : "");
    resultCard.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    if (expBox && expBox.classList.contains('show')) { expBox.classList.remove('show'); btn.classList.remove('active'); } 
    else if (expBox) { expBox.classList.add('show'); btn.classList.add('active'); }
};

renderPages();
</script>
</body>
</html>
