<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>بنك أسئلة نظم المعلومات المحاسبية - الميد ترم</title>
    
    <!-- ================= بداية كود الحماية الموحد ================= -->
    <noscript>
        <style>body { display: none !important; }</style>
        <meta http-equiv="refresh" content="0;url=../login.html">
    </noscript>
    <style>
        * { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
        @media print { html, body { display: none !important; } }
        #antiScreenshotShield { position: fixed; inset: 0; background: #020202; color: #ffffff; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 999999; font-family: 'Cairo', sans-serif; text-align: center; }
        #watermarkGrid { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around; opacity: 0.12; }
        .watermark-item { transform: rotate(-25deg); color: #ffffff; font-size: 15px; font-weight: 800; white-space: nowrap; padding: 35px; font-family: monospace; user-select: none; mix-blend-mode: difference; text-shadow: 0 0 2px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.6); }
    </style>
    <script>
        const isDev = new URLSearchParams(window.location.search).get('admin') === 'daheeh' || localStorage.getItem('daheeh_is_admin') === 'true';
        if (!isDev) {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen' || (e.ctrlKey && ['s', 'c', 'p', 'u'].includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) || e.key === 'F12') { e.preventDefault(); }
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
            if (isDev) return;
            const shield = document.createElement("div");
            shield.id = "antiScreenshotShield";
            shield.innerHTML = `<h2 style="color: #FF003C; margin-bottom: 8px;">⚠️ محتوى محمي</h2><p style="color: #94A3B8;">يرجى الرجوع للصفحة لمواصلة المذاكرة.</p>`;
            document.body.appendChild(shield);
            let sName = "طالب الدحيح", sCode = "";
            try { sName = localStorage.getItem('studentName') || "طالب الدحيح"; sCode = localStorage.getItem('studentCode') || "0000"; } catch (e) {}
            const wmContainer = document.createElement("div");
            wmContainer.id = "watermarkGrid";
            const watermarkText = `${sName} • ${sCode}`;
            for (let i = 0; i < 45; i++) {
                const item = document.createElement("div");
                item.className = "watermark-item";
                item.innerText = watermarkText;
                wmContainer.appendChild(item);
            }
            document.body.appendChild(wmContainer);
            window.addEventListener("blur", () => { shield.style.display = "flex"; });
            window.addEventListener("focus", () => { shield.style.display = "none"; });
            window.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("");
                    shield.style.display = "flex";
                    setTimeout(() => shield.style.display = "none", 1200);
                }
            });
        });
    </script>
    <!-- ================= نهاية كود الحماية ================= -->

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ألوان فاتحة وهادئة تميل للمحاسبة */
        :root {
            --bg-body: #F8FAFC;
            --bg-page: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --primary-blue: #0F4C81; /* أزرق محاسبي كلاسيكي */
            --primary-light: #E0F2FE;
            --accent-green: #059669; /* أخضر زمردي للصح */
            --accent-green-light: #D1FAE5;
            --accent-gold: #F59E0B; /* ذهبي للتنبيهات */
            --accent-gold-light: #FEF3C7;
            --border-color: #E2E8F0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            overflow-x: hidden !important; 
            width: 100%; 
            background-color: var(--bg-body);
            direction: rtl;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            line-height: 1.5; 
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 8px; }

        /* ============ الحاوية الأساسية للورقة ============ */
        .page-wrapper {
            width: 100%;
            display: flex; justify-content: center;
            margin-bottom: 20px; 
            overflow: hidden;
            padding: 0 10px; 
        }
        
        /* ============ تصميم ورقة A4 ============ */
        .a4-page {
            background-color: var(--bg-page);
            width: 794px; 
            min-height: 1123px; 
            height: auto;
            padding: 15px 15px 45px 15px; 
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            transform-origin: top center; 
            flex-shrink: 0;
        }

        .a4-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-green));
            border-radius: 8px 8px 0 0;
            z-index: 10;
        }

        .watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            background-image: url('https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
            filter: grayscale(100%);
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: stretch;
            flex-grow: 1;
        }

        /* الهيدر */
        .hero-header { text-align: center; padding: 10px 0 15px; margin-bottom: 15px; border-bottom: 2px dashed var(--border-color); }
        .hero-header h1 {
            font-family: 'Amiri', serif;
            font-size: 28px;
            font-weight: 700; color: var(--primary-blue);
            margin-bottom: 5px;
        }
        .hero-header p { font-size: 16px; color: var(--text-muted); font-weight: 600; }

        /* فواصل الأقسام */
        .section-divider {
            background: var(--primary-light);
            color: var(--primary-blue);
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-weight: 800;
            margin: 15px 0;
            font-size: 18px;
            page-break-inside: avoid;
            border: 1px solid rgba(15, 76, 129, 0.1);
        }

        /* ============ كارت السؤال ============ */
        .q-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px; 
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
            position: relative;
            border-right: 4px solid var(--primary-blue);
            transition: transform 0.2s;
        }
        
        .q-card:hover {
            border-color: var(--primary-blue);
        }

        .q-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 10px;
        }
        .q-head-right { display: flex; align-items: center; gap: 12px; }
        
        .q-num {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; 
            background: var(--primary-light);
            color: var(--primary-blue); 
            font-weight: 800; font-size: 16px;
        }

        /* زر التعليل */
        .info-btn {
            display: flex;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #FFF;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 16px; font-weight: 900;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
        }
        .info-btn:hover { background: var(--accent-gold-light); }
        .info-btn.active { background: var(--accent-gold); color: #FFF; }

        /* نص السؤال */
        .q-text {
            margin: 0 0 12px 0; 
            font-size: 17px;
            font-weight: 700; line-height: 1.5;
            color: var(--text-main);
        }

        /* الخيارات */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px; 
        }
        
        .option {
            position: relative;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            min-height: 40px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #F8FAFC;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
        }
        
        .option .letter {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            background: #E2E8F0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 800;
            flex-shrink: 0;
        }
        
        .option .opt-text { flex: 1; }

        /* الإجابة الصحيحة */
        .option.correct { 
            border-color: var(--accent-green); 
            background: var(--accent-green-light); 
        }
        .option.correct .letter { background: var(--accent-green); color: #FFF; }
        .option.correct .opt-text { color: var(--accent-green); font-weight: 800; }
        .option.correct .mark { color: var(--accent-green); font-weight: bold; font-size: 20px; margin-inline-start: auto; }

        /* صندوق التعليل */
        .q-explanation {
            display: none;
            margin-top: 12px;
            padding: 12px 15px;
            background: var(--accent-gold-light);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            color: #92400E;
            line-height: 1.5;
        }
        .q-explanation strong { color: var(--primary-blue); }
        .q-explanation.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* فوتر الورقة */
        .footer-bar {
            position: absolute; bottom: 15px; left: 20px; right: 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--border-color); padding-top: 10px; z-index: 2;
        }
        .footer-brand { display: flex; align-items: center; gap: 8px; }
        .footer-logo { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--primary-blue); object-fit: cover; filter: grayscale(20%); }
        .footer-brand-name { font-size: 15px; font-weight: 900; color: var(--primary-blue); }
        .footer-center-text { flex-grow: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 700; }

        /* الطباعة */
        @page { size: A4; margin: 0; }
        @media print {
            html, body {
                background: #fff !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .page-wrapper {
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                display: block !important;
                break-after: page;
                page-break-after: always;
                break-inside: avoid;
            }
            .page-wrapper:last-child { break-after: auto; page-break-after: auto; }
            .a4-page {
                transform: none !important;
                box-shadow: none !important;
                height: 1123px !important;
                min-height: 1123px !important;
                overflow: hidden !important;
                margin: 0 auto;
                border-radius: 0 !important;
                border: none !important;
            }
            .a4-page::before { display: none; }
        }
    </style>
</head>

    { section: "تابع: الجزء السادس (صح وخطأ)", text: "1. يُعرف النظام بأنه مجموعة من العناصر أو المكونات المتداخلة والمترابطة التي تتفاعل مع بعضها البعض لتحقيق هدف محدد.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "2. ينشأ تعارض الأهداف عندما يكون نشاط النظام الفرعي منسجماً تمامًا مع النظام الرئيسي.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: عندما يكون غير منسجم." },
    { text: "3. الموارد المالية للنظام تشمل المحاسبين ومصممي النظم ومشغلي الحاسب الآلي.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هذه موارد بشرية، أما المالية فتشمل رأس المال." },
    { text: "4. تعني خاصية التكامل أن النتيجة الإجمالية التي تحققها أجزاء النظام عند تكاملها تفوق مجموع ناتج كل جزء على حدة.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "5. التغذية العكسية والرقابة هما مصطلحان متطابقان تمامًا ولا يوجد أي اختلاف بينهما في النموذج العام للنظام.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: مرتبطان ولكن مختلفان في الوظيفة والمصدر." },
    { text: "6. النظم التشغيلية (المصنوعة) هي وسيلة من صنع الإنسان يتحقق من خلالها أداء عملية معينة لبلوغ أهداف محددة.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "7. النظم المحتملة هي النظم التي يمكن التنبؤ بمخرجاتها بصورة مؤكدة بنسبة 100% بناءً على معرفة المدخلات.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هذه النظم المحددة، أما المحتملة فتعتمد على الاحتمالات." },
    { text: "8. النظم المستقرة هي التي تكون علاقاتها محددة بدقة، وإذا حدث بها اضطراب يكون مؤقتاً وسرعان ما تعود لحالتها الطبيعية.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "9. تُعد المنشآت الصناعية من أمثلة النظم المغلقة التي لا تؤثر في البيئة المحيطة ولا تتأثر بها.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هي نظم مفتوحة." },
    { text: "10. النظم المعدلة هي التي تستطيع تعديل نفسها ذاتياً للتكيف مع التغيرات البيئية مثل تحول البنك من النظام اليدوي للإلكتروني.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "11. المعلومات المحاسبية هي بيانات تم تصنيفها وترتيبها وتلخيصها وعرضها لتصبح ذات معنى مفيد في اتخاذ القرارات.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "12. المعرفة هي الحقائق الأولية الخام التي لم يتم معالجتها أو تنظيمها بعد.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هذه البيانات." },
    { text: "13. تعد خاصية «الشمول» و«الملاءمة» في المعلومات من الخصائص الملموسة التي يسهل قياسها كمياً بدقة.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هي خصائص غير ملموسة ويصعب قياسها." },
    { text: "14. يقصد بإمكانية التحقق توافر الأدلة المستندية على صحة المعلومات بحيث يمكن الرجوع إليها للتأكد من صحتها.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "15. طبقاً للإطار المفاهيمي، تُعد خاصية «التوقيت المناسب» و«القابلية للمقارنة» من الخصائص النوعية الأساسية.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هي من الخصائص المعززة." },
    { text: "16. هناك ثلاث خصائص فرعية تساهم في تحقيق التعبير الصادق وهي: الاكتمال، الموضوعية، والدقة.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "17. نظام المعلومات المحاسبي هو النظام الرئيسي الوحيد في المنشأة.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هو نظام فرعي." },
    { text: "18. يرجع اهتمام المقرضين بالمعلومات المحاسبية إلى رغبتهم في معرفة المركز المالي الحالي والمستقبلي وقدرة المنشأة على سداد التزاماتها.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "19. تندرج وظيفة «تلخيص البيانات» و«إجراء العمليات المحاسبية» تحت وظيفة إدارة البيانات.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: تندرج تحت وظيفة تشغيل البيانات." },
    { text: "20. يتكون نظام المعلومات المحاسبي الإلكتروني من أربعة عناصر هي: الأجهزة، برامج الحاسب، نظام إدارة قاعدة البيانات، وتكنولوجيا الاتصالات.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "21. أنظمة دعم التنفيذيين (ESS) مصممة لخدمة المستويات الإدارية الدنيا في العمليات الروتينية اليومية.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: مصممة لدعم الإدارة العليا." },
    { text: "22. في حالة عدم التأكد التام، يتم احتساب قيمة المعلومات بالأخذ في الاعتبار درجة المخاطر والاحتمالات الرياضية للعوائد.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "23. تُعد طلبات الشراء وأذون الصرف من المخازن من المستندات الخارجية للمنشأة.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هي مستندات داخلية." },
    { text: "24. من الاعتبارات الواجب مراعاتها عند تصميم المستندات أن يتضمن توقيع المسؤول عن تحريره.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "25. يُعد طلب الشراء من ثلاث نسخ؛ ترسل نسختان للمورد وتبقى نسخة في الإدارة الطالبة.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: يُعد من نسختين؛ الأصل للمشتريات وصورة للطالبة." },
    { text: "26. يتناسب الترميز طبقاً للحروف الأبجدية فقط مع المنشآت الصغيرة التي لديها عدد محدود من الحسابات.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "27. يجوز في دفتر اليومية القانوني الكشط والشطب والتحشير بين السطور طالما تم التوقيع بجانبه.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: يُحظر الشطب وإلا فقد الدفتر حجيته." },
    { text: "28. تعتمد الطريقة الإيطالية في إمساك الدفاتر على دفترين فقط هما دفتر اليومية العامة ودفتر الأستاذ العام.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "29. تُعد التقارير غير النمطية التي ينتجها نظام المحاسبة الإدارية موحدة الشكل والمضمون لجميع المنشآت.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: يتوقف شكلها على حاجة المستخدم." },
    { text: "30. يُعد وجود دليل الحسابات والموازنات التخطيطية من المقومات الإدارية للرقابة الداخلية.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هي من المقومات المحاسبية." },
    { text: "31. إجراء تنقلات دورية بين العاملين وإعطاؤهم إجازات إجبارية من أهم المقومات الإدارية لاكتشاف التلاعب.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "32. الرقابة المزدوجة تعني أن يقوم موظف واحد بأداء العملية من بدايتها إلى نهايتها لضمان السرعة.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: أداء العمل بواسطة شخصين." },
    { text: "33. يتم التقييم المستمر لنظام الرقابة الداخلية أثناء تأدية العمل وخلال تنفيذ النشاط.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "34. يستطيع الحاسب الآلي تحديد الهدف النهائي من إعداد البيانات والعمل بمعزل عن رغبات الإنسان.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: لا يحدد الهدف ويعمل طبقاً لرغبات الإنسان." },
    { text: "35. يجب ألا يتصل المبرمجون ومصممو الأنظمة بعملية التشغيل الفعلي للبيانات كأحد ضوابط تنظيم العمل.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "36. يُعد الاحتفاظ بنسخ احتياطية من الملفات والبرامج والتأمين على النظام من ضوابط الرقابة على المخرجات.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: من ضوابط حماية النظام الإلكتروني." },
    { text: "37. من ضوابط الرقابة على المخرجات مطابقة الإجماليات قبل الإدخال وبعد الإخراج والتأكد من تسليمها للمصرح لهم.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "38. يتولى المبرمج الإشراف على محلل النظم وتحديد أهداف النظام العام للمنشأة.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: المبرمج يعمل تحت إشراف محلل النظم." },
    { text: "39. يمكن الحصول على محلل نظم المعلومات المحاسبية إما بتعيينه من موظفي المنشأة أو الاستعانة باستشاري خارجي.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "40. تعمل الإدارة العليا غالباً في ظل ظروف التأكد التام وتعتمد قراراتها على بيانات داخلية قصيرة الأجل.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: تعمل في ظل عدم التأكد ومعلومات خارجية طويلة الأجل." },
    { text: "41. كلما زادت درجة تعقيد نظام المعلومات، أدى ذلك إلى إصابة موظفي الشركة بالإحباط لصعوبة فهم مكوناته.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "42. في ظل النظم الآلية الحديثة، يتم إلغاء كافة إجراءات المعالجة والرقابة اليدوية تماماً.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: تظل هناك إجراءات يدوية مثل تجميع المستندات." },
    { text: "43. ينبغي أن يتلاءم نظام المعلومات المحاسبية المصمم مع طبيعة نشاط المنشأة، لأن الاعتماد الأعمى على النظم المستوردة قد يؤدي للفشل.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "44. يتكون جدول القرارات من ثلاثة أجزاء رئيسية: جزء علوي، وجزء أوسط، وجزء سفلي.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: يتكون من جزئين فقط: علوي للشروط وسفلي للقرارات." },
    { text: "45. تُعد مرحلة التخطيط هي المرحلة الأولى التي تسبق عملية تحليل النظام وتشمل تعريف المشكلة وإعداد دراسة الجدوى.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "46. يمتاز مدخل «التحول المتوازي» بانخفاض التكلفة وعدم الحاجة إلى مجهود إضافي عند الانتقال للنظام الجديد.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: هو مكلف ويحتاج وقتاً لكنه آمن." },
    { text: "47. مرحلة توثيق النظام الجديد تعني تجميع كل المستندات الخاصة بالنظام وحفظها بصورة منظمة للرجوع إليها.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "48. تُعد خرائط تدفق النظم وسيلة اتصال فعالة لا تحتاج لتخصص دقيق في البرمجة، وتوضح خط سير البيانات.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },
    { text: "49. العلامة (-) في الجانب الأيسر السفلي من جدول القرارات تعني وجوب اتخاذ القرار وتنفيذ الفعل.", options: ["صح (√)", "خطأ (×)"], correct: 1, explanation: "التصحيح: تعني عدم اتخاذ القرار، بينما علامة (x) تعني وجوب اتخاذ القرار." },
    { text: "50. من عيوب جداول القرارات أنها لا تُظهر بوضوح التسلسل المنطقي الذي تُنفذ به العمليات بعكس خرائط تدفق البرامج.", options: ["صح (√)", "خطأ (×)"], correct: 0, explanation: "" },

    { section: "الجزء السابع: أسئلة تدريبية (اختيار من متعدد)", text: "1. ما التعريف الأدق للنظام؟", options: ["مجموعة عناصر مترابطة تتفاعل لتحقيق هدف محدد", "مجموعة مستندات لا تتغير", "برنامج حاسوبي فقط", "مجموعة أفراد دون هدف"], correct: 0, explanation: "" },
    { text: "2. أي مما يلي يُعد من الموارد المادية للنظام؟", options: ["الأفراد القائمون على التشغيل", "المطبوعات والمستندات والسجلات والدفاتر", "المديرون فقط", "العملاء والموردون"], correct: 1, explanation: "" },
    { text: "3. ماذا يعني الترتيب الهرمي للنظام؟", options: ["عدم وجود نظم فرعية", "تقسيم النظام إلى أجزاء فرعية، ثم تقسيم الأجزاء إلى أجزاء أدنى", "إلغاء حدود النظام", "تحويل المخرجات إلى مدخلات فقط"], correct: 1, explanation: "" },
    { text: "4. أي نوع من النظم لا يتدخل الإنسان في وجوده ويعمل تلقائيًا؟", options: ["النظام التشغيلي", "النظام الطبيعي", "النظام المغلق", "النظام المعدل"], correct: 1, explanation: "" },
    { text: "5. أي عبارة تصف النظم المحددة؟", options: ["تعتمد نتائجها فقط على الاحتمالات", "لا يمكن قياس نتائجها", "يمكن التنبؤ بمخرجاتها بصورة مؤكدة", "لا تحتوي على مدخلات"], correct: 2, explanation: "" },
    { text: "6. النظم التي تتفاعل باستمرار مع البيئة المحيطة تسمى:", options: ["نظماً مغلقة", "نظماً مفتوحة", "نظماً طبيعية فقط", "نظماً محددة فقط"], correct: 1, explanation: "" },
    { text: "7. ما المقصود بمدخلات النظام بصفة عامة؟", options: ["البيانات باعتبارها مادة خام تخضع للمعالجة", "القرارات النهائية فقط", "التغذية العكسية فقط", "المخرجات بعد استخدامها"], correct: 0, explanation: "" },
    { text: "8. ما الفرق الأدق بين التغذية العكسية والرقابة؟", options: ["لا يوجد فرق بينهما", "التغذية العكسية معلومات مرتبطة بالمخرجات، والرقابة معرفة بكيفية عمل النظام", "الرقابة مدخلات والتغذية العكسية موارد بشرية", "كلاهما مخرجات مالية فقط"], correct: 1, explanation: "" },
    { text: "9. ما المقصود بالبيانات المحاسبية؟", options: ["معلومات نهائية جاهزة للقرار", "حقائق أو مشاهدات خام لم تُعالج بعد", "تعليمات تشغيل النظام", "تقارير الإدارة فقط"], correct: 1, explanation: "" },
    { text: "10. المعلومات هي:", options: ["بيانات خام لم تُنظم", "ناتج معالجة وتنظيم البيانات لإعطاء معنى مفيد", "مستندات ورقية فقط", "مدخلات النظام حصراً"], correct: 1, explanation: "" },
    { text: "11. ماذا يحدث عند تقديم معلومات أكثر من اللازم لمتخذ القرار؟", options: ["تتحسن القرارات دائماً", "يحدث عبء المعلومات وقد تتدنى جودة القرارات", "تختفي الحاجة إلى الرقابة", "تتحول البيانات إلى موارد مادية"], correct: 1, explanation: "" },
    { text: "12. أي خاصية تعني خلو المعلومات من الأخطاء؟", options: ["الشمول", "المرونة", "الدقة", "إمكانية التحقق"], correct: 2, explanation: "" },
    { text: "13. وفقاً للإطار المفاهيمي للمعايير المحاسبية الدولية، إمكانية التحقق من الخصائص:", options: ["الأساسية", "المعززة أو المكملة", "التشغيلية", "الداخلية"], correct: 1, explanation: "" },
    { text: "14. ما طبيعة نظام المعلومات المحاسبي داخل المنشأة؟", options: ["النظام الرئيسي الوحيد", "نظام فرعي يحول البيانات المحاسبية إلى معلومات", "نظام لا يرتبط بالقرار", "نظام خاص بالمستخدمين الخارجيين فقط"], correct: 1, explanation: "" },
    { text: "15. أي مجموعة تمثل مستخدمين خارجيين للمعلومات المحاسبية؟", options: ["مجلس الإدارة ومدير الإنتاج", "الموردون والعملاء والمساهمون والجهات الحكومية", "المحاسبون ومديرو الأقسام فقط", "موظفو نظم المعلومات فقط"], correct: 1, explanation: "" },
    { text: "16. يمكن أن يكون ترميز البيانات في نظام المعلومات المحاسبي على شكل:", options: ["حروف فقط", "أرقام فقط", "حروف أو أرقام أو كليهما", "صور دون رموز"], correct: 2, explanation: "" },
    { text: "17. أي مما يلي يمثل مكونات النظام المحاسبي اليدوي؟", options: ["أجهزة وبرامج وشبكات", "موارد بشرية ومخزون بيانات وإجراءات", "معالجات إلكترونية فقط", "أقمار صناعية وبرامج اتصال"], correct: 1, explanation: "" },

const LETTERS = ['أ', 'ب', 'ج', 'د'];
const container = document.getElementById('pagesContainer');

function renderPaginatedPages() {
    container.innerHTML = '';
    
    const measureBox = document.createElement('div');
    measureBox.style.position = 'absolute';
    measureBox.style.visibility = 'hidden';
    measureBox.style.width = '764px'; 
    document.body.appendChild(measureBox);
    
    const measureWrapper = document.createElement('div');
    measureWrapper.className = 'content-wrapper';
    measureWrapper.style.padding = '0'; 
    measureBox.appendChild(measureWrapper);

    measureWrapper.innerHTML = `<header class="hero-header"><h1>عنوان</h1><p>وصف</p></header>`;
    const headerH = measureWrapper.offsetHeight;

    measureWrapper.innerHTML = `<div class="section-divider">فاصل</div>`;
    const dividerH = measureWrapper.offsetHeight;

    const qHeights = QUIZ.map((q) => {
        measureWrapper.innerHTML = `
            <div class="q-card">
                <div class="q-head">
                    <span class="q-num">1</span>
                </div>
                <p class="q-text">${q.text}</p>
                <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                    ${q.options.map((opt, j) => `
                        <div class="option">
                            <span class="letter">${LETTERS[j]}</span>
                            <span class="opt-text">${opt}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        return measureWrapper.offsetHeight;
    });

    document.body.removeChild(measureBox);

    const availableHeight = 1123 - 15 - 45 - 40; 
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;

    for (let i = 0; i < QUIZ.length; i++) {
        let required = qHeights[i];
        
        if (QUIZ[i].section) {
            required += dividerH;
        }

        if (pages.length === 0 && currentPage.length === 0) {
            required += headerH;
        }

        if (currentPage.length > 0 && (currentHeight + required > availableHeight)) {
            pages.push(currentPage);
            currentPage = [];
            currentHeight = 0;
            required = qHeights[i] + (QUIZ[i].section ? dividerH : 0);
        }

        currentPage.push(i);
        currentHeight += qHeights[i];
        
        if (QUIZ[i].section) {
            currentHeight += dividerH;
        }

        if (pages.length === 0 && currentPage.length === 1) {
            currentHeight += headerH;
        }
    }
    if (currentPage.length > 0) {
        pages.push(currentPage);
    }

    const totalPages = pages.length;

    pages.forEach((pageIndices, pageIdx) => {
        let pageHTML = `
        <div class="page-wrapper">
            <div class="a4-page">
                <div class="watermark"></div>
                <div class="content-wrapper">
        `;

        if (pageIdx === 0) {
            pageHTML += `
                <header class="hero-header">
                    <h1>بنك أسئلة نظم المعلومات المحاسبية</h1>
                    <p>الميد ترم - بالحل </p>
                </header>
            `;
        }

        pageIndices.forEach(globalIndex => {
            const q = QUIZ[globalIndex];
            
            if (q.section) {
                pageHTML += `<div class="section-divider">${q.section}</div>`;
            }

            const isGeneric = q.explanation === 'صح.' || q.explanation === 'خطأ.' || 
                              q.explanation === q.options[q.correct] || 
                              q.explanation.length <= q.options[q.correct].length + 3 || 
                              q.explanation === "";

            pageHTML += `
                <div class="q-card" data-card="${globalIndex}">
                    <div class="q-head">
                        <div class="q-head-right">
                            <span class="q-num">${globalIndex + 1}</span>
                            ${!isGeneric ? `<button class="info-btn" id="btn-${globalIndex}" onclick="toggleExplanation(${globalIndex})" title="التعليل">!</button>` : ''}
                        </div>
                    </div>
                    <p class="q-text">${q.text}</p>
                    <div class="q-options" style="${q.options.length === 2 ? 'grid-template-columns: 1fr 1fr;' : ''}">
                        ${q.options.map((opt, j) => {
                            const isCorrect = (j === q.correct);
                            return `
                            <div class="option ${isCorrect ? 'correct' : ''}">
                                <span class="letter">${LETTERS[j]}</span>
                                <span class="opt-text">${opt}</span>
                                ${isCorrect ? '<span class="mark">✓</span>' : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>
                    ${!isGeneric ? `
                    <div class="q-explanation" id="exp-${globalIndex}">
                        <strong>التعليل: </strong>${q.explanation}
                    </div>
                    ` : ''}
                </div>
            `;
        });

        pageHTML += `
                </div>
                <div class="footer-bar">
                    <div class="footer-brand">
                        <img src="https://i.postimg.cc/xC0xjL0s/Picsart-24-09-19-23-01-07-444.jpg" class="footer-logo" alt="لوجو الدحيح">
                        <div class="footer-brand-name">الدحيح</div>
                    </div>
                    <div class="footer-center-text">صفحة ${pageIdx + 1} من ${totalPages} | نظم المعلومات المحاسبية</div>
                </div>
            </div>
        </div>
        `;

        container.innerHTML += pageHTML;
    });

    setTimeout(scalePages, 100);
}

function scalePages() {
    const pageWidth = 794;
    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    const availableWidth = viewportWidth - 20;
    const scale = Math.min(1, availableWidth / pageWidth);

    document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const page = wrapper.querySelector('.a4-page');
        if (scale < 1) {
            page.style.transform = `scale(${scale})`;
            page.style.transformOrigin = 'top center';
            
            const actualHeight = page.offsetHeight; 
            wrapper.style.height = `${actualHeight * scale}px`;
        } else {
            page.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    });
}

window.addEventListener('load', scalePages);
window.addEventListener('resize', scalePages);
window.addEventListener('orientationchange', scalePages);

window.toggleExplanation = function(index) {
    const expBox = document.getElementById(`exp-${index}`);
    const btn = document.getElementById(`btn-${index}`);
    const isCurrentlyOpen = expBox.classList.contains('show');

    document.querySelectorAll('.q-explanation').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.info-btn').forEach(el => el.classList.remove('active'));

    if (!isCurrentlyOpen) {
        expBox.classList.add('show');
        btn.classList.add('active');
    }

    setTimeout(scalePages, 50); 
};

renderPaginatedPages();
</script>
