<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحضير المحاضرة - الدحيح</title>
    
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- استخدام مكتبة html2pdf الذكية لمنع قص الأسئلة من المنتصف -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; }
        body { background: #0F172A; color: #FFFFFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .loader-box, .success-box, .error-box { background: #1E293B; padding: 40px; border-radius: 24px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .loader-box .material-icons { font-size: 70px; color: #3B82F6; margin-bottom: 20px; animation: pulse 1s infinite; }
        .loader-box h3, .success-box h3, .error-box h3 { font-weight: 900; font-size: 1.6rem; margin-bottom: 15px; color: #F8FAFC; }
        .loader-box p, .error-box p { color: #94A3B8; font-size: 1rem; line-height: 1.6; }
        .success-box { display: none; }
        .error-box { display: none; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1); } }
    </style>
</head>
<body>

    <div class="loader-box" id="loaderBox">
        <span class="material-icons">auto_mode</span>
        <h3>جاري تجهيز المحاضرة...</h3>
        <p>يتم الآن ختم الملف باسمك وضبط الصفحات لمنع القص. يرجى الانتظار.</p>
    </div>
    
    <div class="success-box" id="successBox"></div>
    
    <div class="error-box" id="errorBox">
        <span class="material-icons" style="font-size:70px; color:#EF4444;">gpp_bad</span>
        <h3>رابط غير صالح!</h3>
        <p>هذا الرابط تالف أو تم التلاعب به. يرجى التحميل من داخل المنصة فقط.</p>
    </div>

    <script>
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        function textToImage(text) {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const font = "bold 45px 'IBM Plex Sans Arabic', sans-serif";
            ctx.font = font;
            const size = Math.ceil(ctx.measureText(text).width) + 100;
            c.width = size; c.height = size;
            ctx.translate(size / 2, size / 2);
            ctx.rotate(-Math.PI / 4);
            ctx.font = font;
            ctx.textBaseline = 'middle';
            ctx.direction = 'rtl';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(200, 200, 200, 0.4)'; 
            ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
            ctx.shadowBlur = 4;
            ctx.fillText(text, 0, 0);
            return { data: c.toDataURL('image/png'), size: size };
        }

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const encodedData = params.get('token'); 

            if (!encodedData) {
                document.getElementById('loaderBox').style.display = 'none';
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            let decodedString = '';
            try {
                decodedString = decodeURIComponent(escape(window.atob(encodedData)));
            } catch (e) {
                document.getElementById('loaderBox').style.display = 'none';
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            const parts = decodedString.split('|DAHEEH|');
            if (parts.length !== 3) {
                document.getElementById('loaderBox').style.display = 'none';
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            const file = parts[0];
            const name = parts[1];
            const code = parts[2];

            let cleanUrl = file.trim();
            if (!cleanUrl.startsWith('http')) {
                cleanUrl = window.location.origin + window.location.pathname.replace(/[^\/]+$/, '') + cleanUrl;
            }
            
            const watermarkText = `${name} - ${code}`;

            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'position:fixed; left:-9999px; top:0; width:1000px; height:100vh; border:none; background:#fff;';
            
            iframe.src = cleanUrl + (cleanUrl.includes('?') ? '&' : '?') + 'admin=daheeh&t=' + Date.now();
            document.body.appendChild(iframe);

            iframe.onload = async () => {
                try {
                    await sleep(3500); 

                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    const shield = doc.getElementById('antiScreenshotShield');
                    if (shield) shield.style.display = 'none';

                    // 🔥 السر هنا: وضع قواعد صارمة تمنع المتصفح من قص الأسئلة أو النصوص من المنتصف
                    const style = doc.createElement('style');
                    style.innerHTML = `
                        /* منع قص العناصر من المنتصف وتوجيهها للصفحة التالية */
                        p, h1, h2, h3, h4, h5, h6, img, ul, li, table, tr, td, fieldset, .question, .quiz-opt, .card {
                            page-break-inside: avoid !important;
                            break-inside: avoid !important;
                        }
                        /* الديفات الداخلية لا يتم قصها */
                        div {
                            page-break-inside: avoid;
                            break-inside: avoid;
                        }
                        /* السماح بكسر الصفحة للحاويات الأساسية الكبيرة فقط */
                        body, html, main, section, #pagesContainer, .container {
                            page-break-inside: auto !important;
                            break-inside: auto !important;
                            height: auto !important;
                            overflow: visible !important;
                        }
                        /* إصلاح مشكلة المسافات الغريبة في الكلمات */
                        * {
                            letter-spacing: normal !important;
                            word-spacing: normal !important;
                        }
                    `;
                    doc.head.appendChild(style);

                    // تحويل النصوص اللي مضبوطة من الجانبين لليمين فقط لمنع التباعد الغريب
                    const allTextElements = doc.querySelectorAll('*');
                    allTextElements.forEach(el => {
                        const computed = window.getComputedStyle(el);
                        if (computed.textAlign === 'justify') {
                            el.style.setProperty('text-align', 'right', 'important');
                        }
                    });

                    const gradientTitles = doc.querySelectorAll('*[style*="background-clip: text"], .gradient-text');
                    gradientTitles.forEach(el => {
                        el.style.background = 'none';
                        el.style.color = '#2563EB';
                        el.style.webkitTextFillColor = 'initial';
                    });

                    const bodyStyles = window.getComputedStyle(doc.body);
                    let bgColor = bodyStyles.backgroundColor;
                    if (bgColor === 'rgba(0, 0, 0, 0)' || bgColor === 'transparent') bgColor = '#ffffff';

                    // إعدادات html2pdf الاحترافية مع هوامش 15 مم من كل الجوانب
                    const safeTitle = (file.split('/').pop().split('.')[0] || 'Lecture').replace(/[\\/:*?"<>| ]/g, '_').trim();
                    const safeName = name.replace(/[\\/:*?"<>| ]/g, '_').trim();
                    const fileName = `محاضرة_${safeTitle}_${safeName}_${code}.pdf`;

                    const opt = {
                        margin:       [15, 10, 15, 10], // هوامش أعلى، يمين، أسفل، يسار
                        filename:     fileName,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true, logging: false, backgroundColor: bgColor, windowWidth: 1000 },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: ['css', 'legacy'] } // تفعيل نظام الفواصل الذكي
                    };

                    const watermarkImg = textToImage(watermarkText);
                    const wmSize = 90;
                    const element = doc.getElementById('pagesContainer') || doc.body;

                    // توليد الـ PDF وطباعة العلامة المائية على كل الصفحات
                    html2pdf().set(opt).from(element).toPdf().get('pdf').then(function(pdf) {
                        const totalPages = pdf.internal.getNumberOfPages();
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();
                        
                        for (let i = 1; i <= totalPages; i++) {
                            pdf.setPage(i);
                            for (let x = -30; x < pdfWidth + 30; x += 110) {
                                for (let y = -30; y < pdfHeight + 30; y += 100) {
                                    pdf.addImage(watermarkImg.data, 'PNG', x, y, wmSize, wmSize);
                                }
                            }
                        }
                    }).save().then(() => {
                        document.getElementById('loaderBox').style.display = 'none';
                        const successBox = document.getElementById('successBox');
                        successBox.style.display = 'block';
                        successBox.innerHTML = `
                            <span class="material-icons" style="font-size:70px; color:#10B981; animation:none;">check_circle</span>
                            <h3 style="font-weight:900; font-size:1.6rem; color:#F8FAFC; margin-bottom:15px;">تم التحميل بنجاح! 🚀</h3>
                            <p style="color:#94A3B8; margin-bottom:20px; font-size:1rem; line-height:1.6;">تم تنزيل المحاضرة في مجلد التنزيلات (Downloads) بجهازك بنجاح.</p>
                            <button onclick="window.close()" style="display:flex; align-items:center; justify-content:center; gap:10px; background:#2563EB; color:white; border:none; padding:16px 20px; border-radius:14px; font-weight:900; font-size:1.1rem; cursor:pointer; width:100%; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); margin-bottom:12px; font-family:inherit;">
                                <span class="material-icons">close</span> إغلاق الصفحة
                            </button>
                        `;
                    });

                } catch (err) {
                    console.error("Error:", err);
                    document.getElementById('loaderBox').style.display = 'none';
                    document.getElementById('errorBox').style.display = 'block';
                    document.getElementById('errorBox').querySelector('h3').innerText = 'حدث خطأ!';
                    document.getElementById('errorBox').querySelector('p').innerText = 'تعذر تحميل الملف، يرجى التأكد من الإنترنت.';
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        };
    </script>
</body>
</html>
