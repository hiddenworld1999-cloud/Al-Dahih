<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحضير المحاضرة - الدحيح</title>
    
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; }
        body { background: #0F172A; color: #FFFFFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .loader-box { background: #1E293B; padding: 40px; border-radius: 24px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .loader-box .material-icons { font-size: 70px; color: #3B82F6; margin-bottom: 20px; animation: pulse 1s infinite; }
        .loader-box h3 { font-weight: 900; font-size: 1.6rem; margin-bottom: 15px; color: #F8FAFC; }
        .loader-box p { color: #94A3B8; font-size: 1rem; line-height: 1.6; }

        .success-box { display: none; background: #1E293B; padding: 40px; border-radius: 24px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .success-box .material-icons { font-size: 70px; color: #10B981; margin-bottom: 20px; animation: none; }
        .success-box h3 { font-weight: 900; font-size: 1.6rem; margin-bottom: 15px; color: #F8FAFC; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="loader-box" id="loaderBox">
        <span class="material-icons">auto_mode</span>
        <h3>جاري تجهيز المحاضرة...</h3>
        <p>يتم الآن ختم الملف باسمك وكودك ورفعه بجودة عالية. يرجى عدم إغلاق المتصفح حتى يتم التحميل.</p>
    </div>
    
    <div class="success-box" id="successBox">
        <span class="material-icons">check_circle</span>
        <h3>تم التحميل بنجاح! 🚀</h3>
        <p style="color: #94A3B8; margin-bottom: 20px;">تم حفظ المحاضرة في جهازك. يمكنك الآن العودة للتطبيق.</p>
        <button onclick="window.close()" style="background:#2563EB; color:white; border:none; padding:15px 30px; border-radius:14px; font-weight:bold; font-size:1.1rem; cursor:pointer; width:100%; font-family:inherit;">إغلاق الصفحة</button>
    </div>

    <script>
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        function textToImage(text) {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            const font = "bold 45px 'IBM Plex Sans Arabic', sans-serif";
            ctx.font = font;
            const size = Math.ceil(ctx.measureText(text).width) + 100;
            c.width = size; c.height = size;
            ctx.translate(size / 2, size / 2);
            ctx.rotate(-Math.PI / 4);
            ctx.font = font;
            ctx.textBaseline = 'middle';
            ctx.direction = 'rtl';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(200, 200, 200, 0.4)'; 
            ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
            ctx.shadowBlur = 4;
            ctx.fillText(text, 0, 0);
            return { data: c.toDataURL('image/png'), size: size };
        }

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const file = params.get('file');
            const name = params.get('name');
            const code = params.get('code');

            if (!file || !name || !code) {
                document.getElementById('loaderBox').innerHTML = `<span class="material-icons" style="color:#ef4444; animation:none;">error</span><h3>رابط غير صالح</h3><p>يرجى فتح هذا الرابط من داخل التطبيق فقط.</p>`;
                return;
            }

            let cleanUrl = file.trim();
            if (!cleanUrl.startsWith('http')) {
                cleanUrl = window.location.origin + window.location.pathname.replace(/[^\/]+$/, '') + cleanUrl;
            }
            
            const watermarkText = `${name} - ${code}`;

            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'position:fixed; left:-9999px; top:0; width:900px; height:100vh; border:none; background:#fff;';
            
            // 🔥 هنا السر: الأداة بتبعت كود الأدمن للمحاضرة عشان تفتح وماتطردش الطالب
            iframe.src = cleanUrl + (cleanUrl.includes('?') ? '&' : '?') + 'admin=daheeh&t=' + Date.now();
            document.body.appendChild(iframe);

            iframe.onload = async () => {
                try {
                    await sleep(3500); 

                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    const shield = doc.getElementById('antiScreenshotShield');
                    if (shield) shield.style.display = 'none';

                    const gradientTitles = doc.querySelectorAll('*[style*="background-clip: text"], .gradient-text');
                    gradientTitles.forEach(el => {
                        el.style.background = 'none';
                        el.style.color = '#2563EB';
                        el.style.webkitTextFillColor = 'initial';
                    });

                    const bodyStyles = window.getComputedStyle(doc.body);
                    let bgColor = bodyStyles.backgroundColor;
                    if (bgColor === 'rgba(0, 0, 0, 0)' || bgColor === 'transparent') bgColor = '#0F172A';
                    
                    let rgb = [15, 23, 42];
                    const rgbMatch = bgColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                    if (rgbMatch) rgb = [parseInt(rgbMatch[1]), parseInt(rgbMatch[2]), parseInt(rgbMatch[3])];

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const fillBackground = () => {
                        pdf.setFillColor(rgb[0], rgb[1], rgb[2]);
                        pdf.rect(0, 0, pdfWidth, pdfHeight, 'F');
                    };
                    
                    const watermarkImg = textToImage(watermarkText);
                    const wmSize = 90; 

                    const drawWatermark = () => {
                        for (let x = -30; x < pdfWidth + 30; x += 110) {
                            for (let y = -30; y < pdfHeight + 30; y += 100) {
                                pdf.addImage(watermarkImg.data, 'PNG', x, y, wmSize, wmSize);
                            }
                        }
                    };

                    const pages = doc.querySelectorAll('.a4-page');
                    if (pages.length > 0) {
                        for (let i = 0; i < pages.length; i++) {
                            const canvas = await html2canvas(pages[i], { scale: 3, useCORS: true, logging: false, backgroundColor: bgColor });
                            const imgData = canvas.toDataURL('image/jpeg', 0.98);
                            if (i > 0) pdf.addPage();
                            fillBackground();
                            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, (canvas.height * pdfWidth) / canvas.width);
                            drawWatermark();
                        }
                    } else {
                        const containerToCapture = doc.getElementById('pagesContainer') || doc.body;
                        const canvas = await html2canvas(containerToCapture, { scale: 3, useCORS: true, logging: false, backgroundColor: bgColor });
                        const imgData = canvas.toDataURL('image/jpeg', 0.98);
                        const imgHeightInMM = (canvas.height * pdfWidth) / canvas.width;
                        let heightLeft = imgHeightInMM;
                        let position = 0;

                        fillBackground();
                        pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMM);
                        drawWatermark();
                        heightLeft -= pdfHeight;

                        while (heightLeft > 0) {
                            position = heightLeft - imgHeightInMM;
                            pdf.addPage();
                            fillBackground();
                            pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMM);
                            drawWatermark();
                            heightLeft -= pdfHeight;
                        }
                    }

                    const safeTitle = (file.split('.')[0] || 'Lecture').replace(/[\\/:*?"<>| ]/g, '_').trim();
                    const safeName = name.replace(/[\\/:*?"<>| ]/g, '_').trim();
                    pdf.save(`محاضرة_${safeTitle}_${safeName}_${code}.pdf`);

                    document.getElementById('loaderBox').style.display = 'none';
                    document.getElementById('successBox').style.display = 'block';

                } catch (err) {
                    console.error("Error:", err);
                    document.getElementById('loaderBox').innerHTML = `<span class="material-icons" style="color:#ef4444; animation:none;">error</span><h3>حدث خطأ!</h3><p>تعذر تحميل الملف، يرجى المحاولة مرة أخرى.</p>`;
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        };
    </script>
</body>
</html>
